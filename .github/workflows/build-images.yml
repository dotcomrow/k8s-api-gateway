name: Build and Push Gravitee Images

on:
  push:
    branches: [ prod, main ]
    paths:
      - 'Dockerfile.*'
      - 'src/**'
      - '.github/workflows/build-images.yml'
  pull_request:
    branches: [ prod, main ]
    paths:
      - 'Dockerfile.*' 
      - 'src/**'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Tag suffix (e.g., "-hotfix")'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  NAMESPACE: dotcomrow

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service: [management-api, gateway, portal, apisix]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

    # Login to GitHub Container Registry
    - name: Log in to GHCR
      run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

    - name: Set timestamp tag
      id: set-tag
      run: |
        echo "tag=ts-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
        echo "latest_tag=latest" >> "$GITHUB_OUTPUT"

    - name: Generate image metadata
      id: meta
      uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893
      with:
        images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/gravitee-${{ matrix.service }}
        tags: |
          type=raw,value=${{ steps.set-tag.outputs.tag }}
          type=raw,value=${{ steps.set-tag.outputs.latest_tag }}
        labels: |
          org.opencontainers.image.title=Gravitee ${{ matrix.service }}
          org.opencontainers.image.description=Custom Gravitee.io ${{ matrix.service }} with YugabyteDB support
          org.opencontainers.image.vendor=dotcomrow

    - name: Build and push Docker image
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
      with:
        context: .
        file: ./Dockerfile.${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDTIME=${{ github.run_number }}
          COMMIT_SHA=${{ github.sha }}

    - name: Generate build summary
      run: |
        echo "## 🚀 Gravitee ${{ matrix.service }} Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "- **Service**: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Registry**: \`${{ env.REGISTRY }}/${{ env.NAMESPACE }}/gravitee-${{ matrix.service }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp Tag**: \`${{ steps.set-tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Latest Tag**: \`${{ steps.set-tag.outputs.latest_tag }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Platforms**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**To deploy this version, update the manifest:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
        echo "image: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/gravitee-${{ matrix.service }}:${{ steps.set-tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  security-scan:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      security-events: write
    
    strategy:
      matrix:
        service: [management-api, gateway, portal, apisix]
    
    steps:
    - name: Log in to GHCR for scanning
      run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

    - name: Run Trivy vulnerability scanner
      id: trivy
      uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
      continue-on-error: true
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/gravitee-${{ matrix.service }}:latest
        format: 'sarif'
        output: 'trivy-results-${{ matrix.service }}.sarif'

    - name: Check if SARIF file exists
      id: sarif-check
      run: |
        if [ -f "trivy-results-${{ matrix.service }}.sarif" ]; then
          echo "sarif-exists=true" >> $GITHUB_OUTPUT
          echo "✅ SARIF file generated for ${{ matrix.service }}"
        else
          echo "sarif-exists=false" >> $GITHUB_OUTPUT
          echo "❌ SARIF file not generated for ${{ matrix.service }}"
        fi

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@17783bfb99b07f70fae080b654aed0c514057477
      if: steps.sarif-check.outputs.sarif-exists == 'true'
      with:
        sarif_file: 'trivy-results-${{ matrix.service }}.sarif'
