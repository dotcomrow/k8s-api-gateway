---
# ConfigMap for APISIX Route Configuration Job
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-routes-config
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "5"
data:
  configure-routes.sh: |
    #!/bin/sh
    set -e

    configure_routes() {
      admin_url="$1"
      admin_key="$2"
      label="$3"

      if [ -z "$admin_url" ] || [ -z "$admin_key" ]; then
        echo "⚠️ Skipping ${label} APISIX (missing admin URL or key)"
        return 0
      fi

      echo "🔧 Configuring APISIX routes for ${label}..."
      until curl -f -s "${admin_url}/apisix/admin/routes" -H "X-API-KEY: ${admin_key}" > /dev/null 2>&1; do
        echo "⏳ Waiting for ${label} APISIX Admin API..."
        sleep 5
      done

      echo "✅ ${label} APISIX Admin API is ready"

      echo "⚡ Creating Gravitee Gateway route on ${label}..."
      curl -X PUT "${admin_url}/apisix/admin/routes/gravitee-gateway" \
        -H "X-API-KEY: ${admin_key}" \
        -H "Content-Type: application/json" \
        -d '{
          "name": "gravitee-gateway",
          "desc": "Route to Gravitee Gateway for API runtime execution",
          "uri": "/gateway/*",
          "methods": ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH", "HEAD"],
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082": 1
            }
          },
          "plugins": {
            "request-id": {
              "header_name": "x-request-id",
              "include_in_response": true
            },
            "real-ip": {
              "source": "X-Forwarded-For",
              "recursive": true
            },
            "cors": {
              "allow_origins": "http://apisix.k8s-api-gateway.svc.cluster.local",
              "allow_methods": "GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD",
              "allow_headers": "Authorization,Content-Type,X-Requested-With,Accept,X-Real-IP,X-Forwarded-For,X-Request-Id",
              "expose_headers": "X-Request-Id",
              "allow_credential": true,
              "max_age": 3600
            },
            "opentelemetry": {
              "sampler": {
                "name": "always_on"
              },
              "collector": {
                "address": "http://otel-collector.observability.svc.cluster.local:4318",
                "request_type": "http"
              },
              "resource": {
                "service.name": "gravitee-gateway",
                "service.namespace": "k8s-api-gateway"
              }
            },
            "proxy-rewrite": {
              "regex_uri": ["^/gateway(.*)", "$1"],
              "append_headers": {
                "X-Forwarded-Proto": "$scheme",
                "X-Forwarded-Host": "$host"
              }
            }
          }
        }'

      echo "⚡ Creating Gravitee Portal API route on ${label}..."
      curl -X PUT "${admin_url}/apisix/admin/routes/gravitee-portal-api" \
        -H "X-API-KEY: ${admin_key}" \
        -H "Content-Type: application/json" \
        -d '{
          "name": "gravitee-portal-api",
          "desc": "Route to Gravitee Management API portal endpoints with CORS for management UI",
          "priority": 100,
          "uri": "/portal/*",
          "hosts": ["gravitee.teleport.app.suncoast.systems"],
          "methods": ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH", "HEAD"],
          "upstream": {
            "type": "roundrobin",
            "nodes": {
              "gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083": 1
            }
          },
          "plugins": {
            "cors": {
              "allow_origins": "https://gravitee-management.teleport.app.suncoast.systems",
              "allow_methods": "GET,POST,PUT,DELETE,PATCH,OPTIONS,HEAD",
              "allow_headers": "Authorization,Content-Type,X-Requested-With,Accept,X-Real-IP,X-Forwarded-For,X-Request-Id,If-Match,If-None-Match,X-Gravitee-*",
              "expose_headers": "ETag, X-Gravitee-*",
              "allow_credential": true,
              "max_age": 1728000
            },
            "real-ip": {
              "source": "X-Forwarded-For",
              "recursive": true
            },
            "request-id": {
              "header_name": "x-request-id",
              "include_in_response": true
            }
          }
        }'

      echo "✅ ${label} APISIX routes configured"
    }

    if [ -f /vault/secrets/admin ]; then
      . /vault/secrets/admin
      configure_routes "${APISIX_ADMIN_URL:-http://apisix-admin.k8s-api-gateway.svc.cluster.local:9180}" "${APISIX_ADMIN_KEY:-}" "k8s-api-gateway"
    else
      echo "⚠️ Missing /vault/secrets/admin; skipping k8s-api-gateway APISIX config"
    fi

    configure_routes "${APISIX_PUBLIC_ADMIN_URL:-}" "${APISIX_PUBLIC_ADMIN_KEY:-}" "shared"

    echo "📋 Gateway Access:"
    echo "   - Gravitee Gateway: http://<apisix-host>/gateway/"
---
# Job to configure APISIX routes after deployment
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-apisix-routes
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    linkerd.io/inject: "disabled"
spec:
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "apisix"
        vault.hashicorp.com/agent-inject-secret-admin: "secret/apisix/admin"
        vault.hashicorp.com/agent-inject-template-admin: |
          {{- with secret "secret/apisix/admin" -}}
          export APISIX_ADMIN_KEY="{{ .Data.data.key }}"
          {{- end }}
    spec:
      serviceAccountName: apisix
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-apisix
        image: curlimages/curl:8.11.1
        command:
        - sh
        - -c
        - |
          echo "⏳ Waiting for APISIX to be ready..."
          RETRY_COUNT=0
          MAX_RETRIES=120
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -s -o /dev/null http://apisix.k8s-api-gateway.svc.cluster.local:80/; then
              echo "✅ APISIX is ready"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Waiting for APISIX... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            sleep 5
          done
          echo "❌ APISIX not ready after $MAX_RETRIES attempts"
          exit 1
      - name: wait-for-gravitee
        image: curlimages/curl:8.11.1
        command:
        - sh  
        - -c
        - |
          echo "⏳ Waiting for Gravitee services to be ready..."
          RETRY_COUNT=0
          MAX_RETRIES=120
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Check Gravitee Management API
            if curl -s -o /dev/null http://gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083/management/platform; then
              echo "✅ Gravitee Management API is ready"
              if curl -s -o /dev/null http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082/_node/health; then
                echo "✅ Gravitee Gateway is ready"
                echo "✅ Gravitee services are ready"
                exit 0
              fi
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Waiting for Gravitee services... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            sleep 10
          done
          echo "❌ Gravitee services not ready after $MAX_RETRIES attempts"
          exit 1
      containers:
      - name: configure-routes
        image: curlimages/curl:8.11.1
        env:
        - name: APISIX_ADMIN_URL
          value: "http://apisix-admin.k8s-api-gateway.svc.cluster.local:9180"
        - name: APISIX_PUBLIC_ADMIN_URL
          value: "http://apisix-admin.apisix.svc.cluster.local:9180"
        - name: APISIX_PUBLIC_ADMIN_KEY
          value: "edd1c9f034335f136f87ad84b625c8f1"
        command:
        - /bin/sh
        - -c
        - |
          if [ -f /vault/secrets/admin ]; then
            . /vault/secrets/admin
            echo "✅ APISIX admin key loaded from Vault"
          else
            echo "❌ Failed to load APISIX admin key from Vault"
            exit 1
          fi
          /bin/sh /scripts/configure-routes.sh
        volumeMounts:
        - name: routes-config
          mountPath: /scripts
      volumes:
      - name: routes-config
        configMap:
          name: apisix-routes-config
          defaultMode: 0755
