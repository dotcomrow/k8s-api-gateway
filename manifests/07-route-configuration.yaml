---
# ConfigMap for APISIX Route Configuration Job
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-routes-config
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "5"
data:
  configure-routes.sh: |
    #!/bin/sh
    set -e
    
    echo "🔧 Configuring APISIX route for Gravitee gateway access..."
    source /vault/secrets/admin
    # Wait for APISIX Admin API to be ready
    until curl -f -s http://apisix-admin.k8s-api-gateway.svc.cluster.local:9180/apisix/admin/routes -H "X-API-KEY: $APISIX_ADMIN_KEY" > /dev/null 2>&1; do
      echo "⏳ Waiting for APISIX Admin API..."
      sleep 5
    done
    
    echo "✅ APISIX Admin API is ready"
    
    # Create route for Gravitee Gateway (API runtime)  
    echo "⚡ Creating Gravitee Gateway route..."
    curl -X PUT "http://apisix-admin.k8s-api-gateway.svc.cluster.local:9180/apisix/admin/routes/gravitee-gateway" \
      -H "X-API-KEY: $APISIX_ADMIN_KEY" \
      -H "Content-Type: application/json" \
      -d '{
        "name": "gravitee-gateway",
        "desc": "Route to Gravitee Gateway for API runtime execution",
        "uri": "/gateway/*",
        "methods": ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH", "HEAD"],
        "upstream": {
          "type": "roundrobin",
          "nodes": {
            "gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082": 1
          }
        },
        "plugins": {
          "request-id": {
            "header_name": "x-request-id",
            "include_in_response": true
          },
          "real-ip": {
            "source": "X-Forwarded-For",
            "recursive": true
          },
          "cors": {
            "allow_origins_by_regex": ["https://.*"],
            "allow_methods": ["GET","POST","PUT","DELETE","PATCH","OPTIONS","HEAD"],
            "allow_headers": ["*"],
            "expose_headers": ["*"],
            "allow_credential": true,
            "max_age": 3600
          },
          "opentelemetry": {
            "sampler": {
              "name": "always_on"
            },
            "collector": {
              "address": "http://otel-collector.observability.svc.cluster.local:4318",
              "request_type": "http"
            },
            "resource": {
              "service.name": "gravitee-gateway",
              "service.namespace": "k8s-api-gateway"
            }
          },
          "proxy-rewrite": {
            "regex_uri": ["^/gateway(.*)", "$1"],
            "append_headers": {
              "X-Forwarded-Proto": "$scheme",
              "X-Forwarded-Host": "$host"
            }
          }
        }
      }'
    
    echo "✅ APISIX route configured successfully"
    echo "📋 Gateway Access:"
    echo "   - Gravitee Gateway: http://<apisix-host>/gateway/"
---
# Job to configure APISIX routes after deployment
apiVersion: batch/v1
kind: Job
metadata:
  name: configure-apisix-routes
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    linkerd.io/inject: "enabled"
spec:
  template:
    metadata:
      annotations:
        linkerd.io/inject: "enabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "apisix"
        vault.hashicorp.com/agent-inject-secret-admin: "secret/apisix/admin"
        vault.hashicorp.com/agent-inject-template-admin: |
          {{- with secret "secret/apisix/admin" -}}
          export APISIX_ADMIN_KEY="{{ .Data.data.key }}"
          {{- end }}
    spec:
      serviceAccountName: apisix
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-apisix
        image: curlimages/curl:8.11.1
        command:
        - sh
        - -c
        - |
          echo "⏳ Waiting for APISIX to be ready..."
          RETRY_COUNT=0
          MAX_RETRIES=120
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -s -o /dev/null http://apisix.k8s-api-gateway.svc.cluster.local:80/; then
              echo "✅ APISIX is ready"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Waiting for APISIX... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            sleep 5
          done
          echo "❌ APISIX not ready after $MAX_RETRIES attempts"
          exit 1
      - name: wait-for-gravitee
        image: curlimages/curl:8.11.1
        command:
        - sh  
        - -c
        - |
          echo "⏳ Waiting for Gravitee services to be ready..."
          RETRY_COUNT=0
          MAX_RETRIES=120
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Check Gravitee Management API
            if curl -s -o /dev/null http://gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083/management/platform; then
              echo "✅ Gravitee Management API is ready"
              if curl -s -o /dev/null http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082/_node/health; then
                echo "✅ Gravitee Gateway is ready"
                echo "✅ Gravitee services are ready"
                exit 0
              fi
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Waiting for Gravitee services... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            sleep 10
          done
          echo "❌ Gravitee services not ready after $MAX_RETRIES attempts"
          exit 1
      containers:
      - name: configure-routes
        image: curlimages/curl:8.11.1
        command:
        - /bin/sh
        - -c
        - |
          if [ -f /vault/secrets/admin ]; then
            . /vault/secrets/admin
            echo "✅ APISIX admin key loaded from Vault"
          else
            echo "❌ Failed to load APISIX admin key from Vault"
            exit 1
          fi
          /bin/sh /scripts/configure-routes.sh
        volumeMounts:
        - name: routes-config
          mountPath: /scripts
      volumes:
      - name: routes-config
        configMap:
          name: apisix-routes-config
          defaultMode: 0755
