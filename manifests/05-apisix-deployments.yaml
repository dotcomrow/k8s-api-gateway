---
# APISIX ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  config.yaml: |
    # APISIX Configuration for v3.6.0
    apisix:
      node_listen:
        - 9080
      enable_admin: true
      enable_dev_mode: false
      enable_reuseport: true
      show_upstream_status_in_response_header: false
      enable_ipv6: false
      enable_http2: true
      enable_server_tokens: false
      
      proxy_cache:
        cache_ttl: 10s
        zones:
          - name: disk_cache_one
            memory_size: 50m
            disk_size: 1G
            disk_path: /tmp/disk_cache_one
            cache_levels: "1:2"
          - name: memory_cache
            memory_size: 50m
      
      ssl:
        enable: true
        listen:
          - port: 9443
            enable_http3: false
        ssl_protocols: TLSv1.2 TLSv1.3
        ssl_session_tickets: false
      
      data_encryption:
        enable_encrypt_fields: true
        keyring:
          - PLACEHOLDER_KEY_1_WILL_BE_REPLACED
          - PLACEHOLDER_KEY_2_WILL_BE_REPLACED
      
      events:
        module: lua-resty-events

    plugin_attr: {}

    deployment:
      role: data_plane
      role_data_plane:
        config_provider: etcd
      admin:
        admin_key_required: true
        admin_key:
          #ADMIN_KEY_BLOCK#
        enable_admin_cors: true
        enable_admin_ui: true
        allow_admin:
          - 127.0.0.0/24
        admin_listen:
          ip: "0.0.0.0"
          port: 9180
        admin_api_version: v3
      etcd:
        host:
          - "http://apisix-etcd.k8s-api-gateway.svc.cluster.local:2379"
        prefix: /apisix
        timeout: 30
---
# APISIX etcd Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-etcd
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix-etcd
  template:
    metadata:
      labels:
        app: apisix-etcd
    spec:
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.0
        ports:
        - containerPort: 2379
        env:
        - name: ETCD_LISTEN_CLIENT_URLS
          value: "http://0.0.0.0:2379"
        - name: ETCD_ADVERTISE_CLIENT_URLS
          value: "http://apisix-etcd:2379"
        - name: ETCD_LISTEN_PEER_URLS
          value: "http://0.0.0.0:2380"
        - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
          value: "http://apisix-etcd:2380"
        - name: ETCD_INITIAL_CLUSTER
          value: "etcd=http://apisix-etcd:2380"
        - name: ETCD_NAME
          value: "etcd"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
# APISIX Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "apisix"
        vault.hashicorp.com/agent-inject-secret-admin: "secret/apisix/admin"
        vault.hashicorp.com/agent-inject-template-admin: |
          {{- with secret "secret/apisix/admin" -}}
          export APISIX_ADMIN_KEY="{{ .Data.data.key }}"
          {{- end -}}
    spec:
      serviceAccountName: apisix
      initContainers:
      - name: wait-etcd
        image: alpine/k8s:1.31.4
        command: 
        - sh
        - -c
        - |
          until nc -z apisix-etcd 2379; do
            echo "Waiting for etcd..."
            sleep 2
          done
          echo "etcd is ready"
      containers:
      - name: apisix
        # Use custom APISIX image with required packages
        image: ghcr.io/dotcomrow/gravitee-apisix:ts-20251112-000708
        command: ["/bin/sh"]
        args:
        - -c
        - |
          echo "🔧 Starting APISIX with custom configuration..."
          
          # Required packages are pre-installed in the custom image
          echo "📦 Required packages already installed in image."
          
          # Load APISIX admin key from Vault
          if [ -f /vault/secrets/admin ]; then
            . /vault/secrets/admin
            echo "✅ APISIX admin key loaded from Vault"
          else
            echo "❌ Failed to load APISIX admin key from Vault"
            exit 1
          fi
          
          # Generate random encryption keys directly in container
          echo "🔐 Generating random encryption keys for APISIX data encryption..."
          APISIX_ENCRYPTION_KEY_1="$(openssl rand -hex 16)"
          APISIX_ENCRYPTION_KEY_2="$(openssl rand -hex 16)"
          echo "✅ Generated encryption keys successfully"
          
          echo "🔄 Backing up default config and injecting keys..."
          cd /usr/local/apisix/conf
          mv config-default.yaml config-default.yaml.bak
          
          # Replace placeholder keys with real ones - both encryption keys and admin key
          sed -e "s/PLACEHOLDER_KEY_1_WILL_BE_REPLACED/$APISIX_ENCRYPTION_KEY_1/g" \
            -e "s/PLACEHOLDER_KEY_2_WILL_BE_REPLACED/$APISIX_ENCRYPTION_KEY_2/g" \
            -e "s/#ADMIN_KEY_BLOCK#/  - name: \"admin\"\\n    key: $APISIX_ADMIN_KEY\\n    role: admin/g" \
            config.yaml > config-default.yaml
          
          echo "🔐 Updated all keys in configuration"
          
          echo "🚀 Initializing APISIX..."
          cd /usr/local/apisix
          /usr/local/openresty/luajit/bin/luajit /usr/local/apisix/apisix/cli/apisix.lua init
          echo "🔗 Initializing etcd..."
          /usr/local/openresty/luajit/bin/luajit /usr/local/apisix/apisix/cli/apisix.lua init_etcd
          echo "▶️ Starting APISIX..."
          /usr/local/openresty/luajit/bin/luajit /usr/local/apisix/apisix/cli/apisix.lua start
          apisix_exit_code=$?
          if [ $apisix_exit_code -ne 0 ]; then
            echo "❌ APISIX failed to start. Exit code: $apisix_exit_code"
            echo "🔍 Dumping config file for debugging:"
            cat /usr/local/apisix/conf/config-default.yaml || echo "(config file missing)"
            echo "🔍 Listing contents of /usr/local/apisix/conf:"
            ls -l /usr/local/apisix/conf
            echo "🔍 Listing contents of /usr/local/apisix:"
            ls -l /usr/local/apisix
            echo "🔍 Printing last 50 lines of /usr/local/apisix/logs/error.log (if exists):"
            tail -50 /usr/local/apisix/logs/error.log || echo "(no error log found)"
            exit $apisix_exit_code
          fi
        ports:
        - containerPort: 9080
        - containerPort: 9180
        - containerPort: 9443
        - containerPort: 9091
        volumeMounts:
        - name: apisix-config
          mountPath: /usr/local/apisix/conf/config.yaml
          subPath: config.yaml
        env:
        - name: APISIX_STAND_ALONE
          value: "false"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          tcpSocket:
            port: 9080
          initialDelaySeconds: 90
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: 9080
          initialDelaySeconds: 60
          periodSeconds: 15
      volumes:
      - name: apisix-config
        configMap:
          name: apisix-config