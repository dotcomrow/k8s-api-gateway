apiVersion: batch/v1
kind: Job
metadata:
  name: configure-gravitee-github
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    linkerd.io/inject: "disabled"
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "gravitee"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-db-creds: "yugabyte-db/static-creds/gravitee-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "yugabyte-db/static-creds/gravitee-app" -}}
          export YUGABYTE_USER="gravitee_app"
          export YUGABYTE_PASSWORD="{{ .Data.password }}"
          {{- end }}
    spec:
      serviceAccountName: gravitee
      restartPolicy: OnFailure
      containers:
      - name: configure
        image: alpine/k8s:1.31.4
        env:
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-oauth
              key: client-id
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-oauth
              key: client-secret
        - name: GITHUB_SERVER_URL
          value: "https://github.com/login/oauth"
        - name: YUGABYTE_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: YUGABYTE_PORT
          value: "5433"
        - name: YUGABYTE_DATABASE
          value: "gravitee"
        command: ["/bin/sh","-c"]
        args:
        - |
          set -e
          apk add --no-cache jq postgresql15-client >/dev/null

          REQUIRED_ENV="GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET GITHUB_SERVER_URL YUGABYTE_HOST YUGABYTE_PORT YUGABYTE_DATABASE"
          for var in $REQUIRED_ENV; do
            value=$(env | awk -F= -v key="$var" '$1==key {print substr($0, index($0,"=")+1)}')
            if [ -z "$value" ]; then
              echo "❌ Missing required env var: $var" >&2
              exit 1
            fi
          done

          if [ -f /vault/secrets/db-creds ]; then
            . /vault/secrets/db-creds
          fi

          if [ -z "${YUGABYTE_USER-}" ] || [ -z "${YUGABYTE_PASSWORD-}" ]; then
            echo "❌ Database credentials not available from Vault." >&2
            exit 1
          fi

          BASE_URL="${GITHUB_SERVER_URL%/}"
          AUTH_ENDPOINT="${BASE_URL}/authorize"
          TOKEN_ENDPOINT="${BASE_URL}/access_token"
          USERINFO_ENDPOINT="https://api.github.com/user"

          CONFIG_JSON=$(jq -n \
            --arg clientId "$GITHUB_CLIENT_ID" \
            --arg clientSecret "$GITHUB_CLIENT_SECRET" \
            --arg authEndpoint "$AUTH_ENDPOINT" \
            --arg tokenEndpoint "$TOKEN_ENDPOINT" \
            --arg userInfo "$USERINFO_ENDPOINT" \
            '{clientId:$clientId,clientSecret:$clientSecret,authorizationEndpoint:$authEndpoint,tokenEndpoint:$tokenEndpoint,userInfoEndpoint:$userInfo,useSystemProxy:false}')

          CONFIG_JSON_ESC=$(printf "%s" "$CONFIG_JSON" | sed "s/'/''/g")
          PROFILE_CONDITION="{#context.attributes['groups'] contains 'gravitee_admin_access' or #context.attributes['groups'] contains 'gravitee_user_access'}"
          USER_PROFILE_MAPPING=$(jq -n \
            --arg cond "$PROFILE_CONDITION" \
            '{condition:$cond,id:"id",firstname:"name",lastname:"name",email:"email",picture:"avatar_url"}')
          USER_PROFILE_ESC=$(printf "%s" "$USER_PROFILE_MAPPING" | sed "s/'/''/g")

          ADMIN_CONDITION="{#context.attributes['groups'] contains 'gravitee_admin_access'}"
          USER_CONDITION="{#context.attributes['groups'] contains 'gravitee_user_access'}"
          GROUP_MAPPINGS=$(jq -n \
            --arg adminCond "$ADMIN_CONDITION" \
            --arg userCond "$USER_CONDITION" \
            '[{"condition":$adminCond,"groups":["gravitee_admin_access"]},{"condition":$userCond,"groups":["gravitee_user_access"]}]')
          GROUP_MAPPINGS_ESC=$(printf "%s" "$GROUP_MAPPINGS" | sed "s/'/''/g")

          SQL_TMP=$(mktemp)
          {
            printf "INSERT INTO gravitee.identity_providers (id, name, type, enabled, sync_mappings, configuration, user_profile_mapping, group_mappings, created_at, updated_at, organization_id, email_required)\n"
            printf "VALUES ('github','GitHub','GITHUB',true,true,'%s','%s','%s',now(),now(),'DEFAULT',false)\n" "$CONFIG_JSON_ESC" "$USER_PROFILE_ESC" "$GROUP_MAPPINGS_ESC"
            printf "ON CONFLICT (id) DO UPDATE SET name=EXCLUDED.name, type=EXCLUDED.type, enabled=EXCLUDED.enabled, sync_mappings=EXCLUDED.sync_mappings, configuration=EXCLUDED.configuration, user_profile_mapping=EXCLUDED.user_profile_mapping, group_mappings=EXCLUDED.group_mappings, updated_at=now();\n\n"

            printf "INSERT INTO gravitee.identity_provider_activations (identity_provider_id, reference_type, reference_id, created_at)\n"
            printf "VALUES ('github','ENVIRONMENT','DEFAULT',now())\n"
            printf "ON CONFLICT (identity_provider_id, reference_type, reference_id) DO NOTHING;\n\n"

            printf "INSERT INTO gravitee.identity_provider_activations (identity_provider_id, reference_type, reference_id, created_at)\n"
            printf "VALUES ('github','ORGANIZATION','DEFAULT',now())\n"
            printf "ON CONFLICT (identity_provider_id, reference_type, reference_id) DO NOTHING;\n\n"
          } > "$SQL_TMP"

          PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U "$YUGABYTE_USER" -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 -f "$SQL_TMP"
          rm -f "$SQL_TMP"

          echo "🔧 Forcing portal user self-signup flags directly in database..."
          cat <<'EOF_PORTAL' | PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U "$YUGABYTE_USER" -d "$YUGABYTE_DATABASE"
          INSERT INTO gravitee.parameters (reference_type, reference_id, key, value)
          VALUES ('ENVIRONMENT', 'DEFAULT', 'portal.userCreation.enabled', 'false')
          ON CONFLICT (reference_type, reference_id, key)
          DO UPDATE SET value = EXCLUDED.value;

          INSERT INTO gravitee.parameters (reference_type, reference_id, key, value)
          VALUES ('ENVIRONMENT', 'DEFAULT', 'portal.userCreation.automaticValidation', 'false')
          ON CONFLICT (reference_type, reference_id, key)
          DO UPDATE SET value = EXCLUDED.value;

          INSERT INTO gravitee.parameters (reference_type, reference_id, key, value)
          VALUES ('ENVIRONMENT', 'DEFAULT', 'portal.authentication.localLogin.enabled', 'false')
          ON CONFLICT (reference_type, reference_id, key)
          DO UPDATE SET value = EXCLUDED.value;

          INSERT INTO gravitee.parameters (reference_type, reference_id, key, value)
          VALUES ('ENVIRONMENT', 'DEFAULT', 'portal.authentication.forceLogin.enabled', 'true')
          ON CONFLICT (reference_type, reference_id, key)
          DO UPDATE SET value = EXCLUDED.value;
          EOF_PORTAL

          echo "✅ Gravitee GitHub configuration complete."
