apiVersion: batch/v1
kind: Job
metadata:
  name: configure-gravitee-github
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    linkerd.io/inject: "disabled"
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "gravitee"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-db-creds: "yugabyte-db/static-creds/gravitee-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "yugabyte-db/static-creds/gravitee-app" -}}
          export YUGABYTE_USER="gravitee_app"
          export YUGABYTE_PASSWORD="{{ .Data.password }}"
          {{- end }}
    spec:
      serviceAccountName: gravitee
      restartPolicy: OnFailure
      containers:
      - name: configure
        image: alpine/k8s:1.31.4
        env:
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-oauth
              key: client-id
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-oauth
              key: client-secret
        - name: GITHUB_SERVER_URL
          value: "https://github.com/login/oauth"
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-team-token
              key: token
        - name: GITHUB_ORG
          valueFrom:
            configMapKeyRef:
              name: github-access-settings
              key: organization
        - name: GITHUB_ALLOWED_TEAMS
          valueFrom:
            configMapKeyRef:
              name: github-access-settings
              key: allowedTeams
        - name: YUGABYTE_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: YUGABYTE_PORT
          value: "5433"
        - name: YUGABYTE_DATABASE
          value: "gravitee"
        command: ["/bin/sh","-c"]
        args:
        - |
          set -e
          apk add --no-cache jq postgresql15-client >/dev/null

          REQUIRED_ENV="GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET GITHUB_SERVER_URL GITHUB_TOKEN GITHUB_ORG GITHUB_ALLOWED_TEAMS YUGABYTE_HOST YUGABYTE_PORT YUGABYTE_DATABASE"
          for var in $REQUIRED_ENV; do
            value=$(env | awk -F= -v key="$var" '$1==key {print substr($0, index($0,"=")+1)}')
            if [ -z "$value" ]; then
              echo "❌ Missing required env var: $var" >&2
              exit 1
            fi
          done

          if [ -f /vault/secrets/db-creds ]; then
            . /vault/secrets/db-creds
          fi

          if [ -z "${YUGABYTE_USER-}" ] || [ -z "${YUGABYTE_PASSWORD-}" ]; then
            echo "❌ Database credentials not available from Vault." >&2
            exit 1
          fi

          ALLOWED_TEAMS=$(printf '%s' "$GITHUB_ALLOWED_TEAMS" | tr ',' ' ')

          psql_cmd() {
            PGPASSWORD="$YUGABYTE_PASSWORD" \
              psql -h "$YUGABYTE_HOST" \
                   -p "$YUGABYTE_PORT" \
                   -U "$YUGABYTE_USER" \
                   -d "$YUGABYTE_DATABASE" "$@"
          }

          seed_allowed_table() {
            if [ -z "$ALLOWED_TEAMS" ]; then
              echo "ℹ️ No GitHub teams configured; skipping guard table seed."
              return
            fi

            if [ -z "${GITHUB_TOKEN-}" ]; then
              echo "⚠️ Missing GITHUB_TOKEN; cannot seed guard table." >&2
              return
            fi

            allowed_tmp=$(mktemp)
            members_found=0

            for team in $ALLOWED_TEAMS; do
              page=1
              while :; do
                api="https://api.github.com/orgs/${GITHUB_ORG}/teams/${team}/members?per_page=100&page=${page}"
                body=$(mktemp)
                status=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -w "%{http_code}" -o "$body" "$api" || echo "000")

                if [ "$status" != "200" ]; then
                  echo "⚠️ Failed to list members for team ${team} during seed (status ${status})." >&2
                  rm -f "$body"
                  break
                fi

                jq -r '.[] | "\(.id),\(.login)"' "$body" >> "$allowed_tmp"
                count=$(jq 'length' "$body" 2>/dev/null || echo 0)
                rm -f "$body"

                if [ "$count" -gt 0 ]; then
                  members_found=1
                fi

                [ "$count" -lt 100 ] && break
                page=$((page + 1))
              done
            done

            if [ "$members_found" -eq 0 ]; then
              echo "⚠️ Unable to retrieve allowed GitHub members; guard table not updated." >&2
              rm -f "$allowed_tmp"
              return
            fi

            allowed_sorted=$(mktemp)
            sort -t',' -k1,1 -u "$allowed_tmp" > "$allowed_sorted"
            rm -f "$allowed_tmp"

            if ! psql_cmd -c "TRUNCATE TABLE gravitee.github_allowed_users;" >/dev/null; then
              echo "⚠️ Failed to truncate guard table during seed." >&2
              rm -f "$allowed_sorted"
              return
            fi

            if ! psql_cmd -c "COPY gravitee.github_allowed_users (github_id, login) FROM STDIN WITH (FORMAT csv);" < "$allowed_sorted"; then
              echo "⚠️ Failed to populate guard table during seed." >&2
              rm -f "$allowed_sorted"
              return
            fi

            rm -f "$allowed_sorted"

            count=$(psql_cmd -At -c "SELECT COUNT(*) FROM gravitee.github_allowed_users;" 2>/dev/null || echo 0)
            echo "✅ Guard table seeded with ${count} GitHub accounts."
          }

          BASE_URL="${GITHUB_SERVER_URL%/}"
          AUTH_ENDPOINT="${BASE_URL}/authorize"
          TOKEN_ENDPOINT="${BASE_URL}/access_token"
          USERINFO_ENDPOINT="https://api.github.com/user"

          CONFIG_JSON=$(jq -n \
            --arg clientId "$GITHUB_CLIENT_ID" \
            --arg clientSecret "$GITHUB_CLIENT_SECRET" \
            --arg authEndpoint "$AUTH_ENDPOINT" \
            --arg tokenEndpoint "$TOKEN_ENDPOINT" \
            --arg userInfo "$USERINFO_ENDPOINT" \
            '{clientId:$clientId,clientSecret:$clientSecret,authorizationEndpoint:$authEndpoint,tokenEndpoint:$tokenEndpoint,userInfoEndpoint:$userInfo,useSystemProxy:false}')

          CONFIG_JSON_ESC=$(printf "%s" "$CONFIG_JSON" | sed "s/'/''/g")
          PROFILE_CONDITION="{#jsonPath(#profile, '$.teams[*].slug').contains('gravitee_admin_access') or #jsonPath(#profile, '$.teams[*].slug').contains('gravitee_user_access')}"
          USER_PROFILE_MAPPING=$(jq -n \
            --arg cond "$PROFILE_CONDITION" \
            '{condition:$cond,id:"id",firstname:"name",lastname:"name",email:"email",picture:"avatar_url"}')
          USER_PROFILE_ESC=$(printf "%s" "$USER_PROFILE_MAPPING" | sed "s/'/''/g")

          ADMIN_CONDITION="{#jsonPath(#profile, '$.teams[*].slug').contains('gravitee_admin_access')}"
          USER_CONDITION="{#jsonPath(#profile, '$.teams[*].slug').contains('gravitee_user_access')}"
          GROUP_MAPPINGS=$(jq -n \
            --arg adminCond "$ADMIN_CONDITION" \
            --arg userCond "$USER_CONDITION" \
            '[{"condition":$adminCond,"groups":["gravitee_admin_access"]},{"condition":$userCond,"groups":["gravitee_user_access"]}]')
          GROUP_MAPPINGS_ESC=$(printf "%s" "$GROUP_MAPPINGS" | sed "s/'/''/g")

          SQL_TMP=$(mktemp)
          {
            printf "INSERT INTO gravitee.identity_providers (id, name, type, enabled, sync_mappings, configuration, user_profile_mapping, group_mappings, created_at, updated_at, organization_id, email_required)\n"
            printf "VALUES ('github','GitHub','GITHUB',true,true,'%s','%s','%s',now(),now(),'DEFAULT',false)\n" "$CONFIG_JSON_ESC" "$USER_PROFILE_ESC" "$GROUP_MAPPINGS_ESC"
            printf "ON CONFLICT (id) DO UPDATE SET name=EXCLUDED.name, type=EXCLUDED.type, enabled=EXCLUDED.enabled, sync_mappings=EXCLUDED.sync_mappings, configuration=EXCLUDED.configuration, user_profile_mapping=EXCLUDED.user_profile_mapping, group_mappings=EXCLUDED.group_mappings, updated_at=now();\n\n"

            printf "INSERT INTO gravitee.identity_provider_activations (identity_provider_id, reference_type, reference_id, created_at)\n"
            printf "VALUES ('github','ENVIRONMENT','DEFAULT',now())\n"
            printf "ON CONFLICT (identity_provider_id, reference_type, reference_id) DO NOTHING;\n\n"

            printf "INSERT INTO gravitee.identity_provider_activations (identity_provider_id, reference_type, reference_id, created_at)\n"
            printf "VALUES ('github','ORGANIZATION','DEFAULT',now())\n"
            printf "ON CONFLICT (identity_provider_id, reference_type, reference_id) DO NOTHING;\n\n"

            cat <<'EOSQL'
            CREATE TABLE IF NOT EXISTS gravitee.github_allowed_users (
              github_id varchar(64) PRIMARY KEY,
              login varchar(255) NOT NULL,
              synced_at timestamp without time zone NOT NULL DEFAULT now()
            );

            ALTER TABLE gravitee.users
              ADD COLUMN IF NOT EXISTS github_id varchar(64);

            UPDATE gravitee.users
              SET github_id = source_id
            WHERE source = 'github'
              AND (github_id IS NULL OR github_id <> source_id);

            CREATE OR REPLACE FUNCTION gravitee.set_github_id()
            RETURNS trigger
            LANGUAGE plpgsql
            AS $$
            BEGIN
              IF NEW.source = 'github' THEN
                NEW.github_id := NEW.source_id;
              ELSE
                NEW.github_id := NULL;
              END IF;
              RETURN NEW;
            END;
            $$;

            DROP TRIGGER IF EXISTS tr_set_github_id ON gravitee.users;
            CREATE TRIGGER tr_set_github_id
            BEFORE INSERT OR UPDATE ON gravitee.users
            FOR EACH ROW
            EXECUTE FUNCTION gravitee.set_github_id();
            EOSQL
          } > "$SQL_TMP"

          PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U "$YUGABYTE_USER" -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 -f "$SQL_TMP"
          rm -f "$SQL_TMP"

          echo "🔧 Forcing portal user self-signup flags directly in database..."
          cat <<'EOF_PORTAL' | PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U "$YUGABYTE_USER" -d "$YUGABYTE_DATABASE"
          INSERT INTO gravitee.parameters (reference_type, reference_id, key, value)
          VALUES ('ENVIRONMENT', 'DEFAULT', 'portal.userCreation.enabled', 'false')
          ON CONFLICT (reference_type, reference_id, key)
          DO UPDATE SET value = EXCLUDED.value;

          INSERT INTO gravitee.parameters (reference_type, reference_id, key, value)
          VALUES ('ENVIRONMENT', 'DEFAULT', 'portal.userCreation.automaticValidation', 'false')
          ON CONFLICT (reference_type, reference_id, key)
          DO UPDATE SET value = EXCLUDED.value;

          INSERT INTO gravitee.parameters (reference_type, reference_id, key, value)
          VALUES ('ENVIRONMENT', 'DEFAULT', 'portal.authentication.localLogin.enabled', 'false')
          ON CONFLICT (reference_type, reference_id, key)
          DO UPDATE SET value = EXCLUDED.value;

          INSERT INTO gravitee.parameters (reference_type, reference_id, key, value)
          VALUES ('ENVIRONMENT', 'DEFAULT', 'portal.authentication.forceLogin.enabled', 'true')
          ON CONFLICT (reference_type, reference_id, key)
          DO UPDATE SET value = EXCLUDED.value;
          EOF_PORTAL

          echo "🔄 Synchronizing allowed GitHub members for login guard..."
          seed_allowed_table

          echo "🧹 Removing any unauthorized GitHub users before enforcing guard..."
          psql_cmd <<'EOSQL'
          WITH doomed AS (
            SELECT id
            FROM gravitee.users u
            WHERE u.source = 'github'
              AND NOT EXISTS (
                SELECT 1
                FROM gravitee.github_allowed_users allowed
                WHERE allowed.github_id = u.source_id
              )
          )
          DELETE FROM gravitee.memberships
          WHERE member_id IN (SELECT id FROM doomed);

          DELETE FROM gravitee.users
          WHERE id IN (SELECT id FROM doomed);
          EOSQL

                    echo "🔐 Enforcing GitHub guard constraint..."
                    psql_cmd <<'EOSQL'
          ALTER TABLE gravitee.users
            DROP CONSTRAINT IF EXISTS fk_github_allowed;

          ALTER TABLE gravitee.users
            ADD CONSTRAINT fk_github_allowed
            FOREIGN KEY (github_id)
            REFERENCES gravitee.github_allowed_users (github_id)
            DEFERRABLE INITIALLY IMMEDIATE;
          EOSQL

          echo "✅ Gravitee GitHub configuration complete."
