apiVersion: batch/v1
kind: Job
metadata:
  name: configure-gravitee-github
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    linkerd.io/inject: "disabled"
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "gravitee"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-db-creds: "yugabyte-db/static-creds/gravitee-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "yugabyte-db/static-creds/gravitee-app" -}}
          export YUGABYTE_USER="gravitee_app"
          export YUGABYTE_PASSWORD="{{ .Data.password }}"
          {{- end }}
    spec:
      serviceAccountName: gravitee
      restartPolicy: OnFailure
      containers:
      - name: configure
        image: alpine/k8s:1.31.4
        env:
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-oauth
              key: client-id
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-oauth
              key: client-secret
        - name: GITHUB_SERVER_URL
          value: "https://github.com/login/oauth"
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-team-token
              key: token
        - name: GITHUB_ORG
          valueFrom:
            configMapKeyRef:
              name: github-access-settings
              key: organization
        - name: GITHUB_ALLOWED_TEAMS
          valueFrom:
            configMapKeyRef:
              name: github-access-settings
              key: allowedTeams
        - name: GITHUB_ADMIN_TEAM
          valueFrom:
            configMapKeyRef:
              name: github-access-settings
              key: adminTeam
        - name: GITHUB_USER_TEAM
          valueFrom:
            configMapKeyRef:
              name: github-access-settings
              key: userTeam
        - name: YUGABYTE_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: YUGABYTE_PORT
          value: "5433"
        - name: YUGABYTE_DATABASE
          value: "gravitee"
        command: ["/bin/sh","-c"]
        args:
        - |
          set -e
          apk add --no-cache jq postgresql15-client >/dev/null

          REQUIRED_ENV="GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET GITHUB_SERVER_URL GITHUB_TOKEN GITHUB_ORG GITHUB_ALLOWED_TEAMS GITHUB_ADMIN_TEAM GITHUB_USER_TEAM YUGABYTE_HOST YUGABYTE_PORT YUGABYTE_DATABASE"
          for var in $REQUIRED_ENV; do
            value=$(env | awk -F= -v key="$var" '$1==key {print substr($0, index($0,"=")+1)}')
            if [ -z "$value" ]; then
              echo "❌ Missing required env var: $var" >&2
              exit 1
            fi
          done

          if [ -f /vault/secrets/db-creds ]; then
            . /vault/secrets/db-creds
          fi

          if [ -z "${YUGABYTE_USER-}" ] || [ -z "${YUGABYTE_PASSWORD-}" ]; then
            echo "❌ Database credentials not available from Vault." >&2
            exit 1
          fi

          ALLOWED_TEAMS=$(printf '%s' "$GITHUB_ALLOWED_TEAMS" | tr ',' ' ')
          ADMIN_TEAM_SLUG="${GITHUB_ADMIN_TEAM:-}"
          USER_TEAM_SLUG="${GITHUB_USER_TEAM:-}"

          psql_cmd() {
            PGPASSWORD="$YUGABYTE_PASSWORD" \
              psql -h "$YUGABYTE_HOST" \
                   -p "$YUGABYTE_PORT" \
                   -U "$YUGABYTE_USER" \
                   -d "$YUGABYTE_DATABASE" "$@"
          }

          seed_allowed_table() {
            if [ -z "$ALLOWED_TEAMS" ]; then
              echo "ℹ️ No GitHub teams configured; skipping guard table seed."
              return 1
            fi

            if [ -z "${GITHUB_TOKEN-}" ]; then
              echo "⚠️ Missing GITHUB_TOKEN; cannot seed guard table." >&2
              return 1
            fi

            allowed_tmp=$(mktemp)
            api_fail=0

            for team in $ALLOWED_TEAMS; do
              page=1
              while :; do
                api="https://api.github.com/orgs/${GITHUB_ORG}/teams/${team}/members?per_page=100&page=${page}"
                body=$(mktemp)
                status=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -w "%{http_code}" -o "$body" "$api" || echo "000")

                if [ "$status" != "200" ]; then
                  echo "⚠️ Failed to list members for team ${team} during seed (status ${status}). Response:" >&2
                  cat "$body" >&2 || true
                  rm -f "$body"
                  api_fail=1
                  break
                fi

                role_label="USER"
                if [ -n "$ADMIN_TEAM_SLUG" ] && [ "$team" = "$ADMIN_TEAM_SLUG" ]; then
                  role_label="ADMIN"
                fi

                jq -r --arg role "$role_label" '.[] | "\(.id),\(.login),\($role)"' "$body" >> "$allowed_tmp"
                count=$(jq 'length' "$body" 2>/dev/null || echo 0)
                rm -f "$body"


                [ "$count" -lt 100 ] && break
                page=$((page + 1))
              done
            done

            if [ "$api_fail" -eq 1 ]; then
              echo "⚠️ Unable to retrieve allowed GitHub members; guard table not updated." >&2
              rm -f "$allowed_tmp"
              return 1
            fi

            allowed_sorted=$(mktemp)
            if [ -s "$allowed_tmp" ]; then
              awk -F',' '{
                key=$1
                role=$3
                line=$0
                if (!(key in best) || role=="ADMIN") {
                  best[key]=line
                }
              } END { for (k in best) print best[k] }' "$allowed_tmp" > "$allowed_sorted"
            else
              : > "$allowed_sorted"
            fi
            rm -f "$allowed_tmp"

            if ! psql_cmd -c "ALTER TABLE gravitee.users DROP CONSTRAINT IF EXISTS fk_github_allowed;" >/dev/null; then
              echo "⚠️ Failed to drop guard constraint prior to refresh." >&2
              rm -f "$allowed_sorted"
              return 1
            fi

            if ! psql_cmd -c "DELETE FROM gravitee.github_allowed_users;" >/dev/null; then
              echo "⚠️ Failed to clear guard table during seed." >&2
              rm -f "$allowed_sorted"
              return 1
            fi

            if ! psql_cmd -c "COPY gravitee.github_allowed_users (github_id, login, desired_role) FROM STDIN WITH (FORMAT csv);" < "$allowed_sorted"; then
              echo "⚠️ Failed to populate guard table during seed." >&2
              rm -f "$allowed_sorted"
              return 1
            fi

            rm -f "$allowed_sorted"

            count=$(psql_cmd -At -c "SELECT COUNT(*) FROM gravitee.github_allowed_users;" 2>/dev/null || echo 0)
            echo "✅ Guard table seeded with ${count} GitHub accounts."
            return 0
          }

          BASE_URL="${GITHUB_SERVER_URL%/}"
          AUTH_ENDPOINT="${BASE_URL}/authorize"
          TOKEN_ENDPOINT="${BASE_URL}/access_token"
          USERINFO_ENDPOINT="https://api.github.com/user"

          CONFIG_JSON=$(jq -n \
            --arg clientId "$GITHUB_CLIENT_ID" \
            --arg clientSecret "$GITHUB_CLIENT_SECRET" \
            --arg authEndpoint "$AUTH_ENDPOINT" \
            --arg tokenEndpoint "$TOKEN_ENDPOINT" \
            --arg userInfo "$USERINFO_ENDPOINT" \
            '{clientId:$clientId,clientSecret:$clientSecret,authorizationEndpoint:$authEndpoint,tokenEndpoint:$tokenEndpoint,userInfoEndpoint:$userInfo,useSystemProxy:false}')

          CONFIG_JSON_ESC=$(printf "%s" "$CONFIG_JSON" | sed "s/'/''/g")
          PROFILE_CONDITION="{#jsonPath(#profile, '$.teams[*].slug').contains('gravitee_admin_access') or #jsonPath(#profile, '$.teams[*].slug').contains('gravitee_user_access')}"
          USER_PROFILE_MAPPING=$(jq -n \
            --arg cond "$PROFILE_CONDITION" \
            '{condition:$cond,id:"id",firstname:"name",lastname:"name",email:"email",picture:"avatar_url"}')
          USER_PROFILE_ESC=$(printf "%s" "$USER_PROFILE_MAPPING" | sed "s/'/''/g")

          ADMIN_CONDITION="{#jsonPath(#profile, '$.teams[*].slug').contains('gravitee_admin_access')}"
          USER_CONDITION="{#jsonPath(#profile, '$.teams[*].slug').contains('gravitee_user_access')}"
          GROUP_MAPPINGS=$(jq -n \
            --arg adminCond "$ADMIN_CONDITION" \
            --arg userCond "$USER_CONDITION" \
            '[{"condition":$adminCond,"groups":["gravitee_admin_access"]},{"condition":$userCond,"groups":["gravitee_user_access"]}]')
          GROUP_MAPPINGS_ESC=$(printf "%s" "$GROUP_MAPPINGS" | sed "s/'/''/g")
          ROLE_MAPPINGS=$(jq -n \
            --arg adminCond "$ADMIN_CONDITION" \
            --arg userCond "$USER_CONDITION" \
            '[
              {
                condition: $adminCond,
                roles: [
                  {"scope":"ORGANIZATION","name":"ADMIN"},
                  {"scope":"ENVIRONMENT","name":"ADMIN"}
                ]
              },
              {
                condition: $userCond,
                roles: [
                  {"scope":"ORGANIZATION","name":"USER"},
                  {"scope":"ENVIRONMENT","name":"USER"}
                ]
              }
            ]')
          ROLE_MAPPINGS_ESC=$(printf "%s" "$ROLE_MAPPINGS" | sed "s/'/''/g")

          SQL_TMP=$(mktemp)
          {
            printf "INSERT INTO gravitee.identity_providers (id, name, type, enabled, sync_mappings, configuration, user_profile_mapping, group_mappings, role_mappings, created_at, updated_at, organization_id, email_required)\n"
            printf "VALUES ('github','GitHub','GITHUB',true,true,'%s','%s','%s','%s',now(),now(),'DEFAULT',false)\n" "$CONFIG_JSON_ESC" "$USER_PROFILE_ESC" "$GROUP_MAPPINGS_ESC" "$ROLE_MAPPINGS_ESC"
            printf "ON CONFLICT (id) DO UPDATE SET name=EXCLUDED.name, type=EXCLUDED.type, enabled=EXCLUDED.enabled, sync_mappings=EXCLUDED.sync_mappings, configuration=EXCLUDED.configuration, user_profile_mapping=EXCLUDED.user_profile_mapping, group_mappings=EXCLUDED.group_mappings, role_mappings=EXCLUDED.role_mappings, updated_at=now();\n\n"

            printf "INSERT INTO gravitee.identity_provider_activations (identity_provider_id, reference_type, reference_id, created_at)\n"
            printf "VALUES ('github','ENVIRONMENT','DEFAULT',now())\n"
            printf "ON CONFLICT (identity_provider_id, reference_type, reference_id) DO NOTHING;\n\n"

            printf "INSERT INTO gravitee.identity_provider_activations (identity_provider_id, reference_type, reference_id, created_at)\n"
            printf "VALUES ('github','ORGANIZATION','DEFAULT',now())\n"
            printf "ON CONFLICT (identity_provider_id, reference_type, reference_id) DO NOTHING;\n\n"

            printf "CREATE TABLE IF NOT EXISTS gravitee.github_allowed_users (\n"
            printf "  github_id varchar(64) PRIMARY KEY,\n"
            printf "  login varchar(255) NOT NULL,\n"
            printf "  desired_role varchar(16) NOT NULL DEFAULT 'USER',\n"
            printf "  synced_at timestamp without time zone NOT NULL DEFAULT now()\n"
            printf ");\n\n"

            printf "ALTER TABLE gravitee.github_allowed_users\n"
            printf "  ADD COLUMN IF NOT EXISTS desired_role varchar(16) NOT NULL DEFAULT 'USER';\n\n"

            printf "ALTER TABLE gravitee.users\n"
            printf "  ADD COLUMN IF NOT EXISTS github_id varchar(64);\n\n"

            printf "UPDATE gravitee.users\n"
            printf "   SET github_id = source_id\n"
            printf " WHERE source = 'github'\n"
            printf "   AND (github_id IS NULL OR github_id <> source_id);\n\n"

            printf "CREATE OR REPLACE FUNCTION gravitee.set_github_id()\n"
            printf "RETURNS trigger\n"
            printf "LANGUAGE plpgsql\n"
            printf "AS \$\$\n"
            printf "BEGIN\n"
            printf "  IF NEW.source = 'github' THEN\n"
            printf "    NEW.github_id := NEW.source_id;\n"
            printf "  ELSE\n"
            printf "    NEW.github_id := NULL;\n"
            printf "  END IF;\n"
            printf "  RETURN NEW;\n"
            printf "END;\n"
            printf "\$\$;\n\n"

            printf "DROP TRIGGER IF EXISTS tr_set_github_id ON gravitee.users;\n"
            printf "CREATE TRIGGER tr_set_github_id\n"
            printf "BEFORE INSERT OR UPDATE ON gravitee.users\n"
            printf "FOR EACH ROW\n"
            printf "EXECUTE FUNCTION gravitee.set_github_id();\n"
          } > "$SQL_TMP"

          PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U "$YUGABYTE_USER" -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 -f "$SQL_TMP"
          rm -f "$SQL_TMP"

          echo "🔧 Forcing portal user self-signup flags directly in database..."
          PORTAL_SQL=$(mktemp)
          {
            printf "INSERT INTO gravitee.parameters (reference_type, reference_id, key, value)\n"
            printf "VALUES ('ENVIRONMENT', 'DEFAULT', 'portal.userCreation.enabled', 'false')\n"
            printf "ON CONFLICT (reference_type, reference_id, key)\n"
            printf "DO UPDATE SET value = EXCLUDED.value;\n\n"

            printf "INSERT INTO gravitee.parameters (reference_type, reference_id, key, value)\n"
            printf "VALUES ('ENVIRONMENT', 'DEFAULT', 'portal.userCreation.automaticValidation', 'false')\n"
            printf "ON CONFLICT (reference_type, reference_id, key)\n"
            printf "DO UPDATE SET value = EXCLUDED.value;\n\n"

            printf "INSERT INTO gravitee.parameters (reference_type, reference_id, key, value)\n"
            printf "VALUES ('ENVIRONMENT', 'DEFAULT', 'portal.authentication.localLogin.enabled', 'false')\n"
            printf "ON CONFLICT (reference_type, reference_id, key)\n"
            printf "DO UPDATE SET value = EXCLUDED.value;\n\n"

            printf "INSERT INTO gravitee.parameters (reference_type, reference_id, key, value)\n"
            printf "VALUES ('ENVIRONMENT', 'DEFAULT', 'portal.authentication.forceLogin.enabled', 'true')\n"
            printf "ON CONFLICT (reference_type, reference_id, key)\n"
            printf "DO UPDATE SET value = EXCLUDED.value;\n"
          } > "$PORTAL_SQL"

          PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U "$YUGABYTE_USER" -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 -f "$PORTAL_SQL"
          rm -f "$PORTAL_SQL"

          echo "🔄 Synchronizing allowed GitHub members for login guard..."
          sync_memberships() {
            org_admin=$(psql_cmd -At -c "SELECT id FROM gravitee.roles WHERE scope = 'ORGANIZATION' AND name = 'ADMIN' LIMIT 1;" | tr -d '[:space:]')
            org_user=$(psql_cmd -At -c "SELECT id FROM gravitee.roles WHERE scope = 'ORGANIZATION' AND name = 'USER' LIMIT 1;" | tr -d '[:space:]')
            env_admin=$(psql_cmd -At -c "SELECT id FROM gravitee.roles WHERE scope = 'ENVIRONMENT' AND name = 'ADMIN' LIMIT 1;" | tr -d '[:space:]')
            env_user=$(psql_cmd -At -c "SELECT id FROM gravitee.roles WHERE scope = 'ENVIRONMENT' AND name = 'USER' LIMIT 1;" | tr -d '[:space:]')

            if [ -z "$org_admin" ] || [ -z "$org_user" ] || [ -z "$env_admin" ] || [ -z "$env_user" ]; then
              echo "❌ Unable to resolve Gravitee role IDs; aborting membership synchronization." >&2
              return 1
            fi

            SQL_TMP=$(mktemp)
            {
              printf "DELETE FROM gravitee.memberships m\n"
              printf "WHERE m.member_id IN (SELECT id FROM gravitee.users WHERE source = 'github')\n"
              printf "  AND NOT EXISTS (SELECT 1 FROM gravitee.roles r WHERE r.id = m.role_id);\n\n"

              printf "CREATE TEMP TABLE tmp_allowed AS\n"
              printf "SELECT u.id AS user_id, g.desired_role\n"
              printf "FROM gravitee.users u\n"
              printf "JOIN gravitee.github_allowed_users g ON g.github_id = u.source_id;\n\n"

              printf "DELETE FROM gravitee.memberships\n"
              printf "WHERE member_id IN (SELECT user_id FROM tmp_allowed);\n\n"

              printf "INSERT INTO gravitee.memberships (id, member_id, member_type, reference_type, reference_id, role_id)\n"
              printf "SELECT gen_random_uuid(), user_id, 'USER', 'ORGANIZATION', 'DEFAULT',\n"
              printf "  CASE WHEN desired_role = 'ADMIN' THEN '%s' ELSE '%s' END\n"
              printf "FROM tmp_allowed;\n\n" "$org_admin" "$org_user"

              printf "INSERT INTO gravitee.memberships (id, member_id, member_type, reference_type, reference_id, role_id)\n"
              printf "SELECT gen_random_uuid(), user_id, 'USER', 'ENVIRONMENT', 'DEFAULT',\n"
              printf "  CASE WHEN desired_role = 'ADMIN' THEN '%s' ELSE '%s' END\n"
              printf "FROM tmp_allowed;\n\n" "$env_admin" "$env_user"

              printf "DROP TABLE tmp_allowed;\n"
              printf "SELECT COUNT(*) AS synced_user_count FROM gravitee.users u\n"
              printf "WHERE u.id IN (SELECT id FROM gravitee.users WHERE source='github');\n"
            } > "$SQL_TMP"

            psql_cmd -f "$SQL_TMP" >/dev/null
            rm -f "$SQL_TMP"
            echo "✅ Membership synchronization completed for GitHub users."
            return 0
          }

          if ! seed_allowed_table; then
            echo "❌ Failed to seed GitHub allow-list; aborting configuration." >&2
            exit 1
          fi

          echo "🔄 Synchronizing Gravitee memberships based on GitHub teams..."
          if ! sync_memberships; then
            echo "❌ Failed to synchronize memberships; aborting configuration." >&2
            exit 1
          fi

          echo "🧹 Removing any unauthorized GitHub users before enforcing guard..."
          CLEANUP_SQL=$(mktemp)
          {
            printf "DELETE FROM gravitee.memberships\n"
            printf "WHERE member_id IN (\n"
            printf "  SELECT id FROM gravitee.users u\n"
            printf "  WHERE u.source = 'github'\n"
            printf "    AND NOT EXISTS (\n"
            printf "      SELECT 1 FROM gravitee.github_allowed_users allowed\n"
            printf "      WHERE allowed.github_id = u.source_id\n"
            printf "    )\n"
            printf ");\n\n"

            printf "DELETE FROM gravitee.users\n"
            printf "WHERE id IN (\n"
            printf "  SELECT id FROM gravitee.users u\n"
            printf "  WHERE u.source = 'github'\n"
            printf "    AND NOT EXISTS (\n"
            printf "      SELECT 1 FROM gravitee.github_allowed_users allowed\n"
            printf "      WHERE allowed.github_id = u.source_id\n"
            printf "    )\n"
            printf ");\n"
          } > "$CLEANUP_SQL"
          psql_cmd -f "$CLEANUP_SQL" >/dev/null
          rm -f "$CLEANUP_SQL"

          echo "🔐 Enforcing GitHub guard constraint..."
          FK_SQL=$(mktemp)
          {
            printf "ALTER TABLE gravitee.users\n"
            printf "  DROP CONSTRAINT IF EXISTS fk_github_allowed;\n\n"

            printf "ALTER TABLE gravitee.users\n"
            printf "  ADD CONSTRAINT fk_github_allowed\n"
            printf "  FOREIGN KEY (github_id)\n"
            printf "  REFERENCES gravitee.github_allowed_users (github_id)\n"
            printf "  DEFERRABLE INITIALLY IMMEDIATE;\n"
          } > "$FK_SQL"
          psql_cmd -f "$FK_SQL" >/dev/null
          rm -f "$FK_SQL"

          echo "✅ Gravitee GitHub configuration complete."
