    spec:
      serviceAccountName: gravitee
      initContainers:
      - name: wait-management-ready
        image: curlimages/curl:8.11.1
        imagePullPolicy: IfNotPresent
        env:
        - name: MANAGEMENT_HEALTH_URL
          value: "http://gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083/management/platform"
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
