        - name: ANALYTICS_JDBC_POOL_MIN_IDLE
          value: "0"
        - name: ANALYTICS_JDBC_POOL_CONNECTION_TIMEOUT
          value: "10000"
        - name: ANALYTICS_JDBC_POOL_IDLE_TIMEOUT
          value: "30000"
        - name: ANALYTICS_JDBC_POOL_MAX_LIFETIME
          value: "600000"
        - name: ANALYTICS_JDBC_POOL_REGISTER_MBEANS
          value: "false"
        - name: ANALYTICS_TYPE
          value: "none"
        - name: REPORTERS_ELASTIC_ENABLED
