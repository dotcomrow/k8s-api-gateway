apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-gateway-github-oauth
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-store              # or SecretStore if namespaced
    kind: ClusterSecretStore
  target:
    name: api-gateway-github-oauth # k8s Secret to create
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: api-gateway-github-client-id
        property: value
    - secretKey: client-secret
      remoteRef:
        key: api-gateway-github-client-secret
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gravitee-admin-credentials
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: gravitee-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/gravitee/admin-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: secret/gravitee/admin-credentials
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-gateway-github-team-token
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: api-gateway-github-team-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: api-gateway-github-team-token
        property: value
---
# Gravitee Management API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitee-management-api
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gravitee-management-api
  template:
    metadata:
      labels:
        app: gravitee-management-api
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "gravitee"
        vault.hashicorp.com/agent-inject-secret-db-creds: "yugabyte-db/static-creds/gravitee-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "yugabyte-db/static-creds/gravitee-app" -}}
          export YUGABYTE_USER="gravitee_app"
          export YUGABYTE_PASSWORD="{{ .Data.password }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-jwt: "secret/gravitee/jwt"
        vault.hashicorp.com/agent-inject-template-jwt: |
          {{- with secret "secret/gravitee/jwt" -}}
          export JWT_SECRET="{{ .Data.secret }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-apisix: "secret/apisix/admin"
        vault.hashicorp.com/agent-inject-template-apisix: |
          {{- with secret "secret/apisix/admin" -}}
          export APISIX_ADMIN_KEY="{{ .Data.data.key }}"
          {{- end }}
    spec:
      serviceAccountName: gravitee
      initContainers:
      - name: wait-database-setup
        image: alpine/k8s:1.31.4
        env:
        - name: YUGABYTE_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: YUGABYTE_PORT
          value: "5433"
        - name: YUGABYTE_DATABASE
          value: "gravitee"
        command:
        - sh
        - -c
        - |
          echo "🔧 Waiting for Gravitee database to be ready..."

          # Install required packages
          apk add --no-cache netcat-openbsd postgresql15-client

          # Wait for YugabyteDB to be reachable
          echo "🔍 Waiting for YugabyteDB to be reachable..."
          until nc -z "$YUGABYTE_HOST" "$YUGABYTE_PORT"; do
            echo "⏳ Waiting for YugabyteDB at $YUGABYTE_HOST:$YUGABYTE_PORT..."
            sleep 5
          done
          echo "✅ YugabyteDB is reachable"

          # Wait for gravitee database to exist
          echo "🔍 Waiting for gravitee database to be created..."
          RETRY_COUNT=0
          MAX_RETRIES=120
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d yugabyte -tAc \
              "SELECT 1 FROM pg_database WHERE datname='$YUGABYTE_DATABASE'" 2>/dev/null | grep -q "1"; then
              echo "✅ Gravitee database exists"

              # Ensure gravitee schema exists and set role search_path
              echo "🔧 Ensuring 'gravitee' schema and search_path..."
              PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 \
                -c "CREATE SCHEMA IF NOT EXISTS gravitee AUTHORIZATION gravitee_app;"
              PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 \
                -c "ALTER ROLE gravitee_app IN DATABASE gravitee SET search_path = gravitee, public;"

              # Re-check the schema exists
              if PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                "SELECT 1 FROM information_schema.schemata WHERE schema_name='gravitee'" 2>/dev/null | grep -q "1"; then
                echo "✅ Gravitee schema exists and role search_path is set"

                echo "🔍 Checking Liquibase changelog and ratelimit schema consistency..."
                SUB_COLUMN_EXISTS=$(PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                  "SELECT 1 FROM information_schema.columns WHERE table_schema='gravitee' AND table_name='ratelimit' AND column_name='subscription'" 2>/dev/null | tr -d '[:space:]')
                CHANGESET_LOGGED=$(PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                  "SELECT 1 FROM gravitee.databasechangelog WHERE id='1.25.2' AND author='GraviteeSource Team' AND filename='liquibase/changelogs/v1_25_2/schema.yml'" 2>/dev/null | tr -d '[:space:]')
                if [ "$SUB_COLUMN_EXISTS" = "1" ] && [ "$CHANGESET_LOGGED" != "1" ]; then
                  echo "⚠️  Detected legacy ratelimit.subscription column without matching Liquibase changelog entry."
                  echo "    Dropping column so Gravitee can re-run the official migration..."
                  PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 \
                    -c "ALTER TABLE gravitee.ratelimit DROP COLUMN IF EXISTS subscription;"
                else
                  echo "✅ Liquibase changelog and ratelimit schema look consistent"
                fi

                USERS_TABLE_EXISTS=$(PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                  "SELECT 1 FROM information_schema.tables WHERE table_schema='gravitee' AND table_name='users'" 2>/dev/null | tr -d '[:space:]')
                USERS_CHANGESET_LOGGED=$(PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                  "SELECT 1 FROM gravitee.databasechangelog WHERE id='1.14.0' AND author='GraviteeSource Team' AND filename='liquibase/changelogs/v1_14_0/schema.yml'" 2>/dev/null | tr -d '[:space:]')
                if [ "$USERS_TABLE_EXISTS" = "1" ] && [ "$USERS_CHANGESET_LOGGED" != "1" ]; then
                  echo "⚠️  Found gravitee.users table without matching Liquibase changeSet marker."
                  echo "    Dropping table to allow Liquibase to recreate it cleanly..."
                  PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 \
                    -c "DROP TABLE IF EXISTS gravitee.users CASCADE;"
                else
                  echo "✅ Liquibase changelog and users table look consistent"
                fi

                echo "✅ Database setup complete, Gravitee can start"
                exit 0
              else
                echo "❌ Gravitee schema verification failed after creation attempt"
                exit 1
              fi
            else
              echo "📄 Gravitee database not found yet"
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Waiting for database setup... (attempt $RETRY_COUNT/$MAX_RETRIES)"

            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Database setup not complete after $MAX_RETRIES attempts"
              exit 1
            fi
            sleep 5
          done
      containers:
      - name: gravitee-management-api
        image: ghcr.io/dotcomrow/gravitee-management-api:ts-20251118-171011
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: PORTAL_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-oauth
              key: client-id
        - name: PORTAL_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-oauth
              key: client-secret
        - name: PORTAL_OAUTH_SERVER_URL
          value: "https://github.com/login/oauth"
        - name: PORTAL_SSO_PROVIDER_NAME
          value: "GitHub"
        - name: PORTAL_SSO_PROVIDER_DESCRIPTION
          value: "Sign in with GitHub"
        - name: PORTAL_SSO_BUTTON_TEXT
          value: "Continue with GitHub"
        - name: PORTAL_SSO_AUTHORIZE_URL
          value: "https://gravitee.teleport.app.suncoast.systems/management/auth/oauth2/github/authorize"
        - name: PORTAL_SSO_TOKEN_URL
          value: "https://gravitee.teleport.app.suncoast.systems/management/auth/oauth2/github/access_token"
        - name: PORTAL_SSO_USERINFO_URL
          value: "https://gravitee.teleport.app.suncoast.systems/management/auth/oauth2/github/userinfo"
        - name: YUGABYTE_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: YUGABYTE_PORT
          value: "5433"
        - name: YUGABYTE_DATABASE
          value: "gravitee"
        - name: YUGABYTE_SCHEMA
          value: "gravitee"

        # Gravitee repository config for Yugabyte/PostgreSQL
        - name: MANAGEMENT_TYPE
          value: "jdbc"
        - name: MANAGEMENT_JDBC_DRIVER
          value: "org.postgresql.Driver"
        - name: MANAGEMENT_JDBC_URL
          value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/gravitee?currentSchema=gravitee"
        # NOTE: Password comes from Vault and is exported in the wrapper script
        # - name: MANAGEMENT_JDBC_PASSWORD  <-- intentionally not set here

        - name: ANALYTICS_TYPE
          value: "none"
        - name: ANALYTICS_JDBC_LIQUIBASE_ENABLED
          value: "false"
        - name: REPORTERS_ELASTIC_ENABLED
          value: "false"
        - name: SERVICES_CACHE_ENABLED
          value: "false"

        - name: K8S_NAMESPACE
          value: "k8s-api-gateway"
        - name: APISIX_SYNC_ENABLED
          value: "true"
        - name: APISIX_ADMIN_URL
          value: "http://apisix-admin.k8s-api-gateway.svc.cluster.local:9180"
        - name: JWT_ISSUER
          value: "k8s-api-gateway"
        - name: JWT_EXPIRE_AFTER
          value: "604800"
        - name: PORTAL_URL
          value: "https://gravitee.teleport.app.suncoast.systems/portal"
        - name: GATEWAY_URL
          value: "http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082"
        - name: EMAIL_HOST
          value: ""
        - name: EMAIL_PORT
          value: "587"
        - name: EMAIL_USERNAME
          value: ""
        - name: EMAIL_PASSWORD
          value: ""
        - name: EMAIL_FROM
          value: "noreply@k8s-api-gateway.local"
        - name: EMAIL_SUBJECT
          value: "[Gravitee.io] %s"
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "🔧 Loading secrets from Vault..."
          if [ -f /vault/secrets/db-creds ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/db-creds
            echo "✅ Database credentials loaded"
          fi
          if [ -f /vault/secrets/jwt ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/jwt
            echo "✅ JWT secret loaded"
          fi
          if [ -f /vault/secrets/apisix ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/apisix
            echo "✅ APISIX admin key loaded"
          fi

          # Wire JDBC creds for Gravitee from Vault-provided env
          export MANAGEMENT_JDBC_PASSWORD="$YUGABYTE_PASSWORD"
          export MANAGEMENT_JDBC_USERNAME="${YUGABYTE_USER:-gravitee_app}"

          echo "🚀 Starting Gravitee Management API..."
          set +e
          ./bin/gravitee
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ Gravitee Management API exited with code $EXIT_CODE. Holding pod for investigation (not restarting)..."
            while true; do sleep 3600; done
          fi
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 480
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 240
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
---
# Gravitee Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitee-gateway
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gravitee-gateway
  template:
    metadata:
      labels:
        app: gravitee-gateway
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "gravitee"
        vault.hashicorp.com/agent-inject-secret-db-creds: "yugabyte-db/static-creds/gravitee-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "yugabyte-db/static-creds/gravitee-app" -}}
          export YUGABYTE_USER="gravitee_app"
          export YUGABYTE_PASSWORD="{{ .Data.password }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-apisix: "secret/apisix/admin"
        vault.hashicorp.com/agent-inject-template-apisix: |
          {{- with secret "secret/apisix/admin" -}}
          export APISIX_ADMIN_KEY="{{ .Data.data.key }}"
          {{- end }}
    spec:
      serviceAccountName: gravitee
      initContainers:
      - name: wait-management-ready
        image: curlimages/curl:8.11.1
        imagePullPolicy: IfNotPresent
        env:
        - name: MANAGEMENT_HEALTH_URL
          value: "http://gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083/management/platform"
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "🔍 Waiting for Gravitee Management API before starting gateway..."
          while true; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$MANAGEMENT_HEALTH_URL" || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "✅ Management API responded with HTTP $STATUS, continuing startup."
              break
            fi
            echo "⏳ Management API not ready yet (status $STATUS), retrying in 5s..."
            sleep 5
          done
      containers:
      - name: gravitee-gateway
        image: ghcr.io/dotcomrow/gravitee-gateway:ts-20251116-025809
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: YUGABYTE_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: YUGABYTE_PORT
          value: "5433"
        - name: YUGABYTE_DATABASE
          value: "gravitee"
        - name: YUGABYTE_SCHEMA
          value: "gravitee"

        # Gravitee repository config for Yugabyte/PostgreSQL (gateway also needs to reach management store)
        - name: MANAGEMENT_TYPE
          value: "jdbc"
        - name: MANAGEMENT_JDBC_DRIVER
          value: "org.postgresql.Driver"
        - name: MANAGEMENT_JDBC_URL
          value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/gravitee?currentSchema=gravitee"
        - name: MANAGEMENT_JDBC_USERNAME
          value: "gravitee_app"
        - name: MANAGEMENT_JDBC_LIQUIBASE_ENABLED
          value: "false"
        - name: ANALYTICS_JDBC_LIQUIBASE_ENABLED
          value: "false"
        - name: ANALYTICS_TYPE
          value: "none"
        - name: REPORTERS_ELASTIC_ENABLED
          value: "false"
        - name: SERVICES_CACHE_ENABLED
          value: "false"
        - name: SERVICES_HEARTBEAT_ENABLED
          value: "false"
        - name: SERVICES_ALERT_ENABLED
          value: "false"
        - name: GRAVITEE_SERVICES_CACHE_ENABLED
          value: "false"
        - name: GRAVITEE_SERVICES_HEARTBEAT_ENABLED
          value: "false"
        - name: GRAVITEE_SERVICES_ALERT_ENABLED
          value: "false"
        - name: NODE_CACHE_ENABLED
          value: "false"
        - name: NODE_HEARTBEAT_ENABLED
          value: "false"
        - name: NODE_ALERT_ENABLED
          value: "false"
        - name: GRAVITEE_NODE_CACHE_ENABLED
          value: "false"
        - name: GRAVITEE_NODE_HEARTBEAT_ENABLED
          value: "false"
        - name: GRAVITEE_NODE_ALERT_ENABLED
          value: "false"
        # Password comes from Vault -> exported below

        - name: K8S_NAMESPACE
          value: "k8s-api-gateway"
        - name: APISIX_SYNC_ENABLED
          value: "true"
        - name: APISIX_ADMIN_URL
          value: "http://apisix-admin.k8s-api-gateway.svc.cluster.local:9180"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "🔧 Loading secrets from Vault..."
          if [ -f /vault/secrets/db-creds ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/db-creds
            echo "✅ Database credentials loaded"
          fi
          if [ -f /vault/secrets/apisix ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/apisix
            echo "✅ APISIX admin key loaded"
          fi

          # Wire JDBC creds for Gravitee from Vault-provided env
          export MANAGEMENT_JDBC_PASSWORD="$YUGABYTE_PASSWORD"
          export MANAGEMENT_JDBC_USERNAME="${MANAGEMENT_JDBC_USERNAME:-gravitee_app}"

          echo "🚀 Starting Gravitee Gateway..."
          exec ./bin/gravitee
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18082/health || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
                exit 0
              fi
              echo "Liveness probe failed, management health returned $STATUS" >&2
              exit 1
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 4
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18082/health || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
                exit 0
              fi
              echo "Readiness probe failed, management health returned $STATUS" >&2
              exit 1
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: gateway-config
          mountPath: /opt/graviteeio-gateway/config/gravitee.yml
          subPath: gravitee.yml
      volumes:
      - name: gateway-config
        configMap:
          name: gravitee-gateway-config
---
# Gravitee Portal Deployment
