          value: "10000"
        - name: MANAGEMENT_JDBC_POOL_IDLE_TIMEOUT
          value: "30000"
        - name: MANAGEMENT_JDBC_POOL_MAX_LIFETIME
          value: "600000"
        - name: MANAGEMENT_JDBC_POOL_REGISTER_MBEANS
          value: "false"
        - name: ANALYTICS_JDBC_LIQUIBASE_ENABLED
          value: "false"
        - name: RATELIMIT_JDBC_POOL_MAX_POOL_SIZE
          value: "4"
        - name: RATELIMIT_JDBC_POOL_MIN_IDLE
          value: "0"
        - name: RATELIMIT_JDBC_POOL_CONNECTION_TIMEOUT
          value: "10000"
        - name: RATELIMIT_JDBC_POOL_IDLE_TIMEOUT
          value: "30000"
        - name: RATELIMIT_JDBC_POOL_MAX_LIFETIME
          value: "600000"
        - name: RATELIMIT_JDBC_POOL_REGISTER_MBEANS
          value: "false"
        - name: ANALYTICS_JDBC_POOL_MAX_POOL_SIZE
