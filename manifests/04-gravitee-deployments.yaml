# GitHub email proxy (merge /user and /user/emails)
apiVersion: v1
kind: ConfigMap
metadata:
  name: gravitee-github-email-proxy
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  server.py: |-
    #!/usr/bin/env python3
    import json
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.error import HTTPError, URLError
    from urllib.request import Request, urlopen

    GITHUB_API = os.environ.get("GITHUB_API", "https://api.github.com")
    USER_AGENT = os.environ.get("USER_AGENT", "gravitee-github-email-proxy")
    PORT = int(os.environ.get("PORT", "8080"))

    def extract_token(auth_header):
        if not auth_header:
            return ""
        parts = auth_header.split()
        if len(parts) == 2 and parts[0].lower() in ("bearer", "token"):
            return parts[1]
        return ""

    def fetch_json(url, token, allow_fail=False):
        headers = {
            "Authorization": f"Bearer {token}",
            "Accept": "application/vnd.github+json",
            "User-Agent": USER_AGENT,
            "X-GitHub-Api-Version": "2022-11-28",
        }
        req = Request(url, headers=headers)
        try:
            with urlopen(req, timeout=10) as resp:
                payload = resp.read().decode("utf-8")
                return json.loads(payload)
        except (HTTPError, URLError, ValueError):
            if allow_fail:
                return None
            raise

    def pick_email(emails):
        if not emails:
            return ""
        for item in emails:
            if item.get("primary") and item.get("verified") and item.get("email"):
                return item.get("email")
        for item in emails:
            if item.get("verified") and item.get("email"):
                return item.get("email")
        first = emails[0] if emails else {}
        return first.get("email", "")

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.startswith("/healthz"):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return

            if not self.path.startswith("/userinfo"):
                self.send_response(404)
                self.end_headers()
                self.wfile.write(b"not found")
                return

            token = extract_token(self.headers.get("Authorization", ""))
            if not token:
                self.send_response(401)
                self.end_headers()
                self.wfile.write(b"missing token")
                return

            try:
                profile = fetch_json(f"{GITHUB_API}/user", token, allow_fail=False) or {}
                emails = fetch_json(f"{GITHUB_API}/user/emails", token, allow_fail=True) or []
            except Exception:
                self.send_response(502)
                self.end_headers()
                self.wfile.write(b"upstream error")
                return

            email = pick_email(emails)
            if email:
                profile["email"] = email

            body = json.dumps(profile).encode("utf-8")
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, format, *args):
            return

    if __name__ == "__main__":
        HTTPServer(("", PORT), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
