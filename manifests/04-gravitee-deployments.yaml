              if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
                exit 0
              fi
              echo "Liveness probe failed, management health returned $STATUS" >&2
              exit 1
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 4
        readinessProbe:
          exec:
            command:
            - /bin/sh
