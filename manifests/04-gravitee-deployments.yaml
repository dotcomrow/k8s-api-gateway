---
# Gravitee Management API Service
apiVersion: v1
kind: Service
metadata:
  name: gravitee-management-api
  namespace: k8s-api-gateway
  labels:
    app: gravitee-management-api
spec:
  selector:
    app: gravitee-management-api
  ports:
  - name: http
    port: 8083
    targetPort: 8083
  type: ClusterIP
---
# Gravitee Management API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitee-management-api
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gravitee-management-api
  template:
    metadata:
      labels:
        app: gravitee-management-api
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "gravitee"
        vault.hashicorp.com/agent-inject-secret-db-creds: "yugabyte-db/static-creds/gravitee-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "yugabyte-db/static-creds/gravitee-app" -}}
          export YUGABYTE_USER="gravitee_app"
          export YUGABYTE_PASSWORD="{{ .Data.password }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-jwt: "secret/gravitee/jwt"
        vault.hashicorp.com/agent-inject-template-jwt: |
          {{- with secret "secret/gravitee/jwt" -}}
          export JWT_SECRET="{{ .Data.secret }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-apisix: "secret/apisix/admin"
        vault.hashicorp.com/agent-inject-template-apisix: |
          {{- with secret "secret/apisix/admin" -}}
          export APISIX_ADMIN_KEY="{{ .Data.data.key }}"
          {{- end }}
    spec:
      serviceAccountName: gravitee
      initContainers:
      - name: wait-database-setup
        image: alpine/k8s:1.31.4
        env:
        - name: YUGABYTE_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: YUGABYTE_PORT
          value: "5433"
        - name: YUGABYTE_DATABASE
          value: "gravitee"
        command:
        - sh
        - -c
        - |
          echo "🔧 Waiting for Gravitee database to be ready..."

          # Install required packages
          apk add --no-cache netcat-openbsd postgresql15-client

          # Wait for YugabyteDB to be reachable
          echo "🔍 Waiting for YugabyteDB to be reachable..."
          until nc -z "$YUGABYTE_HOST" "$YUGABYTE_PORT"; do
            echo "⏳ Waiting for YugabyteDB at $YUGABYTE_HOST:$YUGABYTE_PORT..."
            sleep 5
          done
          echo "✅ YugabyteDB is reachable"

          # Wait for gravitee database to exist
          echo "🔍 Waiting for gravitee database to be created..."
          RETRY_COUNT=0
          MAX_RETRIES=120
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d yugabyte -tAc \
              "SELECT 1 FROM pg_database WHERE datname='$YUGABYTE_DATABASE'" 2>/dev/null | grep -q "1"; then
              echo "✅ Gravitee database exists"

              # Ensure gravitee schema exists and set role search_path
              echo "🔧 Ensuring 'gravitee' schema and search_path..."
              PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 \
                -c "CREATE SCHEMA IF NOT EXISTS gravitee AUTHORIZATION gravitee_app;"
              PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 \
                -c "ALTER ROLE gravitee_app IN DATABASE gravitee SET search_path = gravitee, public;"

              # Re-check the schema exists
              if PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                "SELECT 1 FROM information_schema.schemata WHERE schema_name='gravitee'" 2>/dev/null | grep -q "1"; then
                echo "✅ Gravitee schema exists and role search_path is set"

                echo "🔍 Checking Liquibase changelog and ratelimit schema consistency..."
                SUB_COLUMN_EXISTS=$(PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                  "SELECT 1 FROM information_schema.columns WHERE table_schema='gravitee' AND table_name='ratelimit' AND column_name='subscription'" 2>/dev/null | tr -d '[:space:]')
                CHANGESET_LOGGED=$(PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                  "SELECT 1 FROM gravitee.databasechangelog WHERE id='1.25.2' AND author='GraviteeSource Team' AND filename='liquibase/changelogs/v1_25_2/schema.yml'" 2>/dev/null | tr -d '[:space:]')
                if [ "$SUB_COLUMN_EXISTS" = "1" ] && [ "$CHANGESET_LOGGED" != "1" ]; then
                  echo "⚠️  Detected legacy ratelimit.subscription column without matching Liquibase changelog entry."
                  echo "    Dropping column so Gravitee can re-run the official migration..."
                  PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 \
                    -c "ALTER TABLE gravitee.ratelimit DROP COLUMN IF EXISTS subscription;"
                else
                  echo "✅ Liquibase changelog and ratelimit schema look consistent"
                fi

                USERS_TABLE_EXISTS=$(PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                  "SELECT 1 FROM information_schema.tables WHERE table_schema='gravitee' AND table_name='users'" 2>/dev/null | tr -d '[:space:]')
                USERS_CHANGESET_LOGGED=$(PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                  "SELECT 1 FROM gravitee.databasechangelog WHERE id='1.14.0' AND author='GraviteeSource Team' AND filename='liquibase/changelogs/v1_14_0/schema.yml'" 2>/dev/null | tr -d '[:space:]')
                if [ "$USERS_TABLE_EXISTS" = "1" ] && [ "$USERS_CHANGESET_LOGGED" != "1" ]; then
                  echo "⚠️  Found gravitee.users table without matching Liquibase changeSet marker."
                  echo "    Dropping table to allow Liquibase to recreate it cleanly..."
                  PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 \
                    -c "DROP TABLE IF EXISTS gravitee.users CASCADE;"
                else
                  echo "✅ Liquibase changelog and users table look consistent"
                fi

                echo "✅ Database setup complete, Gravitee can start"
                exit 0
              else
                echo "❌ Gravitee schema verification failed after creation attempt"
                exit 1
              fi
            else
              echo "📄 Gravitee database not found yet"
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Waiting for database setup... (attempt $RETRY_COUNT/$MAX_RETRIES)"

            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Database setup not complete after $MAX_RETRIES attempts"
              exit 1
            fi
            sleep 5
          done
      containers:
      - name: gravitee-management-api
        image: ghcr.io/dotcomrow/gravitee-management-api:ts-20251112-214912
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: YUGABYTE_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: YUGABYTE_PORT
          value: "5433"
        - name: YUGABYTE_DATABASE
          value: "gravitee"
        - name: YUGABYTE_SCHEMA
          value: "gravitee"

        # Gravitee repository config for Yugabyte/PostgreSQL
        - name: MANAGEMENT_TYPE
          value: "jdbc"
        - name: MANAGEMENT_JDBC_DRIVER
          value: "org.postgresql.Driver"
        - name: MANAGEMENT_JDBC_URL
          value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/gravitee?currentSchema=gravitee"
        - name: MANAGEMENT_JDBC_USERNAME
          value: "gravitee_app"
        # NOTE: Password comes from Vault and is exported in the wrapper script
        # - name: MANAGEMENT_JDBC_PASSWORD  <-- intentionally not set here

        - name: ANALYTICS_TYPE
          value: "none"
        - name: ANALYTICS_JDBC_LIQUIBASE_ENABLED
          value: "false"
        - name: REPORTERS_ELASTIC_ENABLED
          value: "false"
        - name: SERVICES_CACHE_ENABLED
          value: "false"

        - name: K8S_NAMESPACE
          value: "k8s-api-gateway"
        - name: APISIX_SYNC_ENABLED
          value: "true"
        - name: APISIX_ADMIN_URL
          value: "http://apisix-admin.k8s-api-gateway.svc.cluster.local:9180"
        - name: JWT_ISSUER
          value: "k8s-api-gateway"
        - name: JWT_EXPIRE_AFTER
          value: "604800"
        - name: PORTAL_URL
          value: "http://gravitee-portal.k8s-api-gateway.svc.cluster.local:8080"
        - name: GATEWAY_URL
          value: "http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082"
        - name: EMAIL_HOST
          value: ""
        - name: EMAIL_PORT
          value: "587"
        - name: EMAIL_USERNAME
          value: ""
        - name: EMAIL_PASSWORD
          value: ""
        - name: EMAIL_FROM
          value: "noreply@k8s-api-gateway.local"
        - name: EMAIL_SUBJECT
          value: "[Gravitee.io] %s"
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "🔧 Loading secrets from Vault..."
          if [ -f /vault/secrets/db-creds ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/db-creds
            echo "✅ Database credentials loaded"
          fi
          if [ -f /vault/secrets/jwt ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/jwt
            echo "✅ JWT secret loaded"
          fi
          if [ -f /vault/secrets/apisix ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/apisix
            echo "✅ APISIX admin key loaded"
          fi

          # Wire JDBC creds for Gravitee from Vault-provided env
          export MANAGEMENT_JDBC_PASSWORD="$YUGABYTE_PASSWORD"
          export MANAGEMENT_JDBC_USERNAME="${MANAGEMENT_JDBC_USERNAME:-gravitee_app}"

          echo "🚀 Starting Gravitee Management API..."
          set +e
          ./bin/gravitee
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ Gravitee Management API exited with code $EXIT_CODE. Holding pod for investigation (not restarting)..."
            while true; do sleep 3600; done
          fi
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 480
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 240
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
---
# Gravitee Gateway Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitee-gateway
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gravitee-gateway
  template:
    metadata:
      labels:
        app: gravitee-gateway
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "gravitee"
        vault.hashicorp.com/agent-inject-secret-db-creds: "yugabyte-db/static-creds/gravitee-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "yugabyte-db/static-creds/gravitee-app" -}}
          export YUGABYTE_USER="gravitee_app"
          export YUGABYTE_PASSWORD="{{ .Data.password }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-apisix: "secret/apisix/admin"
        vault.hashicorp.com/agent-inject-template-apisix: |
          {{- with secret "secret/apisix/admin" -}}
          export APISIX_ADMIN_KEY="{{ .Data.data.key }}"
          {{- end }}
    spec:
      serviceAccountName: gravitee
      initContainers:
      - name: wait-management-ready
        image: curlimages/curl:8.11.1
        imagePullPolicy: IfNotPresent
        env:
        - name: MANAGEMENT_HEALTH_URL
          value: "http://gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083/management/platform"
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "🔍 Waiting for Gravitee Management API before starting gateway..."
          while true; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$MANAGEMENT_HEALTH_URL" || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "✅ Management API responded with HTTP $STATUS, continuing startup."
              break
            fi
            echo "⏳ Management API not ready yet (status $STATUS), retrying in 5s..."
            sleep 5
          done
      containers:
      - name: gravitee-gateway
        image: ghcr.io/dotcomrow/gravitee-gateway:ts-20251112-214915
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: YUGABYTE_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: YUGABYTE_PORT
          value: "5433"
        - name: YUGABYTE_DATABASE
          value: "gravitee"
        - name: YUGABYTE_SCHEMA
          value: "gravitee"

        # Gravitee repository config for Yugabyte/PostgreSQL (gateway also needs to reach management store)
        - name: MANAGEMENT_TYPE
          value: "jdbc"
        - name: MANAGEMENT_JDBC_DRIVER
          value: "org.postgresql.Driver"
        - name: MANAGEMENT_JDBC_URL
          value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/gravitee?currentSchema=gravitee"
        - name: MANAGEMENT_JDBC_USERNAME
          value: "gravitee_app"
        - name: MANAGEMENT_JDBC_LIQUIBASE_ENABLED
          value: "false"
        - name: ANALYTICS_JDBC_LIQUIBASE_ENABLED
          value: "false"
        - name: ANALYTICS_TYPE
          value: "none"
        - name: REPORTERS_ELASTIC_ENABLED
          value: "false"
        - name: SERVICES_CACHE_ENABLED
          value: "false"
        - name: SERVICES_HEARTBEAT_ENABLED
          value: "false"
        - name: SERVICES_ALERT_ENABLED
          value: "false"
        - name: GRAVITEE_SERVICES_CACHE_ENABLED
          value: "false"
        - name: GRAVITEE_SERVICES_HEARTBEAT_ENABLED
          value: "false"
        - name: GRAVITEE_SERVICES_ALERT_ENABLED
          value: "false"
        - name: NODE_CACHE_ENABLED
          value: "false"
        - name: NODE_HEARTBEAT_ENABLED
          value: "false"
        - name: NODE_ALERT_ENABLED
          value: "false"
        - name: GRAVITEE_NODE_CACHE_ENABLED
          value: "false"
        - name: GRAVITEE_NODE_HEARTBEAT_ENABLED
          value: "false"
        - name: GRAVITEE_NODE_ALERT_ENABLED
          value: "false"
        # Password comes from Vault -> exported below

        - name: K8S_NAMESPACE
          value: "k8s-api-gateway"
        - name: APISIX_SYNC_ENABLED
          value: "true"
        - name: APISIX_ADMIN_URL
          value: "http://apisix-admin.k8s-api-gateway.svc.cluster.local:9180"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "🔧 Loading secrets from Vault..."
          if [ -f /vault/secrets/db-creds ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/db-creds
            echo "✅ Database credentials loaded"
          fi
          if [ -f /vault/secrets/apisix ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/apisix
            echo "✅ APISIX admin key loaded"
          fi

          # Wire JDBC creds for Gravitee from Vault-provided env
          export MANAGEMENT_JDBC_PASSWORD="$YUGABYTE_PASSWORD"
          export MANAGEMENT_JDBC_USERNAME="${MANAGEMENT_JDBC_USERNAME:-gravitee_app}"

          echo "🚀 Starting Gravitee Gateway..."
          exec ./bin/gravitee
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /_node/health
            port: 8082
          initialDelaySeconds: 480
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /_node/health
            port: 8082
          initialDelaySeconds: 240
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: gateway-config
          mountPath: /opt/graviteeio-gateway/config/gravitee.yml
          subPath: gravitee.yml
      volumes:
      - name: gateway-config
        configMap:
          name: gravitee-gateway-config
---
# Gravitee Portal Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitee-portal
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gravitee-portal
  template:
    metadata:
      labels:
        app: gravitee-portal
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: gravitee
      initContainers:
      - name: wait-management-ready
        image: curlimages/curl:8.11.1
        imagePullPolicy: IfNotPresent
        env:
        - name: MANAGEMENT_HEALTH_URL
          value: "http://gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083/management/platform"
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "🔍 Waiting for Gravitee Management API before starting portal..."
          while true; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$MANAGEMENT_HEALTH_URL" || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "✅ Management API responded with HTTP $STATUS, continuing startup."
              break
            fi
            echo "⏳ Management API not ready yet (status $STATUS), retrying in 5s..."
            sleep 5
          done
      containers:
      - name: gravitee-portal
        image: ghcr.io/dotcomrow/gravitee-portal:ts-20251112-214917
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORTAL_OAUTH_CLIENT_ID
          value: "gravitee-portal"
        - name: PORTAL_OAUTH_SERVER_URL
          value: "http://gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083"
        - name: MANAGEMENT_JDBC_LIQUIBASE_ENABLED
          value: "false"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /index.html
            port: 8080
          initialDelaySeconds: 240
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /index.html
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: portal-nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: portal-nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: portal-nginx-config
        configMap:
          name: gravitee-portal-nginx
---
# Gravitee Portal Nginx config
apiVersion: v1
kind: ConfigMap
metadata:
  name: gravitee-portal-nginx
  namespace: k8s-api-gateway
data:
  nginx.conf: |-
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /rw.mount/nginx/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        proxy_temp_path /rw.mount/nginx/proxy_temp;
        client_body_temp_path /rw.mount/nginx/client_temp;
        fastcgi_temp_path /rw.mount/nginx/fastcgi_temp;
        uwsgi_temp_path /rw.mount/nginx/uwsgi_temp;
        scgi_temp_path /rw.mount/nginx/scgi_temp;

        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        keepalive_timeout  65;

        include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |-
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        add_header Content-Security-Policy "frame-ancestors 'self';" always;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options nosniff;
        add_header X-Permitted-Cross-Domain-Policies none;

        index index.html index.htm;
        charset utf-8;

        gzip on;
        gzip_disable "msie6";

        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;

        location /next {
            rewrite ^ /next/ last;
        }

        location /next/ {
            alias /usr/share/nginx/html/next/browser/;
            try_files $uri $uri/ /next/index.html;
            sub_filter '<base href="/"' '<base href="/next/"';
            sub_filter_once on;
        }

        location / {
            try_files $uri $uri/ /index.html =404;
            root /usr/share/nginx/html;
            sub_filter '<base href="/"' '<base href="/"';
            sub_filter_once on;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /rw.mount/www;
        }
    }
---
# Gravitee Gateway config
apiVersion: v1
kind: ConfigMap
metadata:
  name: gravitee-gateway-config
  namespace: k8s-api-gateway
data:
  gravitee.yml: |-
    ############################################################################################################
    # Gravitee.io API Gateway Configuration for YugabyteDB and APISIX Integration
    ############################################################################################################
    gravitee:
      # Management API connection
      management:
        url: http://gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083
    
    # HTTP server configuration  
    http:
      port: 8082
      host: 0.0.0.0
      
    # Cache configuration (use Hazelcast since Ehcache plugin is not packaged in our custom image)
    cache:
      type: hazelcast
    # Sharding tags for multi-gateway deployments
    sharding_tags: ${SHARDING_TAGS:}
    
    # Multi-tenant configuration  
    tenant: ${TENANT:}
    
    # Plugin repository
    plugins:
      path: ${gravitee.home}/plugins
    
    # Gateway services
    services:
      # Kubernetes service discovery
      discovery:
        kubernetes:
          enabled: true
          service:
            namespace: ${K8S_NAMESPACE:k8s-api-gateway}
    
      # Sync service for management repository
      sync:
        # Synchronization delay
        delay: 5000
        unit: MILLISECONDS
        distributed: false
    
      # Monitoring and metrics  
      monitoring:
        delay: 5000
        unit: MILLISECONDS
        distributed: false
    
      cache:
        enabled: false
    
      heartbeat:
        enabled: false
    
      alert:
        enabled: false
    
      # APISIX route sync service
      apisix-sync:
        enabled: ${APISIX_SYNC_ENABLED:true}
        admin-url: ${APISIX_ADMIN_URL:http://apisix-admin.k8s-api-gateway.svc.cluster.local:9180}
        admin-key: ${APISIX_ADMIN_KEY}
        sync-interval: ${APISIX_SYNC_INTERVAL:30000}
    
    # Security configuration
    security:
      keystore:
        type: ${KEYSTORE_TYPE:JKS}  
        path: ${KEYSTORE_PATH:${gravitee.home}/security/keystore.jks}
        password: ${KEYSTORE_PASSWORD}
      truststore:
        type: ${TRUSTSTORE_TYPE:JKS}
        path: ${TRUSTSTORE_PATH:${gravitee.home}/security/truststore.jks}
        password: ${TRUSTSTORE_PASSWORD}
    
    # Rate limiting - using YugabyteDB for distributed rate limiting
    ratelimit:
      type: jdbc
      jdbc:
        driver: org.postgresql.Driver
        host: ${YUGABYTE_HOST:yugabytedb-service.k8s-api-gateway.svc.cluster.local}
        port: ${YUGABYTE_PORT:5433}
        database: ${YUGABYTE_DATABASE:gravitee}
        username: ${YUGABYTE_USER:gravitee_app} 
        password: ${YUGABYTE_PASSWORD}
        schema: ${YUGABYTE_SCHEMA:gravitee}
    
    # Analytics configuration
    analytics:
      type: jdbc
      jdbc:
        driver: org.postgresql.Driver
        host: ${YUGABYTE_HOST:yugabytedb-service.k8s-api-gateway.svc.cluster.local}
        port: ${YUGABYTE_PORT:5433}
        database: ${YUGABYTE_DATABASE:gravitee}
        username: ${YUGABYTE_USER:gravitee_app}
        password: ${YUGABYTE_PASSWORD}
        schema: ${YUGABYTE_SCHEMA:gravitee}
    
    # Distributed cache for API keys and subscriptions (already configured above)
    
    # Health check configuration
    node:
      cache:
        enabled: false
      heartbeat:
        enabled: false
      alert:
        enabled: false
      services:
        cache:
          enabled: false
        heartbeat:
          enabled: false
        alert:
          enabled: false
      name: ${NODE_NAME:gravitee-gateway}
      metadata:
        node.id: ${NODE_ID:${random.uuid}}
    
    # Logging configuration
    logging:
      level:
        io.gravitee: ${GRAVITEE_LOG_LEVEL:INFO}
        org.springframework: ${SPRING_LOG_LEVEL:WARN}
        org.eclipse.jetty: ${JETTY_LOG_LEVEL:WARN}
    
    # Reporters - send metrics to multiple systems
    reporters:
      # File reporter for debugging
      file:
        enabled: true
        fileName: ${gravitee.home}/logs/gravitee_metrics_%s.json
    
    # API endpoints exposure  
    api:
      # Health check endpoint
      health:
        enabled: true
      # Node information endpoint  
      node:
        enabled: true
---
