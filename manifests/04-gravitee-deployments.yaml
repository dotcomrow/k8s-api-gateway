              echo "✅ Management API responded with HTTP $STATUS, continuing startup."
              break
            fi
            echo "⏳ Management API not ready yet (status $STATUS), retrying in 5s..."
            sleep 5
          done
      containers:
      - name: gravitee-portal
        image: ghcr.io/dotcomrow/gravitee-portal:ts-20251118-005529
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: PORTAL_API_URL
          value: "https://gravitee.teleport.app.suncoast.systems/management"
        - name: MANAGEMENT_JDBC_LIQUIBASE_ENABLED
          value: "false"
        - name: PORTAL_SSO_PROVIDER_NAME
          value: "GitHub"
        - name: PORTAL_SSO_PROVIDER_DESCRIPTION
          value: "Sign in with GitHub"
        - name: PORTAL_SSO_BUTTON_TEXT
          value: "Continue with GitHub"
        - name: PORTAL_SSO_AUTHORIZE_URL
          value: "https://gravitee.teleport.app.suncoast.systems/management/auth/oauth2/github/authorize"
        - name: PORTAL_SSO_TOKEN_URL
          value: "https://gravitee.teleport.app.suncoast.systems/management/auth/oauth2/github/access_token"
        - name: PORTAL_SSO_USERINFO_URL
          value: "https://gravitee.teleport.app.suncoast.systems/management/auth/oauth2/github/userinfo"
        - name: PORTAL_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-oauth
              key: client-id
        - name: PORTAL_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-oauth
              key: client-secret
        - name: PORTAL_OAUTH_SERVER_URL
          value: "https://github.com/login/oauth"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /index.html
            port: 8080
          initialDelaySeconds: 240
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /index.html
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: portal-nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: portal-nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: portal-nginx-config
        configMap:
          name: gravitee-portal-nginx
---
# Gravitee Portal Nginx config
apiVersion: v1
kind: ConfigMap
metadata:
  name: gravitee-portal-nginx
  namespace: k8s-api-gateway
data:
  nginx.conf: |-
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /rw.mount/nginx/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        proxy_temp_path /rw.mount/nginx/proxy_temp;
        client_body_temp_path /rw.mount/nginx/client_temp;
        fastcgi_temp_path /rw.mount/nginx/fastcgi_temp;
        uwsgi_temp_path /rw.mount/nginx/uwsgi_temp;
        scgi_temp_path /rw.mount/nginx/scgi_temp;

        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        keepalive_timeout  65;

        include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |-
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        add_header Content-Security-Policy "frame-ancestors 'self';" always;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options nosniff;
        add_header X-Permitted-Cross-Domain-Policies none;

        index index.html index.htm;
        charset utf-8;

        gzip on;
        gzip_disable "msie6";

        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;

        location /next {
            rewrite ^ /next/ last;
        }

        location /next/ {
            alias /usr/share/nginx/html/next/browser/;
            try_files $uri $uri/ /next/index.html;
            sub_filter '<base href="/"' '<base href="/next/"';
            sub_filter_once on;
        }

        location / {
            try_files $uri $uri/ /index.html =404;
            root /usr/share/nginx/html;
            sub_filter '<base href="/"' '<base href="/"';
            sub_filter_once on;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /rw.mount/www;
        }
    }
---
# Gravitee Gateway config
apiVersion: v1
kind: ConfigMap
metadata:
  name: gravitee-gateway-config
  namespace: k8s-api-gateway
data:
  gravitee.yml: |-
    ############################################################################################################
    # Gravitee.io API Gateway Configuration for YugabyteDB and APISIX Integration
    ############################################################################################################
    gravitee:
      # Management API connection
      management:
        url: http://gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083
    
    # HTTP server configuration  
    http:
      port: 8082
      host: 0.0.0.0
      
    # Cache configuration (use the bundled standalone cache manager / Ehcache)
    cache:
      type: standalone
      standalone:
        config: ${gravitee.home}/config/ehcache.xml
    # Sharding tags for multi-gateway deployments
    sharding_tags: ${SHARDING_TAGS:}
    
    # Multi-tenant configuration  
    tenant: ${TENANT:}
    
    # Plugin repository
    plugins:
      path: ${gravitee.home}/plugins
    
    # Gateway services
    services:
      # Kubernetes service discovery
      discovery:
        kubernetes:
          enabled: true
          service:
            namespace: ${K8S_NAMESPACE:k8s-api-gateway}
    
      # Sync service for management repository
      sync:
        # Synchronization delay
        delay: 5000
        unit: MILLISECONDS
        distributed: false
    
      # Monitoring and metrics  
      monitoring:
        delay: 5000
        unit: MILLISECONDS
        distributed: false
    
      cache:
        enabled: false
    
      heartbeat:
        enabled: false
    
      alert:
        enabled: false
    
      # APISIX route sync service
      apisix-sync:
        enabled: ${APISIX_SYNC_ENABLED:true}
        admin-url: ${APISIX_ADMIN_URL:http://apisix-admin.k8s-api-gateway.svc.cluster.local:9180}
        admin-key: ${APISIX_ADMIN_KEY}
        sync-interval: ${APISIX_SYNC_INTERVAL:30000}
    
    # Security configuration
    security:
      keystore:
        type: ${KEYSTORE_TYPE:JKS}  
        path: ${KEYSTORE_PATH:${gravitee.home}/security/keystore.jks}
        password: ${KEYSTORE_PASSWORD}
      truststore:
        type: ${TRUSTSTORE_TYPE:JKS}
        path: ${TRUSTSTORE_PATH:${gravitee.home}/security/truststore.jks}
        password: ${TRUSTSTORE_PASSWORD}
    
    # Rate limiting - using YugabyteDB for distributed rate limiting
    ratelimit:
      type: jdbc
      jdbc:
        driver: org.postgresql.Driver
        host: ${YUGABYTE_HOST:yugabytedb-service.k8s-api-gateway.svc.cluster.local}
        port: ${YUGABYTE_PORT:5433}
        database: ${YUGABYTE_DATABASE:gravitee}
        username: ${YUGABYTE_USER:gravitee_app} 
        password: ${YUGABYTE_PASSWORD}
        schema: ${YUGABYTE_SCHEMA:gravitee}
    
    # Analytics configuration
    analytics:
      type: jdbc
      jdbc:
        driver: org.postgresql.Driver
        host: ${YUGABYTE_HOST:yugabytedb-service.k8s-api-gateway.svc.cluster.local}
        port: ${YUGABYTE_PORT:5433}
        database: ${YUGABYTE_DATABASE:gravitee}
        username: ${YUGABYTE_USER:gravitee_app}
        password: ${YUGABYTE_PASSWORD}
        schema: ${YUGABYTE_SCHEMA:gravitee}
    
    # Distributed cache for API keys and subscriptions (already configured above)
    
    # Health check configuration
    node:
      cache:
        enabled: false
      heartbeat:
        enabled: false
      alert:
        enabled: false
      services:
        cache:
          enabled: false
        heartbeat:
          enabled: false
        alert:
          enabled: false
      name: ${NODE_NAME:gravitee-gateway}
      metadata:
        node.id: ${NODE_ID:${random.uuid}}
    
    # Logging configuration
    logging:
      level:
        io.gravitee: ${GRAVITEE_LOG_LEVEL:INFO}
        org.springframework: ${SPRING_LOG_LEVEL:WARN}
        org.eclipse.jetty: ${JETTY_LOG_LEVEL:WARN}
    
    # Reporters - send metrics to multiple systems
    reporters:
      # File reporter for debugging
      file:
        enabled: true
        fileName: ${gravitee.home}/logs/gravitee_metrics_%s.json
    
    # API endpoints exposure  
    api:
      # Health check endpoint
      health:
        enabled: true
      # Node information endpoint  
      node:
        enabled: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-access-settings
  namespace: k8s-api-gateway
data:
  organization: dotcomrow
  allowedTeams: gravitee_admin_access,gravitee_user_access
  adminTeam: gravitee_admin_access
  userTeam: gravitee_user_access
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-access-reconciler-script
  namespace: k8s-api-gateway
data:
  reconcile.sh: |-
    #!/bin/sh
    set -eu

    REQUIRED_ENV="GITHUB_ORG GITHUB_ALLOWED_TEAMS GITHUB_ADMIN_TEAM GITHUB_USER_TEAM GITHUB_TOKEN YUGABYTE_HOST YUGABYTE_PORT YUGABYTE_DATABASE"
    for var in $REQUIRED_ENV; do
      value=$(env | awk -F= -v key="$var" '$1==key {print substr($0, index($0,"=")+1)}')
      if [ -z "$value" ]; then
        echo "❌ Missing required env var: $var" >&2
        exit 1
      fi
    done

    if [ -f /vault/secrets/db-creds ]; then
      . /vault/secrets/db-creds
    fi

    if [ -z "${YUGABYTE_USER-}" ] || [ -z "${YUGABYTE_PASSWORD-}" ]; then
      echo "❌ Database credentials missing; cannot reconcile access." >&2
      exit 1
    fi

    DEFAULT_ADMIN_TEAM="gravitee_admin_access"
    DEFAULT_USER_TEAM="gravitee_user_access"

    slugify_team() {
      value=$(printf '%s' "$1" | tr -d '\r')
      value=$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
      value=$(printf '%s' "$value" | tr '[:upper:]' '[:lower:]')
      if printf '%s' "$value" | grep -Eq '^[a-z0-9][a-z0-9_-]*$'; then
        printf '%s' "$value"
        return
      fi
      value=$(printf '%s' "$value" | tr ' ' '-')
      value=$(printf '%s' "$value" | sed -e 's/[^a-z0-9_-]/-/g' -e 's/-\{2,\}/-/g' -e 's/^-//' -e 's/-$//')
      printf '%s' "$value"
    }

    normalize_team_list() {
      printf '%s' "$1" | tr ',' '\n' | while IFS= read -r entry; do
        slug=$(slugify_team "$entry")
        [ -z "$slug" ] && continue
        printf '%s\n' "$slug"
      done
    }

    is_admin_team() {
      team_slug="$1"
      for admin in $ADMIN_TEAM_SLUGS; do
        if [ "$team_slug" = "$admin" ]; then
          return 0
        fi
      done
      return 1
    }

    build_team_condition() {
      slugs="$1"
      fallback="$2"
      targets="$slugs"
      if [ -z "$targets" ]; then
        targets="$fallback"
      fi

      expr=""
      for slug in $targets; do
        [ -z "$slug" ] && continue
        cond="#jsonPath(#profile, '$.teams[*].slug').contains('${slug}')"
        if [ -z "$expr" ]; then
          expr="$cond"
        else
          expr="$expr or $cond"
        fi
      done
      printf "{%s}" "$expr"
    }

    ALLOWED_TEAMS=$(normalize_team_list "$GITHUB_ALLOWED_TEAMS")
    ADMIN_TEAM_SLUGS=$(normalize_team_list "$GITHUB_ADMIN_TEAM")
    USER_TEAM_SLUGS=$(normalize_team_list "$GITHUB_USER_TEAM")

    if [ -z "$ALLOWED_TEAMS" ]; then
      echo "❌ No GitHub teams configured in GITHUB_ALLOWED_TEAMS." >&2
      exit 1
    fi

    if [ -z "$ADMIN_TEAM_SLUGS" ]; then
      ADMIN_TEAM_SLUGS="$DEFAULT_ADMIN_TEAM"
      echo "⚠️ GITHUB_ADMIN_TEAM produced no valid slugs; defaulting to ${DEFAULT_ADMIN_TEAM}." >&2
    fi

    if [ -z "$USER_TEAM_SLUGS" ]; then
      USER_TEAM_SLUGS="$DEFAULT_USER_TEAM"
      echo "⚠️ GITHUB_USER_TEAM produced no valid slugs; defaulting to ${DEFAULT_USER_TEAM}." >&2
    fi

    psql_cmd() {
      PGPASSWORD="$YUGABYTE_PASSWORD" \
        psql -h "$YUGABYTE_HOST" \
             -p "$YUGABYTE_PORT" \
             -U "$YUGABYTE_USER" \
             -d "$YUGABYTE_DATABASE" \
             -v ON_ERROR_STOP=1 "$@"
    }

    ensure_role_mappings() {
      admin_cond=$(build_team_condition "$ADMIN_TEAM_SLUGS" "$DEFAULT_ADMIN_TEAM")
      user_cond=$(build_team_condition "$USER_TEAM_SLUGS" "$DEFAULT_USER_TEAM")

      group_json=$(jq -n \
        --arg admin "$admin_cond" \
        --arg user "$user_cond" \
        '[{"condition":$admin,"groups":["gravitee_admin_access"]},{"condition":$user,"groups":["gravitee_user_access"]}]')

      role_json=$(jq -n \
        --arg admin "$admin_cond" \
        --arg user "$user_cond" \
        '[
          {
            "condition": $admin,
            "roles": [
              {"scope":"ORGANIZATION","name":"ADMIN"},
              {"scope":"ENVIRONMENT","name":"ADMIN"}
            ]
          },
          {
            "condition": $user,
            "roles": [
              {"scope":"ORGANIZATION","name":"USER"},
              {"scope":"ENVIRONMENT","name":"USER"}
            ]
          }
        ]')

      group_esc=$(printf "%s" "$group_json" | sed "s/'/''/g")
      role_esc=$(printf "%s" "$role_json" | sed "s/'/''/g")

      SQL_TMP=$(mktemp)
      {
        printf "UPDATE gravitee.identity_providers\n"
        printf "SET group_mappings = '%s', role_mappings = '%s'\n" "$group_esc" "$role_esc"
        printf "WHERE id = 'github';\n"
      } > "$SQL_TMP"

      psql_cmd -f "$SQL_TMP" >/dev/null
      rm -f "$SQL_TMP"
    }

    ensure_guard_table() {
      SQL_TMP=$(mktemp)
      {
        printf "CREATE TABLE IF NOT EXISTS gravitee.github_allowed_users (\n"
        printf "  github_id varchar(64) PRIMARY KEY,\n"
        printf "  login varchar(255) NOT NULL,\n"
        printf "  desired_role varchar(16) NOT NULL DEFAULT 'USER',\n"
        printf "  synced_at timestamp without time zone NOT NULL DEFAULT now()\n"
        printf ");\n\n"

        printf "ALTER TABLE gravitee.github_allowed_users\n"
        printf "  ADD COLUMN IF NOT EXISTS desired_role varchar(16) NOT NULL DEFAULT 'USER';\n\n"

        printf "ALTER TABLE gravitee.users\n"
        printf "  ADD COLUMN IF NOT EXISTS github_id varchar(64);\n\n"

        printf "UPDATE gravitee.users\n"
        printf "   SET github_id = source_id\n"
        printf " WHERE source = 'github'\n"
        printf "   AND (github_id IS NULL OR github_id <> source_id);\n\n"

        printf "CREATE OR REPLACE FUNCTION gravitee.set_github_id()\n"
        printf "RETURNS trigger\n"
        printf "LANGUAGE plpgsql\n"
        printf "AS \$\$\n"
        printf "BEGIN\n"
        printf "  IF NEW.source = 'github' THEN\n"
        printf "    NEW.github_id := NEW.source_id;\n"
        printf "  ELSE\n"
        printf "    NEW.github_id := NULL;\n"
        printf "  END IF;\n"
        printf "  RETURN NEW;\n"
        printf "END;\n"
        printf "\$\$;\n\n"

        printf "DROP TRIGGER IF EXISTS tr_set_github_id ON gravitee.users;\n"
        printf "CREATE TRIGGER tr_set_github_id\n"
        printf "BEFORE INSERT OR UPDATE ON gravitee.users\n"
        printf "FOR EACH ROW\n"
        printf "EXECUTE FUNCTION gravitee.set_github_id();\n"
      } > "$SQL_TMP"

      psql_cmd -f "$SQL_TMP" >/dev/null
      rm -f "$SQL_TMP"
    }

    ensure_guard_constraint() {
      SQL_TMP=$(mktemp)
      {
        printf "DO \$\$ BEGIN\n"
        printf "  BEGIN\n"
        printf "    ALTER TABLE gravitee.users\n"
        printf "      ADD CONSTRAINT fk_github_allowed\n"
        printf "      FOREIGN KEY (github_id)\n"
        printf "      REFERENCES gravitee.github_allowed_users (github_id)\n"
        printf "      DEFERRABLE INITIALLY IMMEDIATE;\n"
        printf "  EXCEPTION\n"
        printf "    WHEN duplicate_object THEN\n"
        printf "      NULL;\n"
        printf "  END;\n"
        printf "END; \$\$;\n"
      } > "$SQL_TMP"

      psql_cmd -f "$SQL_TMP" >/dev/null
      rm -f "$SQL_TMP"
    }

    sync_github_memberships() {
      ORG_ADMIN_ROLE=$(psql_cmd -At -c "SELECT id FROM gravitee.roles WHERE scope = 'ORGANIZATION' AND name = 'ADMIN' LIMIT 1;" | tr -d '[:space:]')
      ORG_USER_ROLE=$(psql_cmd -At -c "SELECT id FROM gravitee.roles WHERE scope = 'ORGANIZATION' AND name = 'USER' LIMIT 1;" | tr -d '[:space:]')
      ENV_ADMIN_ROLE=$(psql_cmd -At -c "SELECT id FROM gravitee.roles WHERE scope = 'ENVIRONMENT' AND name = 'ADMIN' LIMIT 1;" | tr -d '[:space:]')
      ENV_USER_ROLE=$(psql_cmd -At -c "SELECT id FROM gravitee.roles WHERE scope = 'ENVIRONMENT' AND name = 'USER' LIMIT 1;" | tr -d '[:space:]')

      if [ -z "$ORG_ADMIN_ROLE" ] || [ -z "$ORG_USER_ROLE" ] || [ -z "$ENV_ADMIN_ROLE" ] || [ -z "$ENV_USER_ROLE" ]; then
        echo "❌ Unable to resolve Gravitee role IDs; cannot synchronize memberships." >&2
        return 1
      fi

      SQL_TMP=$(mktemp)
      {
        printf "DELETE FROM gravitee.memberships m\n"
        printf "WHERE m.member_id IN (SELECT id FROM gravitee.users WHERE source='github')\n"
        printf "  AND NOT EXISTS (SELECT 1 FROM gravitee.roles r WHERE r.id = m.role_id);\n\n"

        printf "CREATE TEMP TABLE tmp_allowed AS\n"
        printf "SELECT u.id AS user_id, g.desired_role\n"
        printf "FROM gravitee.users u\n"
        printf "JOIN gravitee.github_allowed_users g ON g.github_id = u.source_id;\n\n"

        printf "DELETE FROM gravitee.memberships\n"
        printf "WHERE member_id IN (SELECT user_id FROM tmp_allowed);\n\n"

        printf "INSERT INTO gravitee.memberships (id, member_id, member_type, reference_type, reference_id, role_id)\n"
        printf "SELECT gen_random_uuid(), user_id, 'USER', 'ORGANIZATION', 'DEFAULT',\n"
        printf "  CASE WHEN upper(trim(desired_role)) = 'ADMIN' THEN '%s' ELSE '%s' END\n"
        printf "FROM tmp_allowed;\n\n" "$ORG_ADMIN_ROLE" "$ORG_USER_ROLE"

        printf "INSERT INTO gravitee.memberships (id, member_id, member_type, reference_type, reference_id, role_id)\n"
        printf "SELECT gen_random_uuid(), user_id, 'USER', 'ENVIRONMENT', 'DEFAULT',\n"
        printf "  CASE WHEN upper(trim(desired_role)) = 'ADMIN' THEN '%s' ELSE '%s' END\n"
        printf "FROM tmp_allowed;\n\n" "$ENV_ADMIN_ROLE" "$ENV_USER_ROLE"

        printf "DROP TABLE tmp_allowed;\n"
        printf "SELECT COUNT(*) AS synced_user_count FROM gravitee.users u\n"
        printf "WHERE u.id IN (SELECT id FROM gravitee.users WHERE source='github');\n"
      } > "$SQL_TMP"

      if ! psql_cmd -f "$SQL_TMP" >/dev/null; then
        rm -f "$SQL_TMP"
        return 1
      fi

      rm -f "$SQL_TMP"
      echo "✅ Membership synchronization completed for GitHub users."
      return 0
    }

    refresh_allowed_users_table() {
      allowed_tmp=$(mktemp)
      api_fail=0

      for team in $ALLOWED_TEAMS; do
        page=1
        while :; do
          api="https://api.github.com/orgs/${GITHUB_ORG}/teams/${team}/members?per_page=100&page=${page}"
          body=$(mktemp)
          status=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -w "%{http_code}" -o "$body" "$api" || echo "000")

          if [ "$status" != "200" ]; then
            echo "⚠️ Failed to list members for team ${team} (status ${status})." >&2
            cat "$body" >&2 || true
            rm -f "$body"
            api_fail=1
            break
          fi

          role_label="USER"
          if is_admin_team "$team"; then
            role_label="ADMIN"
          fi

          jq -r --arg role "$role_label" '.[] | "\(.id),\(.login),\($role)"' "$body" >> "$allowed_tmp"
          count=$(jq 'length' "$body" 2>/dev/null || echo 0)
          rm -f "$body"

          [ "$count" -lt 100 ] && break
          page=$((page + 1))
        done
      done

      if [ "$api_fail" -eq 1 ]; then
        echo "⚠️ Unable to retrieve allowed GitHub members; leaving guard table untouched." >&2
        rm -f "$allowed_tmp"
        return 1
      fi

      allowed_sorted=$(mktemp)
      if [ -s "$allowed_tmp" ]; then
        awk -F',' '{
          key=$1
          role=$3
          if (!(key in best) || role=="ADMIN") {
            best[key]=$0
          }
        } END { for (k in best) print best[k] }' "$allowed_tmp" > "$allowed_sorted"
      else
        : > "$allowed_sorted"
      fi
      rm -f "$allowed_tmp"

      merge_sql=$(mktemp)
      {
        printf "BEGIN;\n"
        printf "ALTER TABLE gravitee.users DROP CONSTRAINT IF EXISTS fk_github_allowed;\n"
        printf "CREATE TEMP TABLE tmp_guard_refresh (\n"
        printf "  github_id varchar(64) PRIMARY KEY,\n"
        printf "  login varchar(255) NOT NULL,\n"
        printf "  desired_role varchar(16) NOT NULL\n"
        printf ");\n"
        printf "\\copy tmp_guard_refresh (github_id, login, desired_role) FROM STDIN WITH (FORMAT csv);\n"
        printf "DELETE FROM gravitee.github_allowed_users ga\n"
        printf "WHERE NOT EXISTS (\n"
        printf "  SELECT 1 FROM tmp_guard_refresh tmp WHERE tmp.github_id = ga.github_id\n"
        printf ");\n"
        printf "INSERT INTO gravitee.github_allowed_users AS ga (github_id, login, desired_role)\n"
        printf "SELECT github_id, login, desired_role FROM tmp_guard_refresh\n"
        printf "ON CONFLICT (github_id) DO UPDATE SET\n"
        printf "  login = EXCLUDED.login,\n"
        printf "  desired_role = EXCLUDED.desired_role,\n"
        printf "  synced_at = now();\n"
        printf "ALTER TABLE gravitee.users\n"
        printf "  ADD CONSTRAINT fk_github_allowed\n"
        printf "  FOREIGN KEY (github_id)\n"
        printf "  REFERENCES gravitee.github_allowed_users (github_id)\n"
        printf "  DEFERRABLE INITIALLY IMMEDIATE;\n"
        printf "COMMIT;\n"
      } > "$merge_sql"

      if ! psql_cmd -f "$merge_sql" < "$allowed_sorted"; then
        echo "⚠️ Failed to merge guard table; aborting refresh." >&2
        rm -f "$allowed_sorted" "$merge_sql"
        return 1
      fi

      rm -f "$merge_sql"

      rm -f "$allowed_sorted"

      count=$(psql_cmd -At -c "SELECT COUNT(*) FROM gravitee.github_allowed_users;" 2>/dev/null || echo 0)
      echo "ℹ️ Guard table now tracks ${count} allowed GitHub accounts."
      return 0
    }

    reconcile_github_users() {
      SQL_TMP=$(mktemp)
      {
        printf "BEGIN;\n"
        printf "CREATE TEMP TABLE tmp_allowed_snapshot AS\n"
        printf "SELECT github_id, login FROM gravitee.github_allowed_users;\n\n"

        printf "UPDATE gravitee.users u\n"
        printf "SET github_id = snap.github_id,\n"
        printf "    updated_at = now()\n"
        printf "FROM tmp_allowed_snapshot snap\n"
        printf "WHERE u.source = 'github'\n"
        printf "  AND u.source_id = snap.github_id\n"
        printf "  AND (u.github_id IS DISTINCT FROM snap.github_id);\n\n"

        printf "INSERT INTO gravitee.users (\n"
        printf "  id, created_at, updated_at, firstname, lastname, organization_id,\n"
        printf "  source, source_id, github_id, status, login_count, newsletter_subscribed,\n"
        printf "  picture, password, email, first_connection_at, last_connection_at\n"
        printf ")\n"
        printf "SELECT gen_random_uuid(), now(), now(), snap.login, snap.login, 'DEFAULT',\n"
        printf "  'github', snap.github_id, snap.github_id, 'ACTIVE', 0, false,\n"
        printf "  'https://avatars.githubusercontent.com/u/' || snap.github_id || '?v=4',\n"
        printf "  NULL, NULL, NULL, NULL\n"
        printf "FROM tmp_allowed_snapshot snap\n"
        printf "WHERE NOT EXISTS (\n"
        printf "  SELECT 1 FROM gravitee.users u\n"
        printf "  WHERE u.source = 'github'\n"
        printf "    AND u.source_id = snap.github_id);\n\n"

        printf "WITH orphans AS (\n"
        printf "  SELECT id FROM gravitee.users u\n"
        printf "  WHERE u.source = 'github'\n"
        printf "    AND NOT EXISTS (\n"
        printf "      SELECT 1 FROM tmp_allowed_snapshot snap WHERE snap.github_id = u.source_id)\n"
        printf ")\n"
        printf "DELETE FROM gravitee.memberships WHERE member_id IN (SELECT id FROM orphans);\n"
        printf "WITH del AS (\n"
        printf "  SELECT id FROM gravitee.users u\n"
        printf "  WHERE u.source = 'github'\n"
        printf "    AND NOT EXISTS (\n"
        printf "      SELECT 1 FROM tmp_allowed_snapshot snap WHERE snap.github_id = u.source_id)\n"
        printf ")\n"
        printf "DELETE FROM gravitee.users WHERE id IN (SELECT id FROM del);\n\n"

        printf "DROP TABLE IF EXISTS tmp_allowed_snapshot;\n"
        printf "COMMIT;\n"
      } > "$SQL_TMP"

      if ! psql_cmd -f "$SQL_TMP" >/dev/null; then
        echo "⚠️ Failed to reconcile GitHub user records." >&2
        rm -f "$SQL_TMP"
        return 1
      fi

      rm -f "$SQL_TMP"
      return 0
    }

    ensure_guard_table
    ensure_role_mappings
    if refresh_allowed_users_table; then
      if reconcile_github_users; then
        managed_users=$(psql_cmd -At -c "SELECT COUNT(*) FROM gravitee.users WHERE source = 'github';" 2>/dev/null || echo 0)
        echo "👥 Managed ${managed_users} GitHub user accounts in Gravitee."
      else
        echo "⚠️ GitHub user reconciliation failed; accounts may be inconsistent." >&2
      fi

      echo "🔄 Synchronizing Gravitee memberships based on GitHub teams..."
      if ! sync_github_memberships; then
        echo "⚠️ Membership synchronization failed; roles may be outdated." >&2
      fi
    else
      echo "⚠️ Continuing reconciliation using the previous guard snapshot."
    fi

    ensure_guard_constraint

    final_allowed=$(psql_cmd -At -c "SELECT COUNT(*) FROM gravitee.github_allowed_users;" 2>/dev/null || echo 0)
    final_users=$(psql_cmd -At -c "SELECT COUNT(*) FROM gravitee.users WHERE source = 'github';" 2>/dev/null || echo 0)
    echo "✅ Reconciliation complete. Guarding ${final_allowed} GitHub accounts with ${final_users} Gravitee user records."

---
# Configure GitHub identity provider and portal settings
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: github-access-reconciler
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    linkerd.io/inject: "disabled"
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          annotations:
            linkerd.io/inject: "disabled"
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/agent-pre-populate-only: "true"
            vault.hashicorp.com/role: "gravitee"
            vault.hashicorp.com/agent-inject-secret-db-creds: "yugabyte-db/static-creds/gravitee-app"
            vault.hashicorp.com/agent-inject-template-db-creds: |
              {{- with secret "yugabyte-db/static-creds/gravitee-app" -}}
              export YUGABYTE_USER="gravitee_app"
              export YUGABYTE_PASSWORD="{{ .Data.password }}"
              {{- end }}
        spec:
          serviceAccountName: gravitee
          restartPolicy: Never
          containers:
          - name: reconcile
            image: alpine/k8s:1.31.4
            command: ["/bin/sh","-c"]
            args:
            - |
              set -e
              apk add --no-cache jq postgresql15-client >/dev/null
              /opt/scripts/reconcile.sh
            env:
            - name: MGMT_API_URL
              value: "http://gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083"
            - name: YUGABYTE_HOST
              value: "yb-tserver-service.yugabyte.svc.cluster.local"
            - name: YUGABYTE_PORT
              value: "5433"
            - name: YUGABYTE_DATABASE
              value: "gravitee"
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gravitee-admin-credentials
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gravitee-admin-credentials
                  key: password
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-gateway-github-team-token
                  key: token
            - name: GITHUB_ORG
              valueFrom:
                configMapKeyRef:
                  name: github-access-settings
                  key: organization
            - name: GITHUB_ALLOWED_TEAMS
              valueFrom:
                configMapKeyRef:
                  name: github-access-settings
                  key: allowedTeams
            - name: GITHUB_ADMIN_TEAM
              valueFrom:
                configMapKeyRef:
                  name: github-access-settings
                  key: adminTeam
            - name: GITHUB_USER_TEAM
              valueFrom:
                configMapKeyRef:
                  name: github-access-settings
                  key: userTeam
            volumeMounts:
            - name: reconcile-script
              mountPath: /opt/scripts/reconcile.sh
              subPath: reconcile.sh
              readOnly: true
          volumes:
          - name: reconcile-script
            configMap:
              name: github-access-reconciler-script
              defaultMode: 0755
---
