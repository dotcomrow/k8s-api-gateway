metadata:
  name: api-gateway-github-oauth
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-store              # or SecretStore if namespaced
    kind: ClusterSecretStore
  target:
    name: api-gateway-github-oauth # k8s Secret to create
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: api-gateway-github-client-id
        property: value
    - secretKey: client-secret
      remoteRef:
        key: api-gateway-github-client-secret
        property: value
---
