          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "🔧 Loading secrets from Vault..."
          if [ -f /vault/secrets/db-creds ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/db-creds
            echo "✅ Database credentials loaded"
          fi
          if [ -f /vault/secrets/apisix ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/apisix
            echo "✅ APISIX admin key loaded"
          fi

          # Wire JDBC creds for Gravitee from Vault-provided env
          export MANAGEMENT_JDBC_PASSWORD="$YUGABYTE_PASSWORD"
          export MANAGEMENT_JDBC_USERNAME="${MANAGEMENT_JDBC_USERNAME:-gravitee_app}"

          echo "🚀 Starting Gravitee Gateway..."
          exec ./bin/gravitee
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
