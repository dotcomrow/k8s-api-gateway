# Gravitee Management API configuration (mounted into the management pod)
apiVersion: v1
kind: ConfigMap
metadata:
  name: gravitee-management-config
  namespace: k8s-api-gateway
data:
  gravitee.yml: |-
    ############################################################################################################
    # Gravitee.io Management API Configuration for YugabyteDB and Vault Integration
    ############################################################################################################
    gravitee:

      installation:
        standalone:
          api:
            # Global public base URL for the Management + Portal APIs
            url: https://gravitee.teleport.app.suncoast.systems

          console:
            # Public URL for the console
            url: https://gravitee-management.teleport.app.suncoast.systems

          portal:
            # Public URL for the developer portal
            url: https://gravitee.teleport.app.suncoast.systems

        # (optional but harmless) keep the older structure too, in case your version still reads it
        api:
          url: https://gravitee.teleport.app.suncoast.systems
          console:
            url: https://gravitee-management.teleport.app.suncoast.systems
          portal:
            url: https://gravitee.teleport.app.suncoast.systems

      # Management configuration
      management:
        type: jdbc
        jdbc:
          driver: org.postgresql.Driver
          url: ${MANAGEMENT_JDBC_URL:jdbc:postgresql://${YUGABYTE_HOST:yugabytedb-service.k8s-api-gateway.svc.cluster.local}:${YUGABYTE_PORT:5433}/${YUGABYTE_DATABASE:gravitee}?currentSchema=${YUGABYTE_SCHEMA:gravitee}}
          username: ${YUGABYTE_USER:gravitee_app}
          password: ${YUGABYTE_PASSWORD}
          schema: ${YUGABYTE_SCHEMA:gravitee}
          # Connection pool settings (Hikari)
          pool:
            maxPoolSize: ${MANAGEMENT_JDBC_POOL_MAX_POOL_SIZE:6}
            minIdle: ${MANAGEMENT_JDBC_POOL_MIN_IDLE:0}
            connectionTimeout: ${MANAGEMENT_JDBC_POOL_CONNECTION_TIMEOUT:10000}
            idleTimeout: ${MANAGEMENT_JDBC_POOL_IDLE_TIMEOUT:30000}
            maxLifetime: ${MANAGEMENT_JDBC_POOL_MAX_LIFETIME:600000}
            autoCommit: true
            registerMbeans: false

      # Analytics repository configuration  
      analytics:
        type: jdbc
        jdbc:
          url: ${ANALYTICS_JDBC_URL:jdbc:postgresql://${YUGABYTE_HOST:yugabytedb-service.k8s-api-gateway.svc.cluster.local}:${YUGABYTE_PORT:5433}/${YUGABYTE_DATABASE:gravitee}?currentSchema=${YUGABYTE_SCHEMA:gravitee}}
          username: ${YUGABYTE_USER:gravitee_app}
          password: ${YUGABYTE_PASSWORD}
          schema: ${YUGABYTE_SCHEMA:gravitee}
          pool:
            maxPoolSize: ${ANALYTICS_JDBC_POOL_MAX_POOL_SIZE:2}
            minIdle: ${ANALYTICS_JDBC_POOL_MIN_IDLE:0}
            connectionTimeout: ${ANALYTICS_JDBC_POOL_CONNECTION_TIMEOUT:10000}
            idleTimeout: ${ANALYTICS_JDBC_POOL_IDLE_TIMEOUT:30000}
            maxLifetime: ${ANALYTICS_JDBC_POOL_MAX_LIFETIME:600000}
            autoCommit: true
            registerMbeans: false

      # Rate limiting repository
      ratelimit:
        type: jdbc
        jdbc:
          url: ${RATELIMIT_JDBC_URL:jdbc:postgresql://${YUGABYTE_HOST:yugabytedb-service.k8s-api-gateway.svc.cluster.local}:${YUGABYTE_PORT:5433}/${YUGABYTE_DATABASE:gravitee}?currentSchema=${YUGABYTE_SCHEMA:gravitee}}
          username: ${YUGABYTE_USER:gravitee_app}
          password: ${YUGABYTE_PASSWORD}
          schema: ${YUGABYTE_SCHEMA:gravitee}
          pool:
            maxPoolSize: ${RATELIMIT_JDBC_POOL_MAX_POOL_SIZE:2}
            minIdle: ${RATELIMIT_JDBC_POOL_MIN_IDLE:0}
            connectionTimeout: ${RATELIMIT_JDBC_POOL_CONNECTION_TIMEOUT:10000}
            idleTimeout: ${RATELIMIT_JDBC_POOL_IDLE_TIMEOUT:30000}
            maxLifetime: ${RATELIMIT_JDBC_POOL_MAX_LIFETIME:600000}
            autoCommit: true
            registerMbeans: false

    # HTTP server configuration
    jetty:
      port: 8083
      host: 0.0.0.0
      
    # JWT configuration for API security
    jwt:
      secret: ${JWT_SECRET}
      expire-after: ${JWT_EXPIRE_AFTER:604800}
      issuer: ${JWT_ISSUER:k8s-api-gateway}

    # CORS configuration
    http:
      cors:
        enabled: true
        allow-origin: 'https://gravitee.teleport.app.suncoast.systems,https://gravitee-management.teleport.app.suncoast.systems'
        allow-headers: 'Cache-Control, Pragma, Origin, Authorization, Content-Type, X-Requested-With, If-Match, If-None-Match, X-Gravitee-*'
        allow-methods: 'OPTIONS, GET, POST, PUT, DELETE, PATCH'
        exposed-headers: 'ETag, X-Gravitee-*'
        max-age: 1728000
        allow-credentials: true

    # Kubernetes service discovery integration
    services:
      discovery:
        kubernetes:
          enabled: true
          service:
            # Empty means watch all namespaces.
            namespace: ${K8S_NAMESPACE:}
          # Auto-discovery via annotations
          annotations:
            gravitee.io/expose: "true"
            gravitee.io/context-path: ""
            gravitee.io/auth-required: ""
            gravitee.io/approval-required: ""
            gravitee.io/description: ""
            gravitee.io/version: ""
            gravitee.io/tags: ""
            gravitee.io/definition-name: ""
            gravitee.io/definition-summary: ""
            gravitee.io/definition-description: ""
            gravitee.io/definition-version: ""
            gravitee.io/definition-context-path: ""
            gravitee.io/definition-groups: ""
            gravitee.io/definition-tags: ""
            gravitee.io/definition-labels: ""
            gravitee.io/definition-categories: ""
            gravitee.io/definition-visibility: ""
            gravitee.io/definition-state: ""
            gravitee.io/definition-lifecycle-state: ""
            gravitee.io/definition-path-mappings: ""
            gravitee.io/definition-picture-url: ""
            gravitee.io/definition-background-url: ""
            gravitee.io/definition-metadata: ""
            gravitee.io/definition-properties: ""
            gravitee.io/definition-services: ""
            gravitee.io/definition-resources: ""
            gravitee.io/definition-plans: ""
            gravitee.io/definition-flows: ""
            gravitee.io/definition-response-templates: ""
            gravitee.io/definition-execution-mode: ""
            gravitee.io/definition-flow-mode: ""
            gravitee.io/definition-entrypoints: ""
            gravitee.io/definition-endpoints: ""
            gravitee.io/definition-openapi-url: ""
            gravitee.io/definition-openapi: ""

    # APISIX integration for route synchronization  
    plugins:
      path: ${gravitee.home}/plugins
      
    # External services integration
    external:
      apisix:
        enabled: ${APISIX_SYNC_ENABLED:true}
        admin-url: ${APISIX_ADMIN_URL:http://apisix-admin.k8s-api-gateway.svc.cluster.local:9180}
        admin-key: ${APISIX_ADMIN_KEY}
        sync-interval: ${APISIX_SYNC_INTERVAL:30000}

    # Security configuration
    security:
      keystore:
        type: ${KEYSTORE_TYPE:JKS}
        path: ${KEYSTORE_PATH:${gravitee.home}/security/keystore.jks}
        password: ${KEYSTORE_PASSWORD}
      truststore:
        type: ${TRUSTSTORE_TYPE:JKS}
        path: ${TRUSTSTORE_PATH:${gravitee.home}/security/truststore.jks}
        password: ${TRUSTSTORE_PASSWORD}
      providers:
        # Keep local Gravitee (JDBC-backed) auth enabled for console/API basic auth
        - type: gravitee
          password-encoding: bcrypt
        - type: oauth2
          id: github
          name: GitHub
          clientId: ${PORTAL_OAUTH_CLIENT_ID}
          clientSecret: ${PORTAL_OAUTH_CLIENT_SECRET}
          color: "#24292F"
          syncMappings: true
          scopes:
            - read:user
            - read:org
            - user:email
          userMapping:
            condition: "{#jsonPath(#profile, '$.teams[*].slug').contains('gravitee_admin_access') or #jsonPath(#profile, '$.teams[*].slug').contains('gravitee_user_access')}"
            id: id
            lastname: name
            firstname: name
            email: email
            picture: avatar_url
          groupMapping:
            - condition: "{#jsonPath(#profile, '$.teams[*].slug').contains('gravitee_admin_access')}"
              groups:
                - gravitee_admin_access
            - condition: "{#jsonPath(#profile, '$.teams[*].slug').contains('gravitee_user_access')}"
              groups:
                - gravitee_user_access

    # Email configuration (for notifications)
    email:
      enabled: ${EMAIL_ENABLED:true}
      host: ${EMAIL_HOST}
      port: ${EMAIL_PORT:587}
      username: ${EMAIL_USERNAME}
      password: ${EMAIL_PASSWORD}
      protocol: smtp
      subject: ${EMAIL_SUBJECT:[Gravitee.io] %s}
      from: ${EMAIL_FROM:noreply@k8s-api-gateway.local}

    # Portal configuration
    portal:
      url: ${PORTAL_URL:http://gravitee-portal.k8s-api-gateway.svc.cluster.local:8080}

    # API Gateway configuration
    gateway:
      url: ${GATEWAY_URL:http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082}

    # Logging
    logging:
      level:
        io.gravitee: ${GRAVITEE_LOG_LEVEL:INFO}
        org.springframework: ${SPRING_LOG_LEVEL:WARN}
        org.eclipse.jetty: ${JETTY_LOG_LEVEL:WARN}
---
# Gravitee Management API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitee-management-api
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gravitee-management-api
  template:
    metadata:
      labels:
        app: gravitee-management-api
      annotations:
        linkerd.io/inject: "disabled"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "gravitee"
        vault.hashicorp.com/agent-inject-secret-db-creds: "yugabyte-db/static-creds/gravitee-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "yugabyte-db/static-creds/gravitee-app" -}}
          export YUGABYTE_USER="gravitee_app"
          export YUGABYTE_PASSWORD="{{ .Data.password }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-jwt: "secret/gravitee/jwt"
        vault.hashicorp.com/agent-inject-template-jwt: |
          {{- with secret "secret/gravitee/jwt" -}}
          export JWT_SECRET="{{ .Data.secret }}"
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-apisix: "secret/apisix/admin"
        vault.hashicorp.com/agent-inject-template-apisix: |
          {{- with secret "secret/apisix/admin" -}}
          export APISIX_ADMIN_KEY="{{ .Data.data.key }}"
          {{- end }}
    spec:
      serviceAccountName: gravitee
      initContainers:
      - name: wait-database-setup
        image: alpine/k8s:1.31.4
        env:
        - name: YUGABYTE_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: YUGABYTE_PORT
          value: "5433"
        - name: YUGABYTE_DATABASE
          value: "gravitee"
        command:
        - sh
        - -c
        - |
          echo "🔧 Waiting for Gravitee database to be ready..."

          # Install required packages
          apk add --no-cache netcat-openbsd postgresql15-client

          # Wait for YugabyteDB to be reachable
          echo "🔍 Waiting for YugabyteDB to be reachable..."
          until nc -z "$YUGABYTE_HOST" "$YUGABYTE_PORT"; do
            echo "⏳ Waiting for YugabyteDB at $YUGABYTE_HOST:$YUGABYTE_PORT..."
            sleep 5
          done
          echo "✅ YugabyteDB is reachable"

          # Wait for gravitee database to exist
          echo "🔍 Waiting for gravitee database to be created..."
          RETRY_COUNT=0
          MAX_RETRIES=120
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d yugabyte -tAc \
              "SELECT 1 FROM pg_database WHERE datname='$YUGABYTE_DATABASE'" 2>/dev/null | grep -q "1"; then
              echo "✅ Gravitee database exists"

              # Ensure gravitee schema exists and set role search_path
              echo "🔧 Ensuring 'gravitee' schema and search_path..."
              PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 \
                -c "CREATE SCHEMA IF NOT EXISTS gravitee AUTHORIZATION gravitee_app;"
              PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 \
                -c "ALTER ROLE gravitee_app IN DATABASE gravitee SET search_path = gravitee, public;"

              # Re-check the schema exists
              if PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                "SELECT 1 FROM information_schema.schemata WHERE schema_name='gravitee'" 2>/dev/null | grep -q "1"; then
                echo "✅ Gravitee schema exists and role search_path is set"

                echo "🔍 Checking Liquibase changelog and ratelimit schema consistency..."
                SUB_COLUMN_EXISTS=$(PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                  "SELECT 1 FROM information_schema.columns WHERE table_schema='gravitee' AND table_name='ratelimit' AND column_name='subscription'" 2>/dev/null | tr -d '[:space:]')
                CHANGESET_LOGGED=$(PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                  "SELECT 1 FROM gravitee.databasechangelog WHERE id='1.25.2' AND author='GraviteeSource Team' AND filename='liquibase/changelogs/v1_25_2/schema.yml'" 2>/dev/null | tr -d '[:space:]')
                if [ "$SUB_COLUMN_EXISTS" = "1" ] && [ "$CHANGESET_LOGGED" != "1" ]; then
                  echo "⚠️  Detected legacy ratelimit.subscription column without matching Liquibase changelog entry."
                  echo "    Dropping column so Gravitee can re-run the official migration..."
                  PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 \
                    -c "ALTER TABLE gravitee.ratelimit DROP COLUMN IF EXISTS subscription;"
                else
                  echo "✅ Liquibase changelog and ratelimit schema look consistent"
                fi

                USERS_TABLE_EXISTS=$(PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                  "SELECT 1 FROM information_schema.tables WHERE table_schema='gravitee' AND table_name='users'" 2>/dev/null | tr -d '[:space:]')
                USERS_CHANGESET_LOGGED=$(PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -tAc \
                  "SELECT 1 FROM gravitee.databasechangelog WHERE id='1.14.0' AND author='GraviteeSource Team' AND filename='liquibase/changelogs/v1_14_0/schema.yml'" 2>/dev/null | tr -d '[:space:]')
                if [ "$USERS_TABLE_EXISTS" = "1" ] && [ "$USERS_CHANGESET_LOGGED" != "1" ]; then
                  echo "⚠️  Found gravitee.users table without matching Liquibase changeSet marker."
                  echo "    Dropping table to allow Liquibase to recreate it cleanly..."
                  PGPASSWORD="$YUGABYTE_PASSWORD" psql -h "$YUGABYTE_HOST" -p "$YUGABYTE_PORT" -U gravitee_app -d "$YUGABYTE_DATABASE" -v ON_ERROR_STOP=1 \
                    -c "DROP TABLE IF EXISTS gravitee.users CASCADE;"
                else
                  echo "✅ Liquibase changelog and users table look consistent"
                fi

                echo "✅ Database setup complete, Gravitee can start"
                exit 0
              else
                echo "❌ Gravitee schema verification failed after creation attempt"
                exit 1
              fi
            else
              echo "📄 Gravitee database not found yet"
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Waiting for database setup... (attempt $RETRY_COUNT/$MAX_RETRIES)"

            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Database setup not complete after $MAX_RETRIES attempts"
              exit 1
            fi
            sleep 5
          done
      containers:
      - name: gravitee-management-api
        image: ghcr.io/dotcomrow/gravitee-management-api:ts-20251130-012332
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: PORTAL_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-oauth
              key: client-id
        - name: PORTAL_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-gateway-github-oauth
              key: client-secret
        - name: PORTAL_OAUTH_SERVER_URL
          value: "https://github.com/login/oauth"
        - name: PORTAL_SSO_PROVIDER_NAME
          value: "GitHub"
        - name: PORTAL_SSO_PROVIDER_DESCRIPTION
          value: "Sign in with GitHub"
        - name: PORTAL_SSO_BUTTON_TEXT
          value: "Continue with GitHub"
        - name: PORTAL_SSO_AUTHORIZE_URL
          value: "https://gravitee.teleport.app.suncoast.systems/management/auth/oauth2/github/authorize"
        - name: PORTAL_SSO_TOKEN_URL
          value: "https://gravitee.teleport.app.suncoast.systems/management/auth/oauth2/github/access_token"
        - name: PORTAL_SSO_USERINFO_URL
          value: "https://gravitee.teleport.app.suncoast.systems/management/auth/oauth2/github/userinfo"
        - name: YUGABYTE_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: YUGABYTE_PORT
          value: "5433"
        - name: YUGABYTE_DATABASE
          value: "gravitee"
        - name: YUGABYTE_SCHEMA
          value: "gravitee"

        # Gravitee repository config for Yugabyte/PostgreSQL
        - name: MANAGEMENT_TYPE
          value: "jdbc"
        - name: MANAGEMENT_JDBC_DRIVER
          value: "org.postgresql.Driver"
        - name: MANAGEMENT_JDBC_URL
          value: "jdbc:postgresql://yb-tserver-service.yugabyte.svc.cluster.local:5433/gravitee?currentSchema=gravitee"
        - name: MANAGEMENT_JDBC_POOL_MAX_POOL_SIZE
          value: "6"
        - name: MANAGEMENT_JDBC_POOL_MIN_IDLE
          value: "0"
        - name: MANAGEMENT_JDBC_POOL_CONNECTION_TIMEOUT
          value: "10000"
        - name: MANAGEMENT_JDBC_POOL_IDLE_TIMEOUT
          value: "30000"
        - name: MANAGEMENT_JDBC_POOL_MAX_LIFETIME
          value: "600000"
        - name: MANAGEMENT_JDBC_POOL_REGISTER_MBEANS
          value: "false"
        # NOTE: Password comes from Vault and is exported in the wrapper script
        # - name: MANAGEMENT_JDBC_PASSWORD  <-- intentionally not set here

        - name: ANALYTICS_TYPE
          value: "none"
        - name: ANALYTICS_JDBC_LIQUIBASE_ENABLED
          value: "false"
        - name: REPORTERS_ELASTIC_ENABLED
          value: "false"
        - name: SERVICES_CACHE_ENABLED
          value: "false"

        # Empty means watch all namespaces.
        - name: K8S_NAMESPACE
          value: ""
        - name: APISIX_SYNC_ENABLED
          value: "true"
        - name: APISIX_ADMIN_URL
          value: "http://apisix-admin.k8s-api-gateway.svc.cluster.local:9180"
        - name: JWT_ISSUER
          value: "k8s-api-gateway"
        - name: JWT_EXPIRE_AFTER
          value: "604800"
        - name: PORTAL_URL
          value: "https://gravitee.teleport.app.suncoast.systems/portal"
        - name: GATEWAY_URL
          value: "http://gravitee-gateway.k8s-api-gateway.svc.cluster.local:8082"
        - name: EMAIL_HOST
          value: ""
        - name: EMAIL_PORT
          value: "587"
        - name: EMAIL_USERNAME
          value: ""
        - name: EMAIL_PASSWORD
          value: ""
        - name: EMAIL_FROM
          value: "noreply@k8s-api-gateway.local"
        - name: EMAIL_SUBJECT
          value: "[Gravitee.io] %s"
        - name: GRAVITEE_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: gravitee-license
              key: license.key
              optional: true
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "🔧 Loading secrets from Vault..."
          if [ -f /vault/secrets/db-creds ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/db-creds
            echo "✅ Database credentials loaded"
          fi
          if [ -f /vault/secrets/jwt ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/jwt
            echo "✅ JWT secret loaded"
          fi
          if [ -f /vault/secrets/apisix ]; then
            # shellcheck disable=SC1091
            . /vault/secrets/apisix
            echo "✅ APISIX admin key loaded"
          fi

          # Wire JDBC creds for Gravitee from Vault-provided env
          export MANAGEMENT_JDBC_PASSWORD="$YUGABYTE_PASSWORD"
          export MANAGEMENT_JDBC_USERNAME="${YUGABYTE_USER:-gravitee_app}"

          echo "🚀 Starting Gravitee Management API..."
          set +e
          ./bin/gravitee
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ Gravitee Management API exited with code $EXIT_CODE. Holding pod for investigation (not restarting)..."
            while true; do sleep 3600; done
          fi
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 480
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          tcpSocket:
            port: 8083
          initialDelaySeconds: 240
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: gravitee-management-config
          mountPath: /opt/graviteeio-management-api/config/gravitee.yml
          subPath: gravitee.yml
      volumes:
      - name: gravitee-management-config
        configMap:
          name: gravitee-management-config
