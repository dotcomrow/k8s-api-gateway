            - |
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18082/health || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
                exit 0
              fi
              echo "Readiness probe failed, management health returned $STATUS" >&2
              exit 1
          initialDelaySeconds: 90
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: gateway-config
          mountPath: /opt/graviteeio-gateway/config/gravitee.yml
          subPath: gravitee.yml
      volumes:
      - name: gateway-config
