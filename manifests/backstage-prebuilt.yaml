---
# Backstage Deployment using pre-built Docker image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-prebuilt
  namespace: backstage
  labels:
    app: backstage-prebuilt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage-prebuilt
  template:
    metadata:
      labels:
        app: backstage-prebuilt
    spec:
      serviceAccountName: backstage
      containers:
      - name: backstage
        image: your-registry/backstage:latest  # Replace with your built image
        ports:
        - containerPort: 7007
        env:
        - name: POSTGRES_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5433"
        - name: POSTGRES_DB
          value: "backstage"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        - name: BACKEND_SECRET
          value: "your-backend-secret-here-change-this"
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-credentials
              key: token
        - name: GITHUB_TEAM
          value: "backstage_admin_access"
        volumeMounts:
        - name: app-config
          mountPath: /app/app-config.yaml
          subPath: app-config.yaml
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "4Gi"  # Much less memory needed for pre-built image
        livenessProbe:
          httpGet:
            path: /api/catalog/health
            port: 7007
          initialDelaySeconds: 30  # Faster startup since pre-built
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/catalog/health
            port: 7007
          initialDelaySeconds: 15  # Faster startup since pre-built
          periodSeconds: 10
      volumes:
      - name: app-config
        configMap:
          name: backstage-app-config
      # Remove the initContainer - not needed with pre-built image!
      # Remove the backstage-data volume - not needed with pre-built image!

---
# Service remains the same
apiVersion: v1
kind: Service
metadata:
  name: backstage-prebuilt-service
  namespace: backstage
spec:
  selector:
    app: backstage-prebuilt
  ports:
  - port: 7007
    targetPort: 7007
    protocol: TCP
  type: ClusterIP