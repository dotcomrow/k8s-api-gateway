    apisix:
      default_cluster_base_url: "http://apisix.k8s-api-gateway.svc.cluster.local:9180/apisix/admin"
      default_cluster_admin_key: "edd1c9f034335f136f87ad84b625c8f1"
      default_cluster_name: "internal"
    
    kubernetes:
      namespace_selector: ["name=k8s-api-gateway"]
      
    apisix_resource_sync_interval: "200ms"
