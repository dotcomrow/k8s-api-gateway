# Backstage ConfigMap with Enhanced GitHub Team Authentication
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: k8s-api-gateway
data:
  app-config.yaml: |
    app:
      title: Platform Portal
      baseUrl: http://backstage.k8s-api-gateway.svc.cluster.local:7007

    organization:
      name: Platform Team

    backend:
      auth:
        keys:
          - secret: $BACKEND_SECRET
      baseUrl: http://backstage.k8s-api-gateway.svc.cluster.local:7007
      listen:
        port: 7007
      csp:
        connect-src: ["'self'", 'http:', 'https:']
      cors:
        origin: http://localhost:3000
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: pg
        connection:
          host: localhost
          port: 6432
          user: $POSTGRES_USER
          password: $POSTGRES_PASSWORD
          database: backstage
          ssl: false
        pool:
          min: 2
          max: 10
          acquireTimeoutMillis: 60000
        useNullAsDefault: false
        # Connect through PGBouncer sidecar for YugabyteDB compatibility
        pluginDivisionMode: 'schema'
        ensureExists: false
        # Include all plugin schemas for schema-based isolation
        searchPath: ['backstage', 'backstage_plugin_app', 'backstage_plugin_proxy', 'backstage_plugin_scaffolder', 'backstage_plugin_techdocs', 'backstage_plugin_auth', 'backstage_plugin_catalog', 'backstage_plugin_permission', 'backstage_plugin_search', 'backstage_plugin_kubernetes', 'backstage_plugin_notifications', 'backstage_plugin_signals']
        knexConfig:
          pool:
            min: 1
            max: 3
            acquireTimeoutMillis: 120000
            createTimeoutMillis: 60000
            destroyTimeoutMillis: 10000
            idleTimeoutMillis: 60000
          # YugabyteDB-specific settings - completely disable ALL migrations
          migrations: false
          disableTransactions: true
          # Force all knex operations to use backstage schema by default
          schemaName: 'backstage'
          # Force use of pure JavaScript pg driver instead of pg-native
          useNullAsDefault: false
          # Prevent concurrent migrations by serializing database operations
          acquireConnectionTimeout: 120000
          # YugabyteDB compatibility settings
          postProcessResponse: null
          wrapIdentifier: null
          # Additional migration disabling
          migrationsTableName: false

    # TechDocs configuration to fix missing config error
    techdocs:
      builder: 'local'
      generator:
        runIn: 'local'
      publisher:
        type: 'local'

    integrations:
      github:
        - host: github.com
          token: <path:secret/data/BACKSTAGE_GITHUB_PAT#value>

    # Auth configuration - rely on main database config with environment overrides
    auth:
      environment: development
      providers:
        github:
          development:
            clientId: <path:secret/data/BACKSTAGE_GITHUB_CLIENT_ID#value>
            clientSecret: <path:secret/data/BACKSTAGE_GITHUB_CLIENT_SECRET#value>
            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityName
                - resolver: emailLocalPartMatchingUserEntityName

    # Permission framework configuration for team-based access
    permission:
      enabled: true
      rules:
        - allow: [catalog.entity.read]
          resourceType: catalog-entity
        - allow: [catalog.entity.create, catalog.entity.update, catalog.entity.delete]
          resourceType: catalog-entity
          conditions:
            rule: IS_ENTITY_OWNER
            resourceType: catalog-entity
            params:
              claims: ['group:default/$GITHUB_TEAM']

    scaffolder:
      defaultAuthor:
        name: Platform Team
        email: platform-team@company.com
      defaultCommitMessage: 'Initial commit from Backstage'

    catalog:
      import:
        entityFilename: catalog-info.yaml
        pullRequestBranchName: backstage-integration
      rules:
        - allow: [Component, System, API, Resource, Location, User, Group]
      locations:
        # GitHub organization discovery (update with your org)
        # - type: github-discovery
        #   target: https://github.com/your-org-here/*/blob/-/catalog-info.yaml
        
        # GitHub user/team discovery (update with your org)
        # - type: github-org
        #   target: https://github.com/your-org-here
        #   rules:
        #     - allow: [User, Group]

        # Local example data for development
        - type: file
          target: ../../examples/entities.yaml
        - type: file
          target: ../../examples/template/template.yaml
          rules:
            - allow: [Template]
        - type: file
          target: ../../examples/org.yaml
          rules:
            - allow: [User, Group]
---
# Backstage Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: k8s-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "backstage"
        vault.hashicorp.com/agent-inject-secret-db-creds: "yugabyte-db/static-creds/backstage-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "yugabyte-db/static-creds/backstage-app" -}}
          export POSTGRES_USER="{{ .Data.username }}"
          export POSTGRES_PASSWORD="{{ .Data.password }}"
          {{- end }}
    spec:
      serviceAccountName: backstage
      initContainers:
      - name: wait-database-setup
        image: alpine/k8s:1.31.4
        env:
        - name: POSTGRES_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5433"
        - name: POSTGRES_DB
          value: "backstage"
        command:
        - sh
        - -c
        - |
          echo "🔧 Waiting for Backstage database to be ready..."
          
          # First, wait for Vault token secret (same as the database job needs)
          SECRET_NAME="vault-root-token"
          SECRET_NAMESPACE="k8s-api-gateway"
          
          echo "🔍 Step 1: Waiting for Vault token secret..."
          
          # Debug: Show current permissions and available secrets
          echo "🔍 Debug: Current service account and permissions:"
          whoami 2>/dev/null || echo "Cannot determine user"
          echo "🔍 Available secrets in namespace:"
          kubectl get secrets -n "$SECRET_NAMESPACE" 2>&1 || echo "Cannot list secrets - permission denied"
          
          RETRY_COUNT=0
          MAX_RETRIES=60
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Check if secret exists
            SECRET_EXISTS=$(kubectl get secret "$SECRET_NAME" -n "$SECRET_NAMESPACE" >/dev/null 2>&1 && echo "true" || echo "false")
            echo "🔍 Secret $SECRET_NAME exists: $SECRET_EXISTS"
            
            if [ "$SECRET_EXISTS" = "true" ]; then
              # Check if it has the VAULT_TOKEN key
              VAULT_TOKEN_DATA=$(kubectl get secret "$SECRET_NAME" -n "$SECRET_NAMESPACE" -o jsonpath='{.data.VAULT_TOKEN}' 2>/dev/null || echo "")
              if [ -n "$VAULT_TOKEN_DATA" ]; then
                echo "✅ Vault token secret is available with VAULT_TOKEN key"
                break
              else
                echo "📄 Secret exists but missing VAULT_TOKEN key"
                # Show secret structure for debugging
                echo "🔍 Secret keys:"
                kubectl get secret "$SECRET_NAME" -n "$SECRET_NAMESPACE" -o jsonpath='{.data}' 2>/dev/null || echo "Cannot read secret data"
              fi
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Waiting for vault token... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Vault token not available, but continuing to database check"
              echo "🔍 Final debug - all secrets in namespace:"
              kubectl get secrets -n "$SECRET_NAMESPACE" 2>&1 || echo "Cannot list secrets"
              break
            fi
            sleep 5
          done
          
          # Install required packages
          apk add --no-cache netcat-openbsd postgresql15-client
          
          # Wait for YugabyteDB to be reachable
          echo "🔍 Step 2: Waiting for YugabyteDB to be reachable..."
          until nc -z "$POSTGRES_HOST" "$POSTGRES_PORT"; do
            echo "⏳ Waiting for YugabyteDB at $POSTGRES_HOST:$POSTGRES_PORT..."
            sleep 5
          done
          echo "✅ YugabyteDB is reachable"
          
          # Wait for backstage database to exist
          echo "🔍 Step 3: Waiting for backstage database to be created..."
          
          # First, check if we can get vaultadmin credentials from Vault
          VAULTADMIN_USER=""
          VAULTADMIN_PASS=""
          
          # Try to get vault token and vaultadmin credentials
          if kubectl get secret vault-root-token -n k8s-api-gateway -o jsonpath='{.data.VAULT_TOKEN}' 2>/dev/null | base64 -d > /tmp/vault_token 2>/dev/null; then
            export VAULT_TOKEN="$(cat /tmp/vault_token)"
            export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
            
            # Install curl to access Vault API
            apk add --no-cache curl jq 2>/dev/null
            
            echo "🔍 Trying to get vaultadmin credentials from Vault..."
            VAULT_RESPONSE=$(curl -s -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/secret/data/vaultadmin" 2>/dev/null || echo "")
            if [ -n "$VAULT_RESPONSE" ]; then
              VAULTADMIN_PASS=$(echo "$VAULT_RESPONSE" | jq -r '.data.data.password // .data.data.value // empty' 2>/dev/null || echo "")
              if [ -n "$VAULTADMIN_PASS" ]; then
                VAULTADMIN_USER="vaultadmin"
                echo "✅ Got vaultadmin credentials from Vault"
              fi
            fi
          fi
          
          RETRY_COUNT=0
          MAX_RETRIES=120
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            DB_FOUND=false
            
            # Try multiple connection methods
            for USER_PASS in "yugabyte:yugabyte" "$VAULTADMIN_USER:$VAULTADMIN_PASS"; do
              if [ -z "$USER_PASS" ] || [ "$USER_PASS" = ":" ]; then
                continue
              fi
              
              USER=$(echo "$USER_PASS" | cut -d: -f1)
              PASS=$(echo "$USER_PASS" | cut -d: -f2)
              
              echo "🔍 Trying connection with user: $USER"
              
              # Try to connect and check if backstage database exists
              if PGPASSWORD="$PASS" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$POSTGRES_DB'" 2>/dev/null | grep -q "1"; then
                echo "✅ Backstage database exists (verified with user: $USER)"
                DB_FOUND=true
                
                # Also check if backstage schema exists
                if PGPASSWORD="$PASS" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$USER" -d "$POSTGRES_DB" -tAc "SELECT 1 FROM information_schema.schemata WHERE schema_name='backstage'" 2>/dev/null | grep -q "1"; then
                  echo "✅ Backstage schema exists"
                  echo "✅ Database setup complete, Backstage can start"
                  exit 0
                else
                  echo "📄 Database exists but backstage schema not ready yet"
                fi
                break
              else
                # Try to list databases for debugging
                DB_LIST=$(PGPASSWORD="$PASS" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$USER" -d yugabyte -tAc "SELECT datname FROM pg_database" 2>/dev/null || echo "")
                if [ -n "$DB_LIST" ]; then
                  echo "📋 Available databases with user $USER: $DB_LIST"
                else
                  echo "❌ Cannot connect with user: $USER"
                fi
              fi
            done
            
            if [ "$DB_FOUND" = "false" ]; then
              echo "📄 Backstage database not found with any credentials"
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⏳ Waiting for database setup... (attempt $RETRY_COUNT/$MAX_RETRIES)"
            
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Database setup not complete after $MAX_RETRIES attempts"
              exit 1
            fi
            
            # Add debug info every 20 attempts
            if [ $((RETRY_COUNT % 20)) -eq 0 ]; then
              echo "🔍 Debug: Checking if database setup job exists..."
              kubectl get jobs -n k8s-api-gateway 2>/dev/null || echo "Cannot list jobs"
            fi
            
            sleep 5
          done
      # Migration coordination init container to prevent concurrent migrations
      - name: migration-coordinator
        image: alpine:3.18
        env:
        - name: POSTGRES_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5433"
        - name: POSTGRES_DB
          value: "backstage"
        - name: BACKSTAGE_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: VAULT_ADDR
          value: "http://vault.vault.svc.cluster.local:8200"
        command:
        - sh
        - -c
        - |
          set -e
          echo "🔐 Migration Coordinator: Installing dependencies..."
          
          # Install required tools
          apk add --no-cache curl jq postgresql15-client unzip
          
          # Remove any existing vault binary/symlink and install HashiCorp Vault
          rm -f /usr/bin/vault /usr/local/bin/vault
          VAULT_VERSION="1.15.2"
          curl -fsSL "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip" -o /tmp/vault.zip
          cd /tmp
          unzip vault.zip
          chmod +x vault
          mv vault /usr/local/bin/hashicorp-vault
          
          echo "🔐 Migration Coordinator: Getting database credentials from Vault..."
          
          # Check if vault token exists and get it (correct filename is VAULT_TOKEN)
          if [ -f /vault-token/VAULT_TOKEN ]; then
            export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
            echo "✅ Using vault root token"
          else
            echo "❌ Vault token not found at /vault-token/VAULT_TOKEN"
            echo "📁 Available files in /vault-token/:"
            ls -la /vault-token/ 2>/dev/null || echo "Directory /vault-token/ does not exist"
            exit 1
          fi
          
          # Test vault connectivity first
          echo "🔗 Testing Vault connectivity..."
          /usr/local/bin/hashicorp-vault status || echo "⚠️ Vault status check failed, continuing..."
          
          # Get database credentials from Vault using the renamed binary
          echo "📖 Reading database credentials from Vault..."
          CREDS_JSON="$(/usr/local/bin/hashicorp-vault read -format=json yugabyte-db/static-creds/backstage-app)"
          export PGUSER="$(echo "$CREDS_JSON" | jq -r .data.username)"
          export PGPASSWORD="$(echo "$CREDS_JSON" | jq -r .data.password)"
          export PGHOST="$POSTGRES_HOST"
          export PGPORT="$POSTGRES_PORT"
          export PGDATABASE="$POSTGRES_DB"
          
          # Force the database user to default to backstage schema for all connections
          echo "🔧 Setting user default schema to backstage..."
          psql -c "ALTER USER \"$PGUSER\" SET search_path TO backstage;" || echo "⚠️ Could not set user search_path, continuing..."
          
          echo "🔄 Migration Coordinator: Checking for migration lock..."
          
          # Create a coordination table for migration locks
          psql -c "
            CREATE TABLE IF NOT EXISTS backstage.migration_coordination (
              id SERIAL PRIMARY KEY,
              instance_name VARCHAR(255) UNIQUE NOT NULL,
              migration_status VARCHAR(50) NOT NULL DEFAULT 'waiting',
              created_at TIMESTAMP DEFAULT NOW(),
              updated_at TIMESTAMP DEFAULT NOW()
            );
          " || echo "⚠️ Migration coordination table might already exist"
          
          # Register this instance
          psql -c "
            INSERT INTO backstage.migration_coordination (instance_name, migration_status) 
            VALUES ('$BACKSTAGE_INSTANCE_ID', 'waiting')
            ON CONFLICT (instance_name) 
            DO UPDATE SET migration_status = 'waiting', updated_at = NOW();
          "
          
          echo "📋 Migration Coordinator: Checking migration queue..."
          
          # Check if any instance is currently running migrations
          MAX_WAIT=300  # 5 minutes max wait
          WAIT_COUNT=0
          
          while [ $WAIT_COUNT -lt $MAX_WAIT ]; do
            # Clean up stale migration locks (older than 10 minutes)
            psql -c "
              UPDATE backstage.migration_coordination 
              SET migration_status = 'failed' 
              WHERE migration_status = 'running' 
              AND updated_at < NOW() - INTERVAL '10 minutes';
            "
            
            # Try to acquire migration lock
            ACQUIRED=$(psql -tAc "
              WITH lock_attempt AS (
                UPDATE backstage.migration_coordination 
                SET migration_status = 'running', updated_at = NOW()
                WHERE instance_name = '$BACKSTAGE_INSTANCE_ID' 
                AND NOT EXISTS (
                  SELECT 1 FROM backstage.migration_coordination 
                  WHERE migration_status = 'running' 
                  AND instance_name != '$BACKSTAGE_INSTANCE_ID'
                )
                RETURNING instance_name
              )
              SELECT COUNT(*) FROM lock_attempt;
            ")
            
            if [ "$ACQUIRED" = "1" ]; then
              echo "✅ Migration Coordinator: Acquired migration lock for $BACKSTAGE_INSTANCE_ID"
              
              # Perform pre-migration setup with READ COMMITTED isolation
              echo "🔧 Migration Coordinator: Setting up YugabyteDB for migrations..."
              
              # Check if READ COMMITTED is already enabled server-wide
              RC_ENABLED=$(psql -tAc "SHOW yb_enable_read_committed_isolation;" 2>/dev/null || echo "off")
              if [ "$RC_ENABLED" = "on" ]; then
                echo "✅ READ COMMITTED isolation already enabled server-wide"
              else
                echo "🔧 Enabling READ COMMITTED isolation for this session"
                # Only set it if not enabled server-wide
                psql -c "SET yb_enable_read_committed_isolation = true;" 2>/dev/null || echo "⚠️ Cannot set yb_enable_read_committed_isolation (may need server-level setting)"
              fi
              
              echo "🔧 Creating complete Backstage schema to bypass corrupted migrations..."
              
              # Use advisory lock to ensure only one instance does setup
              psql -c "SELECT pg_advisory_lock(12345);"
              
              # Create comprehensive schema with all tables Backstage expects
              psql -c "
                -- Set session isolation level and current schema
                SET SESSION default_transaction_isolation = 'read committed';
                SET search_path = backstage, backstage_plugin_app, backstage_plugin_proxy, backstage_plugin_scaffolder, backstage_plugin_techdocs, backstage_plugin_auth, backstage_plugin_catalog, backstage_plugin_permission, backstage_plugin_search, backstage_plugin_kubernetes, backstage_plugin_notifications, backstage_plugin_signals;
                
                -- Create auth keys table first (critical for all plugins)
                DROP TABLE IF EXISTS backstage.backstage_backend_public_keys__keys;
                CREATE TABLE backstage.backstage_backend_public_keys__keys (
                  id VARCHAR(255) PRIMARY KEY,
                  key TEXT NOT NULL,
                  expires_at TIMESTAMPTZ,
                  created_at TIMESTAMPTZ DEFAULT NOW()
                );
                
                -- Create auth keys knex migrations table (required by auth service)
                CREATE TABLE IF NOT EXISTS backstage.backstage_backend_public_keys__knex_migrations (
                  id SERIAL PRIMARY KEY,
                  name VARCHAR(255),
                  batch INTEGER,
                  migration_time TIMESTAMPTZ DEFAULT NOW()
                );
                
                CREATE TABLE IF NOT EXISTS backstage.backstage_backend_public_keys__knex_migrations_lock (
                  index SERIAL PRIMARY KEY,
                  is_locked INTEGER DEFAULT 0
                );
              "
              
              # Verify ALL auth tables were created
              echo "✅ Verifying auth tables creation..."
              psql -c "SELECT 'Auth keys table created successfully' as status, COUNT(*) as table_exists FROM information_schema.tables WHERE table_schema='backstage' AND table_name='backstage_backend_public_keys__keys';"
              psql -c "SELECT 'Auth knex migrations table status' as status, COUNT(*) as table_exists FROM information_schema.tables WHERE table_schema='backstage' AND table_name='backstage_backend_public_keys__knex_migrations';"
              psql -c "SELECT 'Auth knex lock table status' as status, COUNT(*) as table_exists FROM information_schema.tables WHERE table_schema='backstage' AND table_name='backstage_backend_public_keys__knex_migrations_lock';"
              
              echo "📋 Listing all tables in backstage schema:"
              psql -c "SELECT schemaname, tablename FROM pg_tables WHERE schemaname='backstage' ORDER BY tablename;"
              
              # Create additional tables in separate commands for better error handling
              echo "🔧 Creating migration tracking tables..."
              psql -c "
                -- Create main migration tracking tables
                CREATE TABLE IF NOT EXISTS backstage.knex_migrations (
                  id SERIAL PRIMARY KEY,
                  name VARCHAR(255),
                  batch INTEGER,
                  migration_time TIMESTAMPTZ DEFAULT NOW()
                );
                
                CREATE TABLE IF NOT EXISTS backstage.knex_migrations_lock (
                  index SERIAL PRIMARY KEY,
                  is_locked INTEGER DEFAULT 0
                );
              "
              
              echo "🔧 Creating plugin-specific schemas and essential tables..."
              
              # Create plugin schemas (Backstage expects these with pluginDivisionMode: 'schema')
              psql -c "
                -- Create plugin-specific schemas
                CREATE SCHEMA IF NOT EXISTS backstage_plugin_app;
                CREATE SCHEMA IF NOT EXISTS backstage_plugin_proxy;
                CREATE SCHEMA IF NOT EXISTS backstage_plugin_scaffolder;
                CREATE SCHEMA IF NOT EXISTS backstage_plugin_techdocs;
                CREATE SCHEMA IF NOT EXISTS backstage_plugin_auth;
                CREATE SCHEMA IF NOT EXISTS backstage_plugin_catalog;
                CREATE SCHEMA IF NOT EXISTS backstage_plugin_permission;
                CREATE SCHEMA IF NOT EXISTS backstage_plugin_search;
                CREATE SCHEMA IF NOT EXISTS backstage_plugin_kubernetes;
                CREATE SCHEMA IF NOT EXISTS backstage_plugin_notifications;
                CREATE SCHEMA IF NOT EXISTS backstage_plugin_signals;
              "
              
              echo "🔧 Creating schema-specific migration tables..."
              # Create knex tables in each plugin schema
              for schema in backstage backstage_plugin_app backstage_plugin_proxy backstage_plugin_scaffolder backstage_plugin_techdocs backstage_plugin_auth backstage_plugin_catalog backstage_plugin_permission backstage_plugin_search backstage_plugin_kubernetes backstage_plugin_notifications backstage_plugin_signals; do
                psql -c "
                  CREATE TABLE IF NOT EXISTS ${schema}.knex_migrations (
                    id SERIAL PRIMARY KEY,
                    name VARCHAR(255),
                    batch INTEGER,
                    migration_time TIMESTAMPTZ DEFAULT NOW()
                  );
                  
                  CREATE TABLE IF NOT EXISTS ${schema}.knex_migrations_lock (
                    index SERIAL PRIMARY KEY,
                    is_locked INTEGER DEFAULT 0
                  );
                  
                  -- Insert lock record if not exists
                  INSERT INTO ${schema}.knex_migrations_lock (is_locked) 
                  SELECT 0 WHERE NOT EXISTS (SELECT 1 FROM ${schema}.knex_migrations_lock);
                " || echo "Tables for $schema may already exist"
              done
              
              echo "🔧 Creating shared tables in main backstage schema..."
              psql -c "
                -- Create static assets cache table for app plugin
                CREATE TABLE IF NOT EXISTS backstage.static_assets_cache (
                  path VARCHAR(255) PRIMARY KEY,
                  content BYTEA,
                  last_modified_at TIMESTAMPTZ DEFAULT NOW(),
                  content_encoding VARCHAR(50),
                  content_type VARCHAR(100)
                );
                
                -- Create basic catalog tables to prevent errors
                CREATE TABLE IF NOT EXISTS backstage.final_entities (
                  entity_id VARCHAR(255) PRIMARY KEY,
                  entity_ref VARCHAR(255) NOT NULL,
                  final_entity JSONB,
                  hash VARCHAR(255),
                  stitch_ticket VARCHAR(255),
                  last_updated_at TIMESTAMPTZ DEFAULT NOW()
                );
                
                CREATE TABLE IF NOT EXISTS backstage.refresh_state (
                  entity_id VARCHAR(255),
                  entity_ref VARCHAR(255),
                  unprocessed_entity JSONB,
                  processed_entity JSONB,
                  result_hash VARCHAR(255),
                  next_update_at TIMESTAMPTZ,
                  last_discovery_at TIMESTAMPTZ DEFAULT NOW()
                );
                
                CREATE TABLE IF NOT EXISTS backstage.locations (
                  id VARCHAR(255) PRIMARY KEY,
                  type VARCHAR(255),
                  target VARCHAR(255)
                );
                
                -- Create search table
                CREATE TABLE IF NOT EXISTS backstage.search (
                  key VARCHAR(255),
                  value TEXT,
                  original_value TEXT,
                  created_at TIMESTAMPTZ DEFAULT NOW()
                );
              "
              
              echo "🔧 Setting comprehensive permissions for all schemas..."
              # Grant permissions to all schemas
              for schema in backstage backstage_plugin_app backstage_plugin_proxy backstage_plugin_scaffolder backstage_plugin_techdocs backstage_plugin_auth backstage_plugin_catalog backstage_plugin_permission backstage_plugin_search backstage_plugin_kubernetes backstage_plugin_notifications backstage_plugin_signals; do
                psql -c "
                  GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA ${schema} TO backstage_app;
                  GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA ${schema} TO backstage_app;
                  GRANT USAGE ON SCHEMA ${schema} TO backstage_app;
                  GRANT CREATE ON SCHEMA ${schema} TO backstage_app;
                " || echo "Permissions for $schema may already be set"
              done
              
              # Create the index separately to avoid complex syntax
              psql -c "CREATE INDEX IF NOT EXISTS static_asset_cache_last_modified_at_idx ON backstage.static_assets_cache (last_modified_at);" || echo "Index may already exist"
              
              # First add unique constraint to migrations table, then insert fake records
              psql -c "
                -- Add unique constraint on name column
                ALTER TABLE backstage.knex_migrations ADD CONSTRAINT knex_migrations_name_unique UNIQUE (name);
              " || echo "Unique constraint may already exist"
              
              echo "🔧 Inserting fake migration records for all schemas..."
              # Insert fake migration records to satisfy Backstage validation in each schema
              for schema in backstage backstage_plugin_app backstage_plugin_proxy backstage_plugin_scaffolder backstage_plugin_techdocs backstage_plugin_auth backstage_plugin_catalog backstage_plugin_permission backstage_plugin_search backstage_plugin_kubernetes backstage_plugin_notifications backstage_plugin_signals; do
                psql -c "
                  INSERT INTO ${schema}.knex_migrations (name, batch) VALUES 
                  ('20210120143715_init.js', 1),
                  ('20210409225200_secrets.js', 1),
                  ('20220129100000_created_by.js', 1),
                  ('20240203232000_state.js', 1),
                  ('20240401213200_workspace.js', 1),
                  ('20210311110000_init.js', 1),
                  ('20210727180000_delta_update.js', 1)
                  ON CONFLICT (name) DO NOTHING;
                " || echo "Migration records for $schema may already exist"
              done
              
              echo "🔧 Adding fake migration records to auth keys table..."
              # Add fake migration records to auth keys migration table
              psql -c "
                INSERT INTO backstage.backstage_backend_public_keys__knex_migrations (name, batch) VALUES 
                ('001_create_keys_table.js', 1),
                ('002_add_expires_at.js', 1)
                ON CONFLICT (name) DO NOTHING;
                
                -- Ensure lock table has entry
                INSERT INTO backstage.backstage_backend_public_keys__knex_migrations_lock (is_locked) 
                SELECT 0 WHERE NOT EXISTS (SELECT 1 FROM backstage.backstage_backend_public_keys__knex_migrations_lock);
              " || echo "Auth keys migration records may already exist"
              
              echo "🔍 Final verification - checking all critical tables exist..."
              # Final verification that all critical tables exist
              AUTH_KEYS_COUNT=$(psql -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='backstage' AND table_name='backstage_backend_public_keys__keys';")
              AUTH_MIGRATIONS_COUNT=$(psql -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='backstage' AND table_name='backstage_backend_public_keys__knex_migrations';")
              MAIN_MIGRATIONS_COUNT=$(psql -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='backstage' AND table_name='knex_migrations';")
              
              echo "📊 Table verification results:"
              echo "  - Auth keys table: $AUTH_KEYS_COUNT (should be 1)"
              echo "  - Auth migrations table: $AUTH_MIGRATIONS_COUNT (should be 1)"  
              echo "  - Main migrations table: $MAIN_MIGRATIONS_COUNT (should be 1)"
              
              if [ "$AUTH_KEYS_COUNT" = "1" ] && [ "$AUTH_MIGRATIONS_COUNT" = "1" ] && [ "$MAIN_MIGRATIONS_COUNT" = "1" ]; then
                echo "✅ All critical tables verified successfully"
              else
                echo "❌ WARNING: Some tables are missing - Backstage may fail to start"
                psql -c "SELECT schemaname, tablename FROM pg_tables WHERE schemaname='backstage' ORDER BY tablename;"
              fi
              
              # Release the advisory lock
              psql -c "SELECT pg_advisory_unlock(12345);"
              
              echo "✅ Complete Backstage schema created, bypassing migration validation"
              
              # Mark migration as completed
              psql -c "
                UPDATE backstage.migration_coordination 
                SET migration_status = 'completed', updated_at = NOW()
                WHERE instance_name = '$BACKSTAGE_INSTANCE_ID';
              "
              
              echo "✅ Migration Coordinator: Migration setup completed for $BACKSTAGE_INSTANCE_ID"
              break
            else
              RUNNING_INSTANCE=$(psql -tAc "
                SELECT instance_name FROM backstage.migration_coordination 
                WHERE migration_status = 'running' 
                LIMIT 1;
              ")
              echo "⏳ Migration Coordinator: Waiting for migration by instance: $RUNNING_INSTANCE (${WAIT_COUNT}s/${MAX_WAIT}s)"
              sleep 5
              WAIT_COUNT=$((WAIT_COUNT + 5))
            fi
          done
          
          if [ $WAIT_COUNT -ge $MAX_WAIT ]; then
            echo "❌ Migration Coordinator: Timeout waiting for migration lock"
            psql -c "
              UPDATE backstage.migration_coordination 
              SET migration_status = 'timeout', updated_at = NOW()
              WHERE instance_name = '$BACKSTAGE_INSTANCE_ID';
            "
            exit 1
          fi
          
          echo "✅ Migration Coordinator: Ready for Backstage startup"
        volumeMounts:
        - name: root-token
          mountPath: /vault-token
          readOnly: true
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits: { cpu: "200m", memory: "128Mi" }
      containers:
      # Simple PostgreSQL proxy sidecar using socat (more reliable than PGBouncer image issues)
      - name: postgres-proxy
        image: alpine:3.18
        ports:
        - containerPort: 6432
        env:
        - name: POSTGRES_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5433"
        command:
        - sh
        - -c
        - |
          echo "🔧 Installing socat for PostgreSQL proxy..."
          apk add --no-cache socat
          echo "✅ Starting PostgreSQL proxy: localhost:6432 -> $POSTGRES_HOST:$POSTGRES_PORT"
          exec socat TCP-LISTEN:6432,reuseaddr,fork TCP:$POSTGRES_HOST:$POSTGRES_PORT
      - name: backstage
        image: ghcr.io/dotcomrow/backstage-image:ts-20251108-195559
        workingDir: /app
        ports:
        - containerPort: 7007
        env:
        - name: NODE_ENV
          value: "production"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=14336"
        - name: BACKSTAGE_APP_CONFIG
          value: "/app/app-config.yaml"
        - name: POSTGRES_HOST
          value: "localhost"
        - name: POSTGRES_PORT
          value: "6432"
        - name: POSTGRES_DB
          value: "backstage"
        - name: POSTGRES_SCHEMA
          value: "backstage"
        # Force Backstage to use backstage schema as default
        - name: BACKSTAGE_DATABASE_SCHEMA
          value: "backstage"
        - name: KNEX_SCHEMA
          value: "backstage"
        # YugabyteDB compatibility settings - force backstage as only schema
        - name: PGOPTIONS
          value: "-c search_path=backstage"
        # Also try setting the default schema via environment
        - name: PGSCHEMA
          value: "backstage"
        # Auth-specific schema environment variables
        - name: AUTH_DATABASE_SCHEMA
          value: "backstage"
        - name: BACKSTAGE_AUTH_SCHEMA
          value: "backstage"
        # Force PostgreSQL client to use backstage schema by default
        - name: PGCLIENTENCODING
          value: "UTF8"
        - name: PGSEARCH_PATH
          value: "backstage"
        # Core auth service schema enforcement
        - name: BACKSTAGE_BACKEND_AUTH_KEYS_SCHEMA
          value: "backstage"
        - name: KNEX_DEFAULT_SCHEMA
          value: "backstage"
        # Additional Node.js pg client schema enforcement
        - name: PGSCHEMA_DEFAULT
          value: "backstage"
        - name: NODE_PG_FORCE_NATIVE
          value: "false"
        # Completely disable native pg driver attempts
        - name: NODE_PG_NO_NATIVE
          value: "1"
        - name: PG_NATIVE_MAX_CONN
          value: "0"
        # Force pg module to skip native binding completely
        - name: NODE_ENV
          value: "production"
        - name: PG_FORCE_NATIVE
          value: "false"
        # Absolutely force pure JS pg driver
        - name: PG_NATIVE
          value: "false"
        - name: DISABLE_PG_NATIVE
          value: "1"
        # Force pg library to never attempt native binding loading
        - name: NODE_PG_FORCE_NATIVE
          value: "false"
        - name: NODE_PG_NO_NATIVE
          value: "1"
        - name: BACKEND_SECRET
          value: "your-backend-secret-here-change-this"
        # Disable Backstage migrations - handled by migration coordinator
        - name: BACKSTAGE_BACKEND_DATABASE_MIGRATIONS_SKIP
          value: "true"
        - name: NODE_CONFIG_STRICT_MODE
          value: "false"
        # Force disable all knex migration attempts
        - name: KNEX_DISABLE_MIGRATIONS
          value: "true"
        - name: BACKSTAGE_DISABLE_MIGRATIONS
          value: "true"
        - name: GITHUB_TEAM
          value: "backstage_admin_access"
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          
          echo "🔧 Patching pg-native module to prevent require errors..."
          
          # Create fake pg-native module directory and files
          mkdir -p /app/node_modules/pg-native
          echo '// Fake pg-native module to prevent require errors' > /app/node_modules/pg-native/index.js
          echo 'console.log("⚠️ pg-native disabled - using pure JavaScript PostgreSQL driver");' >> /app/node_modules/pg-native/index.js  
          echo '// Export the JavaScript Client instead of native' >> /app/node_modules/pg-native/index.js
          echo 'module.exports = require("../pg/lib/client");' >> /app/node_modules/pg-native/index.js
          
          echo '{"name": "pg-native", "version": "1.0.0-fake", "description": "Fake pg-native", "main": "index.js"}' > /app/node_modules/pg-native/package.json
          
          # Also patch the pg library native files to prevent loading attempts
          if [ -d "/app/node_modules/pg/lib/native" ]; then
            echo "🔧 Patching pg native directory..."
            
            # Create safe fallback files that properly export the JS client
            echo '// Safe native client fallback - prevents pg-native require errors' > /app/node_modules/pg/lib/native/client.js
            echo 'console.log("⚠️ pg native client disabled - using JavaScript client");' >> /app/node_modules/pg/lib/native/client.js
            echo "module.exports = require('../client');" >> /app/node_modules/pg/lib/native/client.js
            
            echo '// Safe native index fallback - prevents pg-native require errors' > /app/node_modules/pg/lib/native/index.js
            echo 'console.log("⚠️ pg native disabled - using JavaScript driver");' >> /app/node_modules/pg/lib/native/index.js
            echo '// Export the same structure as the regular pg module' >> /app/node_modules/pg/lib/native/index.js
            echo 'const { Client, Pool, types, defaults } = require("../index");' >> /app/node_modules/pg/lib/native/index.js
            echo 'module.exports = { Client, Pool, types, defaults };' >> /app/node_modules/pg/lib/native/index.js
            
            echo "✅ pg native files patched successfully"
          fi
          
          echo "✅ pg-native patching completed"
          
          echo "🔧 Loading database credentials from Vault..."
          if [ -f /vault/secrets/db-creds ]; then
            echo "📄 Vault secrets file found, contents:"
            cat /vault/secrets/db-creds
            source /vault/secrets/db-creds
            echo "✅ Database credentials loaded"
          else
            echo "⚠️ No Vault credentials found, using default/empty values"
            export POSTGRES_USER=""
            export POSTGRES_PASSWORD=""
          fi
          echo "🔍 Debug - Environment variables:"
          echo "POSTGRES_HOST: $POSTGRES_HOST"
          echo "POSTGRES_PORT: $POSTGRES_PORT"
          echo "POSTGRES_DB: $POSTGRES_DB"
          echo "POSTGRES_USER: $POSTGRES_USER"
          echo "POSTGRES_PASSWORD: [$(echo "$POSTGRES_PASSWORD" | wc -c) chars]"
          echo "🚀 Starting Backstage with loaded credentials..."
          # Ensure all environment variables are exported for the nested shell
          export POSTGRES_HOST POSTGRES_PORT POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD
          exec sh -c '
            echo "🚀 Starting pre-built Backstage application..." &&
            echo "📊 Container memory info:" &&
            free -h 2>/dev/null || echo "Memory info not available" &&
            echo "🔍 Searching for built backend..." &&
            if [ -f "packages/backend/dist/bundle.tar.gz" ]; then
              echo "📦 Extracting backend bundle if needed..." &&
              cd packages/backend/dist &&
              if [ ! -f "index.js" ]; then
                echo "🔍 Examining bundle contents before extraction:" &&
                tar -tzf bundle.tar.gz | head -10 &&
                echo "📦 Extracting bundle..." &&
                tar -xzf bundle.tar.gz &&
                echo "📁 Contents after extraction:" &&
                ls -la &&
                echo "🔍 Looking for backend entry points recursively:" &&
                find . -name "index*.js" -type f 2>/dev/null || echo "No backend entry points found";
              fi &&
              BACKEND_JS="" &&
              if [ -f "index.js" ]; then
                BACKEND_JS="index.js";
              elif [ -f "index.cjs.js" ]; then
                BACKEND_JS="index.cjs.js";
              elif [ -f "packages/backend/dist/index.js" ]; then
                BACKEND_JS="packages/backend/dist/index.js";
              elif [ -f "packages/backend/dist/index.cjs.js" ]; then
                BACKEND_JS="packages/backend/dist/index.cjs.js";
              elif [ -f "dist/index.js" ]; then
                BACKEND_JS="dist/index.js";
              elif [ -f "dist/index.cjs.js" ]; then
                BACKEND_JS="dist/index.cjs.js";
              elif [ -f "bundle/index.js" ]; then
                BACKEND_JS="bundle/index.js";
              elif [ -f "bundle/index.cjs.js" ]; then
                BACKEND_JS="bundle/index.cjs.js";
              else
                BACKEND_JS=$(find . -name "index.*.js" -type f | head -1);
              fi &&
              if [ -n "$BACKEND_JS" ] && [ -f "$BACKEND_JS" ]; then
                echo "✅ Starting backend from extracted bundle: $BACKEND_JS" &&
                echo "🔧 Setting up config file with environment variable substitution..." &&
                if [ -f "/app/app-config.yaml" ]; then
                  echo "Source config exists at /app/app-config.yaml" &&
                  mkdir -p /app/packages/backend/dist &&
                  echo "🔄 Processing config with shell parameter expansion..." &&
                  sed "s/\$POSTGRES_HOST/$POSTGRES_HOST/g; s/\$POSTGRES_PORT/$POSTGRES_PORT/g; s/\$POSTGRES_USER/$POSTGRES_USER/g; s/\$POSTGRES_PASSWORD/$POSTGRES_PASSWORD/g; s/\$POSTGRES_DB/$POSTGRES_DB/g; s/\$BACKEND_SECRET/$BACKEND_SECRET/g" /app/app-config.yaml > /app/packages/backend/dist/app-config.yaml &&
                  echo "✅ Config processed and copied to /app/packages/backend/dist/app-config.yaml" &&
                  echo "📄 Processed config database section:" &&
                  grep -A 10 "database:" /app/packages/backend/dist/app-config.yaml || echo "No database section found" &&
                  ls -la /app/packages/backend/dist/app-config.yaml || echo "Config copy verification failed";
                else
                  echo "❌ Source config file /app/app-config.yaml not found";
                fi &&
                echo "🔧 Using PGBouncer sidecar for YugabyteDB connectivity..." &&
                export NODE_ENV=production &&
                echo "✅ Connecting to YugabyteDB via PGBouncer localhost:6432" &&
                exec node "$BACKEND_JS";
              else
                echo "❌ Bundle extraction failed - no backend entry point found anywhere" &&
                echo "📁 Complete directory structure:" &&
                find . -type f | head -20 &&
                exit 1;
              fi;
            elif [ -f "packages/backend/dist/index.js" ]; then
              echo "✅ Starting pre-built backend from packages/backend/dist/index.js" &&
              echo "🔧 Setting up config file with environment variable substitution..." &&
              if [ -f "/app/app-config.yaml" ]; then
                echo "Source config exists at /app/app-config.yaml" &&
                mkdir -p /app/packages/backend/dist &&
                echo "🔄 Processing config with sed substitution..." &&
                sed "s/\$POSTGRES_HOST/$POSTGRES_HOST/g; s/\$POSTGRES_PORT/$POSTGRES_PORT/g; s/\$POSTGRES_USER/$POSTGRES_USER/g; s/\$POSTGRES_PASSWORD/$POSTGRES_PASSWORD/g; s/\$POSTGRES_DB/$POSTGRES_DB/g; s/\$BACKEND_SECRET/$BACKEND_SECRET/g" /app/app-config.yaml > /app/packages/backend/dist/app-config.yaml &&
                echo "✅ Config processed and copied to /app/packages/backend/dist/app-config.yaml" &&
                ls -la /app/packages/backend/dist/app-config.yaml || echo "Config copy verification failed";
              else
                echo "❌ Source config file /app/app-config.yaml not found";
              fi &&
              echo "🔧 Forcing pure JavaScript pg driver..." &&
              export DISABLE_PG_NATIVE=1 &&
              export NODE_PG_FORCE_NATIVE=false &&
              export NODE_PG_NO_NATIVE=true &&
              export PG_NATIVE_MAX_CONN=0 &&
              exec node packages/backend/dist/index.js;
            elif [ -f "packages/backend/dist/index.cjs.js" ]; then
              echo "✅ Starting pre-built backend from packages/backend/dist/index.cjs.js" &&
              echo "🔧 Setting up config file with environment variable substitution..." &&
              if [ -f "/app/app-config.yaml" ]; then
                echo "Source config exists at /app/app-config.yaml" &&
                mkdir -p /app/packages/backend/dist &&
                echo "🔄 Processing config with sed substitution..." &&
                sed "s/\$POSTGRES_HOST/$POSTGRES_HOST/g; s/\$POSTGRES_PORT/$POSTGRES_PORT/g; s/\$POSTGRES_USER/$POSTGRES_USER/g; s/\$POSTGRES_PASSWORD/$POSTGRES_PASSWORD/g; s/\$POSTGRES_DB/$POSTGRES_DB/g; s/\$BACKEND_SECRET/$BACKEND_SECRET/g" /app/app-config.yaml > /app/packages/backend/dist/app-config.yaml &&
                echo "✅ Config processed and copied to /app/packages/backend/dist/app-config.yaml" &&
                ls -la /app/packages/backend/dist/app-config.yaml || echo "Config copy verification failed";
              else
                echo "❌ Source config file /app/app-config.yaml not found";
              fi &&
              echo "🔧 Forcing pure JavaScript pg driver..." &&
              export DISABLE_PG_NATIVE=1 &&
              export NODE_PG_FORCE_NATIVE=false &&
              export NODE_PG_NO_NATIVE=true &&
              export PG_NATIVE_MAX_CONN=0 &&
              exec node packages/backend/dist/index.cjs.js;
            elif [ -f "dist/packages/backend/index.js" ]; then
              echo "✅ Starting pre-built backend from dist/packages/backend/index.js" &&
              echo "🔧 Forcing pure JavaScript pg driver..." &&
              export DISABLE_PG_NATIVE=1 &&
              export NODE_PG_FORCE_NATIVE=false &&
              export NODE_PG_NO_NATIVE=true &&
              export PG_NATIVE_MAX_CONN=0 &&
              exec node dist/packages/backend/index.js;
            elif [ -f "dist/packages/backend/index.cjs.js" ]; then
              echo "✅ Starting pre-built backend from dist/packages/backend/index.cjs.js" &&
              echo "🔧 Forcing pure JavaScript pg driver..." &&
              export DISABLE_PG_NATIVE=1 &&
              export NODE_PG_FORCE_NATIVE=false &&
              export NODE_PG_NO_NATIVE=true &&
              export PG_NATIVE_MAX_CONN=0 &&
              exec node dist/packages/backend/index.cjs.js;
            elif [ -f "dist/index.js" ]; then
              echo "✅ Starting pre-built backend from dist/index.js" &&
              echo "🔧 Forcing pure JavaScript pg driver..." &&
              export DISABLE_PG_NATIVE=1 &&
              export NODE_PG_FORCE_NATIVE=false &&
              export NODE_PG_NO_NATIVE=true &&
              export PG_NATIVE_MAX_CONN=0 &&
              exec node dist/index.js;
            elif [ -f "dist/index.cjs.js" ]; then
              echo "✅ Starting pre-built backend from dist/index.cjs.js" &&
              echo "🔧 Forcing pure JavaScript pg driver..." &&
              export DISABLE_PG_NATIVE=1 &&
              export NODE_PG_FORCE_NATIVE=false &&
              export NODE_PG_NO_NATIVE=true &&
              export PG_NATIVE_MAX_CONN=0 &&
              exec node dist/index.cjs.js;
            else
              echo "❌ ERROR: No pre-built backend found!" &&
              echo "📁 Backend dist contents:" &&
              ls -la packages/backend/dist/ 2>/dev/null || echo "No backend dist" &&
              echo "📄 Available files:" &&
              find . -name "*.js" -o -name "*.tar.gz" | head -10 &&
              exit 1;
            fi
          '
        volumeMounts:
        - name: backstage-config
          mountPath: /app/app-config.yaml
          subPath: app-config.yaml
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "4000m"
            memory: "16Gi"
        livenessProbe:
          httpGet:
            path: /api/catalog/health
            port: 7007
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/catalog/health
            port: 7007
          initialDelaySeconds: 30
          periodSeconds: 10
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - |
                echo "🧹 Backstage preStop: Cleaning up public schema before shutdown..."
                
                # Get database credentials from environment variables
                export PGHOST="${POSTGRES_HOST}"
                export PGPORT="${POSTGRES_PORT}"
                export PGDATABASE="${POSTGRES_DB}"
                export PGUSER="${POSTGRES_USER}"
                export PGPASSWORD="${POSTGRES_PASSWORD}"
                
                # Quick cleanup of any public schema artifacts
                psql -c "
                  DO \$\$
                  DECLARE
                    r RECORD;
                  BEGIN
                    -- Clean up any tables that might have been created in public
                    FOR r IN SELECT tablename FROM pg_tables 
                             WHERE schemaname = 'public' 
                               AND (tablename LIKE '%backstage%' 
                                 OR tablename LIKE '%knex%'
                                 OR tablename LIKE '%plugin%')
                    LOOP
                      EXECUTE 'DROP TABLE IF EXISTS public.' || quote_ident(r.tablename) || ' CASCADE';
                      RAISE NOTICE 'PreStop cleanup - Dropped table: public.%', r.tablename;
                    END LOOP;
                  EXCEPTION
                    WHEN OTHERS THEN
                      RAISE NOTICE 'PreStop cleanup failed: %', SQLERRM;
                  END
                  \$\$;
                " 2>/dev/null || echo "⚠️ PreStop cleanup failed (this is expected if DB is unavailable)"
                
                echo "✅ Backstage preStop cleanup completed"
      volumes:
      - name: backstage-config
        configMap:
          name: backstage-config
      - name: root-token
        secret:
          secretName: vault-root-token
          optional: false
---
# Backstage Service
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: k8s-api-gateway
spec:
  ports:
  - port: 80
    targetPort: 7007
    name: http
  selector:
    app: backstage
---
# Public Schema Cleanup Job for Backstage
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backstage-public-schema-cleanup
  namespace: k8s-api-gateway
  labels:
    app: backstage-cleanup
spec:
  # Run every 30 minutes to ensure public schema stays clean
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: backstage
          containers:
          - name: cleanup
            image: postgres:15-alpine
            env:
            - name: PGHOST
              value: "yugabytedb.yugabytedb.svc.cluster.local"
            - name: PGPORT
              value: "5433"
            - name: PGDATABASE
              value: "backstage"
            command:
            - sh
            - -c
            - |
              echo "🧹 Starting public schema cleanup check..."
              
              # Get database credentials from Vault
              export VAULT_ADDR="https://vault.vault.svc.cluster.local:8200"
              export VAULT_TOKEN="$(cat /vault-token/token)"
              
              # Use vault to get DB credentials
              CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/backstage-app)"
              export PGUSER="$(echo "$CREDS_JSON" | jq -r .data.username)"
              export PGPASSWORD="$(echo "$CREDS_JSON" | jq -r .data.password)"
              
              # Check for any backstage-related objects in public schema
              OBJECTS=$(psql -t -c "
                SELECT 
                  schemaname, 
                  tablename as object_name, 
                  'table' as object_type
                FROM pg_tables 
                WHERE schemaname = 'public' 
                  AND (tablename LIKE '%backstage%' 
                    OR tablename LIKE '%knex%'
                    OR tablename LIKE '%plugin%')
                UNION ALL
                SELECT 
                  schemaname, 
                  sequencename as object_name, 
                  'sequence' as object_type  
                FROM pg_sequences 
                WHERE schemaname = 'public'
                  AND (sequencename LIKE '%backstage%' 
                    OR sequencename LIKE '%knex%'
                    OR sequencename LIKE '%plugin%')
                UNION ALL
                SELECT 
                  nspname as schemaname,
                  proname as object_name,
                  'function' as object_type
                FROM pg_proc p 
                JOIN pg_namespace n ON p.pronamespace = n.oid 
                WHERE nspname = 'public' 
                  AND (proname LIKE '%backstage%' 
                    OR proname LIKE '%knex%'
                    OR proname LIKE '%plugin%');
              " | grep -v '^\s*$' || true)
              
              if [ -n "$OBJECTS" ]; then
                echo "⚠️  WARNING: Found Backstage-related objects in public schema:"
                echo "$OBJECTS"
                echo "🧹 Cleaning up..."
                
                # Drop tables first (handles dependencies)
                psql -c "
                  DO \$\$
                  DECLARE
                    r RECORD;
                  BEGIN
                    -- Drop tables
                    FOR r IN SELECT tablename FROM pg_tables 
                             WHERE schemaname = 'public' 
                               AND (tablename LIKE '%backstage%' 
                                 OR tablename LIKE '%knex%'
                                 OR tablename LIKE '%plugin%')
                    LOOP
                      EXECUTE 'DROP TABLE IF EXISTS public.' || quote_ident(r.tablename) || ' CASCADE';
                      RAISE NOTICE 'Dropped table: public.%', r.tablename;
                    END LOOP;
                    
                    -- Drop sequences
                    FOR r IN SELECT sequencename FROM pg_sequences 
                             WHERE schemaname = 'public'
                               AND (sequencename LIKE '%backstage%' 
                                 OR sequencename LIKE '%knex%'
                                 OR sequencename LIKE '%plugin%')
                    LOOP
                      EXECUTE 'DROP SEQUENCE IF EXISTS public.' || quote_ident(r.sequencename) || ' CASCADE';
                      RAISE NOTICE 'Dropped sequence: public.%', r.sequencename;
                    END LOOP;
                    
                    -- Drop functions
                    FOR r IN SELECT proname FROM pg_proc p 
                             JOIN pg_namespace n ON p.pronamespace = n.oid 
                             WHERE nspname = 'public' 
                               AND (proname LIKE '%backstage%' 
                                 OR proname LIKE '%knex%'
                                 OR proname LIKE '%plugin%')
                    LOOP
                      EXECUTE 'DROP FUNCTION IF EXISTS public.' || quote_ident(r.proname) || ' CASCADE';
                      RAISE NOTICE 'Dropped function: public.%', r.proname;
                    END LOOP;
                  END
                  \$\$;
                "
                echo "✅ Cleanup completed"
              else
                echo "✅ Public schema is clean - no Backstage objects found"
              fi
            volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
            resources:
              requests: { cpu: "10m",  memory: "32Mi" }
              limits:   { cpu: "100m", memory: "128Mi" }
          volumes:
          - name: root-token
            secret:
              secretName: vault-root-token
              optional: false
---
# One-time Public Schema Cleanup Job (runs after Backstage initialization)
apiVersion: batch/v1
kind: Job
metadata:
  name: backstage-initial-cleanup
  namespace: k8s-api-gateway
  labels:
    app: backstage-cleanup
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: backstage
      initContainers:
      # Wait for Backstage to be ready before cleaning up
      - name: wait-for-backstage
        image: curlimages/curl:8.1.2
        command:
        - sh
        - -c
        - |
          echo "⏳ Waiting for Backstage to be healthy..."
          until curl -f http://backstage.k8s-api-gateway.svc.cluster.local/health 2>/dev/null; do
            echo "🔄 Backstage not ready yet, waiting..."
            sleep 10
          done
          echo "✅ Backstage is healthy, proceeding with cleanup"
          # Wait an additional 2 minutes to ensure all initialization is complete
          sleep 120
      containers:
      - name: cleanup
        image: postgres:15-alpine
        env:
        - name: PGHOST
          value: "yugabytedb.yugabytedb.svc.cluster.local"
        - name: PGPORT
          value: "5433"
        - name: PGDATABASE
          value: "backstage"
        command:
        - sh
        - -c
        - |
          echo "🧹 Running initial public schema cleanup after Backstage initialization..."
          
          # Get database credentials from Vault
          export VAULT_ADDR="https://vault.vault.svc.cluster.local:8200"
          export VAULT_TOKEN="$(cat /vault-token/token)"
          
          # Use vault to get DB credentials
          CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/backstage-app)"
          export PGUSER="$(echo "$CREDS_JSON" | jq -r .data.username)"
          export PGPASSWORD="$(echo "$CREDS_JSON" | jq -r .data.password)"
          
          echo "🔍 Checking for any artifacts in public schema from initialization..."
          
          # Get a comprehensive list of all objects that might have been created during init
          TABLES=$(psql -t -c "SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename NOT IN (SELECT tablename FROM pg_tables WHERE schemaname = 'information_schema');" | grep -v '^\s*$' || true)
          
          if [ -n "$TABLES" ]; then
            echo "⚠️  Found tables in public schema post-initialization:"
            echo "$TABLES"
            
            # Check if any are Backstage/Knex related
            BACKSTAGE_TABLES=$(echo "$TABLES" | grep -E "(backstage|knex|plugin)" || true)
            if [ -n "$BACKSTAGE_TABLES" ]; then
              echo "🧹 Cleaning up Backstage-related tables from public schema..."
              echo "$BACKSTAGE_TABLES" | while IFS= read -r table; do
                if [ -n "$table" ]; then
                  psql -c "DROP TABLE IF EXISTS public.\"$table\" CASCADE;" && echo "  ✅ Dropped: public.$table"
                fi
              done
            fi
          fi
          
          # Verify Backstage schema has the expected objects
          BACKSTAGE_OBJECTS=$(psql -t -c "SELECT COUNT(*) FROM pg_tables WHERE schemaname = 'backstage';" | tr -d ' ')
          echo "📊 Backstage schema contains $BACKSTAGE_OBJECTS tables"
          
          if [ "$BACKSTAGE_OBJECTS" -gt 0 ]; then
            echo "✅ Backstage schema is populated correctly"
          else
            echo "⚠️  Warning: Backstage schema appears empty"
          fi
          
          echo "✅ Initial cleanup completed"
        volumeMounts:
        - name: root-token
          mountPath: /vault-token
          readOnly: true
        resources:
          requests: { cpu: "50m",  memory: "64Mi" }
          limits:   { cpu: "200m", memory: "256Mi" }
      volumes:
      - name: root-token
        secret:
          secretName: vault-root-token
          optional: false
---
# APISIX Upstream for Backstage
apiVersion: apisix.apache.org/v2
kind: ApisixUpstream
metadata:
  name: backstage-upstream
  namespace: k8s-api-gateway
spec:
  ports:
  - port: 80
    loadbalancer:
      type: roundrobin
  timeout:
    connect: 6s
    send: 6s
    read: 6s
---
# APISIX Service for Backstage (enables service discovery)
apiVersion: v1
kind: Service
metadata:
  name: backstage-proxy
  namespace: k8s-api-gateway
spec:
  type: ExternalName
  externalName: backstage.k8s-api-gateway.svc.cluster.local
  ports:
  - port: 80
    targetPort: 80
---
# Internal API Gateway Routes for Backstage
# Note: GUI access is via Teleport, these routes are for:
# 1. Internal service-to-service API calls
# 2. Backstage managing APISIX gateway itself
# 3. Optional internal access patterns

# APISIX Route for Backstage Management APIs (internal service calls)
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: backstage-management
  namespace: k8s-api-gateway
  annotations:
    # Target this specific internal APISIX cluster
    apisix.ingress.kubernetes.io/apisix-cluster: "internal"
spec:
  http:
  - name: backstage-mgmt-api
    match:
      # Internal management endpoints for Backstage to manage APISIX
      paths:
      - "/management/backstage/*"
      methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - HEAD
      - OPTIONS
    backends:
    - serviceName: backstage-proxy
      servicePort: 80
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri: ["^/management/backstage/?(.*)$", "/$1"]
    - name: cors
      enable: true
      config:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,PATCH,HEAD,OPTIONS"
        allow_headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
        expose_headers: "Content-Length,Content-Range"
        allow_credentials: true
---
# APISIX Route for Backstage APIs (internal service-to-service calls)
# These are for services calling Backstage APIs internally, not GUI access
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: backstage-api-internal
  namespace: k8s-api-gateway
  annotations:
    # Target this specific internal APISIX cluster
    apisix.ingress.kubernetes.io/apisix-cluster: "internal"
spec:
  http:
  - name: backstage-internal-api
    priority: 10  # Higher priority for API paths
    match:
      # Internal API access for service-to-service calls
      paths:
      - "/internal-api/backstage/*"
      methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - HEAD
      - OPTIONS
    backends:
    - serviceName: backstage-proxy
      servicePort: 80
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri: ["^/internal-api/backstage/?(.*)$", "/api/$1"]
    - name: cors
      enable: true
      config:
        allow_origins: "*"
        allow_methods: "GET,POST,PUT,DELETE,PATCH,HEAD,OPTIONS"
        allow_headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
        expose_headers: "Content-Length,Content-Range"
        allow_credentials: true
---
# Route for other internal services (not Backstage GUI)
# GUI access is via Teleport - these routes are for internal service mesh communication
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: internal-services
  namespace: k8s-api-gateway
  annotations:
    apisix.ingress.kubernetes.io/apisix-cluster: "internal"
spec:
  http:
  - name: health-checks
    priority: 5  # Medium priority for health endpoints
    match:
      paths:
      - "/health/*"
      - "/healthz"
      - "/ready"
      - "/metrics"
      methods:
      - GET
      - HEAD
    backends:
    - serviceName: backstage-proxy
      servicePort: 80
    plugins:
    - name: cors
      enable: true
      config:
        allow_origins: "*"
        allow_methods: "GET,HEAD"
        allow_headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
        expose_headers: "Content-Length,Content-Range"
        allow_credentials: false
---
