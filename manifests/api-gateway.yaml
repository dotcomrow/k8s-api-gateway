# Backstage ConfigMap with Enhanced GitHub Team Authentication
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: k8s-api-gateway
data:
  app-config.yaml: |
    app:
      title: Platform Portal
      baseUrl: http://backstage.k8s-api-gateway.svc.cluster.local:7007

    organization:
      name: Platform Team

    backend:
      auth:
        keys:
          - secret: $BACKEND_SECRET
      baseUrl: http://backstage.k8s-api-gateway.svc.cluster.local:7007
      listen:
        port: 7007
      csp:
        connect-src: ["'self'", 'http:', 'https:']
      cors:
        origin: http://localhost:3000
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      database:
        client: pg
        connection:
          host: $POSTGRES_HOST
          port: $POSTGRES_PORT
          user: $POSTGRES_USER
          password: $POSTGRES_PASSWORD
          database: $POSTGRES_DB
          ssl: false

    integrations:
      github:
        - host: github.com
          token: <path:secret/data/BACKSTAGE_GITHUB_PAT#value>

    auth:
      environment: development
      providers:
        github:
          development:
            clientId: <path:secret/data/BACKSTAGE_GITHUB_CLIENT_ID#value>
            clientSecret: <path:secret/data/BACKSTAGE_GITHUB_CLIENT_SECRET#value>
            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityName
                - resolver: emailLocalPartMatchingUserEntityName

    # Permission framework configuration for team-based access
    permission:
      enabled: true
      rules:
        - allow: [catalog.entity.read]
          resourceType: catalog-entity
        - allow: [catalog.entity.create, catalog.entity.update, catalog.entity.delete]
          resourceType: catalog-entity
          conditions:
            rule: IS_ENTITY_OWNER
            resourceType: catalog-entity
            params:
              claims: ['group:default/backstage_admin_access']

    scaffolder:
      defaultAuthor:
        name: Platform Team
        email: platform-team@company.com
      defaultCommitMessage: 'Initial commit from Backstage'

    catalog:
      import:
        entityFilename: catalog-info.yaml
        pullRequestBranchName: backstage-integration
      rules:
        - allow: [Component, System, API, Resource, Location, User, Group]
      locations:
        # GitHub organization discovery (update with your org)
        # - type: github-discovery
        #   target: https://github.com/your-org-here/*/blob/-/catalog-info.yaml
        
        # GitHub user/team discovery (update with your org)
        # - type: github-org
        #   target: https://github.com/your-org-here
        #   rules:
        #     - allow: [User, Group]

        # Local example data for development
        - type: file
          target: ../../examples/entities.yaml
        - type: file
          target: ../../examples/template/template.yaml
          rules:
            - allow: [Template]
        - type: file
          target: ../../examples/org.yaml
          rules:
            - allow: [User, Group]
---
# Backstage Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: k8s-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "backstage"
        vault.hashicorp.com/agent-inject-secret-db-creds: "yugabyte-db/static-creds/backstage-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "yugabyte-db/static-creds/backstage-app" -}}
          export POSTGRES_USER="{{ .Data.username }}"
          export POSTGRES_PASSWORD="{{ .Data.password }}"
          {{- end }}
    spec:
      serviceAccountName: backstage
      initContainers:
      - name: backstage-setup
        image: node:18-alpine
        workingDir: /app
        command:
        - sh
        - -c
        - |
          set -e
          echo "Setting up Backstage application..."
          
          # Install system dependencies
          apk add --no-cache python3 make g++ git curl
          
          # Install Backstage CLI globally
          npm install -g @backstage/create-app@latest
          
          # Create Backstage app
          echo "yes" | npx @backstage/create-app@latest --skip-install backstage-app
          
          # Copy the generated app structure
          cp -r backstage-app/* /app/
          
          # Install dependencies
          yarn install --frozen-lockfile --production=false
          
          # Build the backend
          yarn build:backend
          
          echo "Backstage setup complete"
        volumeMounts:
        - name: backstage-data
          mountPath: /app
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
      containers:
      - name: backstage
        image: node:18-alpine
        ports:
        - containerPort: 7007
        env:
        - name: POSTGRES_HOST
          value: "yb-tserver-service.yugabyte.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5433"
        - name: POSTGRES_DB
          value: "backstage"
        - name: BACKEND_SECRET
          value: "your-backend-secret-here-change-this"
        workingDir: /app
        command:
        - sh
        - -c
        - |
          set -e
          
          # Source Vault secrets
          if [ -f /vault/secrets/db-creds ]; then
            source /vault/secrets/db-creds
          fi
          if [ -f /vault/secrets/github ]; then
            source /vault/secrets/github
          fi
          
          # Set default team if not specified
          if [ -z "$GITHUB_TEAM" ]; then
            echo "Warning: No GitHub team specified, using default 'platform-team'"
            export GITHUB_TEAM="platform-team"
          fi
          
          echo "Starting Backstage backend..."
          cd /app
          exec node packages/backend/dist/index.js
        volumeMounts:
        - name: backstage-data
          mountPath: /app
        - name: backstage-config
          mountPath: /app/app-config.yaml
          subPath: app-config.yaml
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /api/catalog/health
            port: 7007
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/catalog/health
            port: 7007
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: backstage-data
        emptyDir: {}
      - name: backstage-config
        configMap:
          name: backstage-config
---
# Backstage Service
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: k8s-api-gateway
spec:
  ports:
  - port: 80
    targetPort: 7007
    name: http
  selector:
    app: backstage
