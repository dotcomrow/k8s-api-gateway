---
# Note: APISIX CRDs are assumed to be already installed cluster-wide
# If needed, they can be installed with: kubectl apply -f https://raw.githubusercontent.com/apache/apisix-ingress-controller/master/samples/deploy/crd/v1/ApisixRoute.yaml
---
# Namespace for Internal API Gateway Platform
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-api-gateway
  labels:
    name: k8s-api-gateway
    tier: internal
  annotations:
    linkerd.io/inject: "enabled"
    linkerd.io/skip-outbound-ports: "8200"
    scheduler.alpha.kubernetes.io/node-selector: "dedicated=work-node"
    field.cattle.io/projectId: "local:infrastructure"
---
# Service Accounts
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apisix
  namespace: k8s-api-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage
  namespace: k8s-api-gateway
---
# RBAC for APISIX (needed for service discovery and CRD management)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apisix
rules:
- apiGroups: [""]
  resources: ["endpoints", "services", "secrets", "configmaps", "pods", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["*"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apisix.apache.org"]
  resources: ["apisixroutes", "apisixupstreams", "apisixtlses", "apisixconsumers", "apisixpluginconfigs", "apisixglobalrules"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "ingressclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apisix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apisix
subjects:
- kind: ServiceAccount
  name: apisix
  namespace: k8s-api-gateway
---
# =========================
# Vault and YugabyteDB Initialization Jobs
# =========================
apiVersion: batch/v1
kind: Job
metadata:
  name: copy-api-gateway-vault-root-token
  namespace: vault
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: copy-secret
          image: alpine/k8s:1.31.4
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          command: ["/bin/sh","-c"]
          args:
            - |
              echo "🔁 Copying 'vault-root-token' from vault → api-gateway..."
              kubectl get secret vault-root-token -n vault -o yaml | \
                sed 's/namespace: vault/namespace: k8s-api-gateway/' | \
                kubectl apply -f -
              echo "✅ Secret copied successfully."
---
# APISIX YugabyteDB Setup Job
apiVersion: batch/v1
kind: Job
metadata:
  name: apisix-yugabyte-config
  namespace: k8s-api-gateway
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=apisix
              ROLE_GROUP=apisix
              ROLE_OWNER=apisix_app
              VAULTADMIN_USER=vaultadmin

              apk add --no-cache postgresql15-client jq netcat-openbsd curl

              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              echo "🧩 Ensuring KV v2 at 'secret/'..."
              while :; do
                if vault secrets list -format=json 2>/dev/null \
                  | jq -e '."secret/".type=="kv" and ."secret/".options.version=="2"' >/dev/null; then
                  echo "✅ 'secret/' is KVv2"; break
                fi
                if vault secrets list -format=json 2>/dev/null | jq -e 'has("secret/")' >/dev/null; then
                  echo "❌ 'secret/' exists but is not KVv2; please migrate manually."; exit 1
                fi
                vault secrets enable -path=secret -version=2 kv && break
                sleep 2
              done

              until getent hosts "$PGHOST" >/dev/null 2>&1; do echo "🔄 Waiting for DNS for $PGHOST..."; sleep 3; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do echo "⏳ Waiting for DB $PGHOST:$PGPORT..."; sleep 3; done
              echo "✅ Yugabyte reachable"

              echo "🔐 Waiting for secret/$VAULTADMIN_USER..."
              VAULTADMIN_PASS=""
              while :; do
                OUT="$(vault kv get -format=json "secret/$VAULTADMIN_USER" 2>/dev/null || true)"
                if [ -n "$OUT" ]; then
                  VAULTADMIN_PASS="$(printf '%s' "$OUT" | jq -r '.data.data.password // .data.data.value // empty')"
                  [ -n "$VAULTADMIN_PASS" ] && [ "$VAULTADMIN_PASS" != "null" ] && break
                fi
                sleep 5
              done
              export PGPASSWORD="$VAULTADMIN_PASS"

              while :; do
                DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)"
                [ "$DB_EXISTS" = "1" ] && { echo "✅ DB '$DB' exists"; break; }
                echo "📦 Creating DB '$DB'..."
                createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null && { echo "✅ DB created"; break; }
                sleep 3
              done

              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$ROLE_GROUP') THEN
                  CREATE ROLE $ROLE_GROUP NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$ROLE_OWNER') THEN
                  CREATE ROLE $ROLE_OWNER LOGIN INHERIT;
                END IF;
              END
              \$\$;
              GRANT $ROLE_GROUP TO $ROLE_OWNER;
              GRANT $ROLE_OWNER TO $VAULTADMIN_USER;
              EOSQL

              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              CREATE SCHEMA IF NOT EXISTS apisix AUTHORIZATION $ROLE_OWNER;
              ALTER ROLE $ROLE_OWNER SET search_path = apisix;
              GRANT CONNECT ON DATABASE $DB TO $ROLE_OWNER;
              GRANT USAGE, CREATE ON SCHEMA apisix TO $ROLE_GROUP;
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA apisix TO $ROLE_GROUP;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA apisix TO $ROLE_GROUP;
              ALTER DEFAULT PRIVILEGES IN SCHEMA apisix
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO $ROLE_GROUP;
              ALTER DEFAULT PRIVILEGES IN SCHEMA apisix
                GRANT USAGE, SELECT ON SEQUENCES TO $ROLE_GROUP;
              EOSQL

              if ! vault secrets list -format=json | jq -e 'has("yugabyte-db/")' >/dev/null 2>&1; then
                vault secrets enable -path=yugabyte-db database
                echo "✅ Enabled database secrets engine"
              fi

              vault write yugabyte-db/static-roles/apisix-app \
                db_name="yugabyte" \
                username="${ROLE_OWNER}" \
                rotation_statements="ALTER ROLE \"{{name}}\" WITH PASSWORD '{{password}}';" \
                rotation_period="24h"

              vault policy write "apisix" - <<'EOF'
              path "yugabyte-db/static-creds/apisix-app"          { capabilities = ["read"] }
              path "secret/data/redis"                            { capabilities = ["read"] }
              EOF

              vault write auth/kubernetes/role/apisix \
                bound_service_account_names="apisix" \
                bound_service_account_namespaces="k8s-api-gateway" \
                policies="apisix" \
                ttl="48h"

              CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/apisix-app)"
              DB_USER="$(printf '%s' "$CREDS_JSON" | jq -r .data.username)"
              DB_PASS="$(printf '%s' "$CREDS_JSON" | jq -r .data.password)"
              export PGPASSWORD="$DB_PASS"
              echo "🔎 Sanity check as $DB_USER"
              psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$DB" -c "SELECT current_user, current_schema();"
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
# Backstage YugabyteDB Setup Job
apiVersion: batch/v1
kind: Job
metadata:
  name: backstage-yugabyte-config
  namespace: k8s-api-gateway
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: Never
      serviceAccountName: default
      volumes:
        - name: root-token
          secret:
            secretName: vault-root-token
      initContainers:
        - name: wait-vault-token-copy
          image: alpine/k8s:1.31.4
          command:
          - sh
          - -c
          - |
            echo "🔧 Waiting for Vault token copy job to complete..."
            
            TOKEN_JOB_NAME="copy-api-gateway-vault-root-token"
            TOKEN_NAMESPACE="vault"
            
            echo "🔍 Waiting for job: $TOKEN_JOB_NAME in namespace: $TOKEN_NAMESPACE"
            
            # Wait for the job to exist
            RETRY_COUNT=0
            MAX_RETRIES=60
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if kubectl get job "$TOKEN_JOB_NAME" -n "$TOKEN_NAMESPACE" >/dev/null 2>&1; then
                echo "✅ Found job $TOKEN_JOB_NAME"
                break
              fi
              
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "⏳ Waiting for job $TOKEN_JOB_NAME to be created... (attempt $RETRY_COUNT/$MAX_RETRIES)"
              
              if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                echo "❌ Job $TOKEN_JOB_NAME not found after $MAX_RETRIES attempts"
                exit 1
              fi
              
              sleep 5
            done
            
            # Wait for the job to complete successfully
            while true; do
              JOB_STATUS=$(kubectl get job "$TOKEN_JOB_NAME" -n "$TOKEN_NAMESPACE" -o json 2>/dev/null || echo '{}')
              
              SUCCEEDED=$(echo "$JOB_STATUS" | jq -r '.status.succeeded // 0')
              FAILED=$(echo "$JOB_STATUS" | jq -r '.status.failed // 0')
              
              if [ "$SUCCEEDED" -gt 0 ]; then
                echo "✅ Vault token copy job completed successfully"
                break
              elif [ "$FAILED" -gt 0 ]; then
                echo "❌ Vault token copy job failed"
                kubectl logs job/"$TOKEN_JOB_NAME" -n "$TOKEN_NAMESPACE" --tail=20 || true
                exit 1
              else
                echo "⏳ Vault token copy job still running..."
                sleep 10
              fi
            done
            
            echo "✅ Vault token is ready, proceeding with database setup"
      containers:
        - name: setup-role
          image: hashicorp/vault:1.15.4
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu

              PGHOST=yb-tserver-service.yugabyte.svc.cluster.local
              PGPORT=5433
              DB=backstage
              ROLE_GROUP=backstage
              ROLE_OWNER=backstage_app
              VAULTADMIN_USER=vaultadmin

              apk add --no-cache postgresql15-client jq netcat-openbsd curl

              export PATH="$PATH:/vault-bin"
              export VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"

              while [ ! -f /vault-token/VAULT_TOKEN ]; do
                echo "🔁 Waiting for Vault token file..."
                sleep 2
              done
              export VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"

              echo "🧩 Ensuring KV v2 at 'secret/'..."
              while :; do
                if vault secrets list -format=json 2>/dev/null \
                  | jq -e '."secret/".type=="kv" and ."secret/".options.version=="2"' >/dev/null; then
                  echo "✅ 'secret/' is KVv2"; break
                fi
                if vault secrets list -format=json 2>/dev/null | jq -e 'has("secret/")' >/dev/null; then
                  echo "❌ 'secret/' exists but is not KVv2; please migrate manually."; exit 1
                fi
                vault secrets enable -path=secret -version=2 kv && break
                sleep 2
              done

              until getent hosts "$PGHOST" >/dev/null 2>&1; do echo "🔄 Waiting for DNS for $PGHOST..."; sleep 3; done
              until nc -z -w1 "$PGHOST" "$PGPORT"; do echo "⏳ Waiting for DB $PGHOST:$PGPORT..."; sleep 3; done
              echo "✅ Yugabyte reachable"

              echo "🔐 Waiting for secret/$VAULTADMIN_USER..."
              VAULTADMIN_PASS=""
              while :; do
                OUT="$(vault kv get -format=json "secret/$VAULTADMIN_USER" 2>/dev/null || true)"
                if [ -n "$OUT" ]; then
                  VAULTADMIN_PASS="$(printf '%s' "$OUT" | jq -r '.data.data.password // .data.data.value // empty')"
                  [ -n "$VAULTADMIN_PASS" ] && [ "$VAULTADMIN_PASS" != "null" ] && break
                fi
                sleep 5
              done
              export PGPASSWORD="$VAULTADMIN_PASS"

              while :; do
                DB_EXISTS="$(psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" 2>/dev/null || true)"
                [ "$DB_EXISTS" = "1" ] && { echo "✅ DB '$DB' exists"; break; }
                echo "📦 Creating DB '$DB'..."
                createdb -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -O "$VAULTADMIN_USER" "$DB" 2>/dev/null && { echo "✅ DB created"; break; }
                sleep 3
              done

              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d yugabyte <<EOSQL
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$ROLE_GROUP') THEN
                  CREATE ROLE $ROLE_GROUP NOLOGIN;
                END IF;
                IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$ROLE_OWNER') THEN
                  CREATE ROLE $ROLE_OWNER LOGIN INHERIT;
                END IF;
              END
              \$\$;
              GRANT $ROLE_GROUP TO $ROLE_OWNER;
              GRANT $ROLE_OWNER TO $VAULTADMIN_USER;
              EOSQL

              psql -h "$PGHOST" -p "$PGPORT" -U "$VAULTADMIN_USER" -d "$DB" <<EOSQL
              -- Create main backstage schema
              CREATE SCHEMA IF NOT EXISTS backstage AUTHORIZATION $ROLE_OWNER;
              
              -- Set up database-level permissions for backstage user
              GRANT CONNECT ON DATABASE $DB TO $ROLE_OWNER;
              GRANT CREATE ON DATABASE $DB TO $ROLE_OWNER;
              GRANT TEMPORARY ON DATABASE $DB TO $ROLE_OWNER;
              
              -- Set up schema permissions for main backstage schema
              GRANT USAGE, CREATE ON SCHEMA backstage TO $ROLE_OWNER;
              GRANT USAGE, CREATE ON SCHEMA backstage TO $ROLE_GROUP;
              
              -- Set up default search path for backstage user (ONLY backstage schema)
              ALTER ROLE $ROLE_OWNER SET search_path = backstage;
              
              -- Set up table and sequence permissions for existing objects in backstage schema
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA backstage TO $ROLE_OWNER;
              GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA backstage TO $ROLE_GROUP;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA backstage TO $ROLE_OWNER;
              GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA backstage TO $ROLE_GROUP;
              
              -- Set up default privileges for future objects in backstage schema
              ALTER DEFAULT PRIVILEGES IN SCHEMA backstage
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO $ROLE_OWNER;
              ALTER DEFAULT PRIVILEGES IN SCHEMA backstage
                GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO $ROLE_GROUP;
              ALTER DEFAULT PRIVILEGES IN SCHEMA backstage
                GRANT USAGE, SELECT ON SEQUENCES TO $ROLE_OWNER;
              ALTER DEFAULT PRIVILEGES IN SCHEMA backstage
                GRANT USAGE, SELECT ON SEQUENCES TO $ROLE_GROUP;
                
              -- Grant role membership
              GRANT $ROLE_GROUP TO $ROLE_OWNER;
              
              EOSQL

              if ! vault secrets list -format=json | jq -e 'has("yugabyte-db/")' >/dev/null 2>&1; then
                vault secrets enable -path=yugabyte-db database
                echo "✅ Enabled database secrets engine"
              fi

              vault write yugabyte-db/static-roles/backstage-app \
                db_name="yugabyte" \
                username="$ROLE_OWNER" \
                rotation_statements="ALTER ROLE \"{{name}}\" WITH PASSWORD '{{password}}';" \
                rotation_period="24h"

              vault policy write "backstage" - <<'EOF'
              path "yugabyte-db/static-creds/backstage-app"       { capabilities = ["read"] }
              path "secret/data/backstage/github"                 { capabilities = ["read"] }
              EOF

              vault write auth/kubernetes/role/backstage \
                bound_service_account_names="backstage" \
                bound_service_account_namespaces="k8s-api-gateway" \
                policies="backstage" \
                ttl="48h"

              CREDS_JSON="$(vault read -format=json yugabyte-db/static-creds/backstage-app)"
              DB_USER="$(printf '%s' "$CREDS_JSON" | jq -r .data.username)"
              DB_PASS="$(printf '%s' "$CREDS_JSON" | jq -r .data.password)"
              export PGPASSWORD="$DB_PASS"
              echo "🔎 Sanity check as $DB_USER"
              psql -h "$PGHOST" -p "$PGPORT" -U "$DB_USER" -d "$DB" -c "SELECT current_user, current_schema();"
          volumeMounts:
            - name: root-token
              mountPath: /vault-token
              readOnly: true
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
---
# APISIX ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: apisix-config
  namespace: k8s-api-gateway
data:
  config.yaml: |
    # APISIX Configuration for v3.6.0
    apisix:
      node_listen:
        - 9080
      enable_admin: true
      enable_dev_mode: false
      enable_reuseport: true
      show_upstream_status_in_response_header: false
      enable_ipv6: false
      enable_http2: true
      enable_server_tokens: false
      extra_lua_path: ""
      extra_lua_cpath: ""
      
      proxy_cache:
        cache_ttl: 10s
        zones:
          - name: disk_cache_one
            memory_size: 50m
            disk_size: 1G
            disk_path: /tmp/disk_cache_one
            cache_levels: "1:2"
          - name: memory_cache
            memory_size: 50m
      
      delete_uri_tail_slash: false
      normalize_uri_like_servlet: false
      
      router:
        http: radixtree_host_uri
        ssl: radixtree_sni
      
      proxy_mode: "http"
      resolver_timeout: 5
      enable_resolv_search_opt: true
      
      ssl:
        enable: true
        listen:
          - port: 9443
            enable_http3: false
        ssl_protocols: TLSv1.2 TLSv1.3
        ssl_ciphers: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
        ssl_session_tickets: false
      
      enable_control: true
      disable_sync_configuration_during_start: false
      worker_startup_time_threshold: 60
      
      data_encryption:
        enable_encrypt_fields: true
        keyring:
          - PLACEHOLDER_KEY_1_WILL_BE_REPLACED
          - PLACEHOLDER_KEY_2_WILL_BE_REPLACED
      
      events:
        module: lua-resty-events

    nginx_config:
      error_log: logs/error.log
      error_log_level: warn
      worker_processes: auto
      enable_cpu_affinity: false
      worker_rlimit_nofile: 20480
      worker_shutdown_timeout: 240s
      max_pending_timers: 16384
      max_running_timers: 4096
      
      event:
        worker_connections: 10620
      
      meta:
        lua_shared_dict:
          prometheus-metrics: 15m
          prometheus-cache: 10m
          standalone-config: 10m
      
      stream:
        enable_access_log: false
        access_log: logs/access_stream.log
        access_log_format: |
          "$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time"
        access_log_format_escape: default
        lua_shared_dict:
          etcd-cluster-health-check-stream: 10m
          lrucache-lock-stream: 10m
          plugin-limit-conn-stream: 10m
          worker-events-stream: 10m
          tars-stream: 1m
          upstream-healthcheck-stream: 10m
      
      http:
        enable_access_log: true
        access_log: logs/access.log
        access_log_buffer: 16384
        access_log_format: |
          "$remote_addr - $remote_user [$time_local] $http_host \"$request\" $status $body_bytes_sent $request_time \"$http_referer\" \"$http_user_agent\" $upstream_addr $upstream_status $upstream_response_time \"$upstream_scheme://$upstream_host$upstream_uri\""
        access_log_format_escape: default
        keepalive_timeout: 60s
        client_header_timeout: 60s
        client_body_timeout: 60s
        client_max_body_size: 0
        send_timeout: 10s
        underscores_in_headers: "on"
        real_ip_header: X-Real-IP
        real_ip_recursive: "off"
        real_ip_from:
          - 127.0.0.1
          - "unix:"
        proxy_ssl_server_name: true
        
        upstream:
          keepalive: 320
          keepalive_requests: 1000
          keepalive_timeout: 60s
        
        charset: utf-8
        variables_hash_max_size: 2048
        
        lua_shared_dict:
          internal-status: 10m
          plugin-limit-req: 10m
          plugin-limit-count: 10m
          prometheus-metrics: 10m
          plugin-limit-conn: 10m
          upstream-healthcheck: 10m
          worker-events: 10m
          lrucache-lock: 10m
          balancer-ewma: 10m
          balancer-ewma-locks: 10m
          balancer-ewma-last-touched-at: 10m
          plugin-limit-req-redis-cluster-slot-lock: 1m
          plugin-limit-count-redis-cluster-slot-lock: 1m
          plugin-limit-conn-redis-cluster-slot-lock: 1m
          tracing_buffer: 10m
          plugin-api-breaker: 10m
          etcd-cluster-health-check: 10m
          discovery: 1m
          jwks: 1m
          introspection: 10m
          access-tokens: 1m
          ext-plugin: 1m
          tars: 1m
          cas-auth: 10m
          ocsp-stapling: 10m
          mcp-session: 10m

    plugin_attr:
      prometheus:
        export_uri: /apisix/prometheus/metrics
        metric_prefix: apisix_
        enable_export_server: true
        export_addr:
          ip: 0.0.0.0
          port: 9091
        refresh_interval: 15

    deployment:
      role: data_plane
      role_data_plane:
        config_provider: etcd
      admin:
        admin_key_required: true
        admin_key:
          - name: "admin"
            key: edd1c9f034335f136f87ad84b625c8f1
            role: admin
        enable_admin_cors: true
        enable_admin_ui: true
        allow_admin:
