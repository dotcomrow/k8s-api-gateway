# APISIX Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: k8s-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apisix
  template:
    metadata:
      labels:
        app: apisix
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "apisix"
        vault.hashicorp.com/agent-inject-secret-db-creds: "yugabyte-db/static-creds/apisix-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "yugabyte-db/static-creds/apisix-app" -}}
          export DB_USER="{{ .Data.username }}"
          export DB_PASSWORD="{{ .Data.password }}"
          {{- end }}
    spec:
      serviceAccountName: apisix
      initContainers:
      - name: wait-etcd
        image: busybox:1.35
        command: 
        - sh
        - -c
        - |
          until nc -z apisix-etcd 2379; do
            echo "Waiting for etcd..."
            sleep 2
          done
          echo "etcd is ready"
      - name: debug-config
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          echo "🔍 Debugging APISIX configuration..."
          echo "Contents of /usr/local/apisix/conf/:"
          ls -la /usr/local/apisix/conf/ || echo "Directory not accessible"
          echo "Contents of config.yaml:"
          cat /usr/local/apisix/conf/config.yaml || echo "config.yaml not found"
          echo "Environment variables:"
          env | grep APISIX || echo "No APISIX env vars"
        volumeMounts:
        - name: apisix-config
          mountPath: /usr/local/apisix/conf/config.yaml
          subPath: config.yaml
      - name: wait-vault-setup
        image: alpine/k8s:1.31.4
        command:
        - sh
        - -c
        - |
          echo "Waiting for APISIX Vault setup job to complete..."
          
          # Wait for both setup jobs to complete successfully
          # First job copies vault token from vault namespace
          TOKEN_JOB_NAME="copy-api-gateway-vault-root-token"
          TOKEN_NAMESPACE="vault"
          # Second job sets up database and vault roles
          CONFIG_JOB_NAME="apisix-yugabyte-config"
          CONFIG_NAMESPACE="k8s-api-gateway"
          
          # Function to wait for a job to complete
          wait_for_job() {
            local job_name="$1"
            local namespace="$2"
            
            echo "🔍 Waiting for job: $job_name in namespace: $namespace"
            
            # Wait for the job to exist
            RETRY_COUNT=0
            MAX_RETRIES=30
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if kubectl get job "$job_name" -n "$namespace" >/dev/null 2>&1; then
                echo "✅ Found job $job_name"
                break
              fi
              
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "⏳ Waiting for job $job_name to be created... (attempt $RETRY_COUNT/$MAX_RETRIES)"
              
              if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                echo "❌ Job $job_name not found after $MAX_RETRIES attempts"
                echo "📋 Current jobs in namespace $namespace:"
                kubectl get jobs -n "$namespace" || true
                return 1
              fi
              
              sleep 5
            done
            
            # Wait for the job to complete
            while true; do
              JOB_STATUS=$(kubectl get job "$job_name" -n "$namespace" -o json 2>/dev/null || echo '{}')
              
              SUCCEEDED=$(echo "$JOB_STATUS" | jq -r '.status.succeeded // 0')
              FAILED=$(echo "$JOB_STATUS" | jq -r '.status.failed // 0')
              ACTIVE=$(echo "$JOB_STATUS" | jq -r '.status.active // 0')
              
              echo "📊 Job $job_name status - Succeeded: $SUCCEEDED, Failed: $FAILED, Active: $ACTIVE"
              
              if [ "$SUCCEEDED" -gt 0 ]; then
                echo "✅ Job $job_name completed successfully"
                return 0
              elif [ "$FAILED" -gt 0 ]; then
                echo "❌ Job $job_name failed. Checking logs:"
                kubectl logs job/"$job_name" -n "$namespace" --tail=20 || true
                return 1
              else
                echo "⏳ Job $job_name still running..."
                sleep 10
              fi
            done
          }
          
          # Wait for both jobs in sequence
          echo "🔧 Step 1: Waiting for vault token copy job..."
          if ! wait_for_job "$TOKEN_JOB_NAME" "$TOKEN_NAMESPACE"; then
            echo "❌ Vault token copy job failed"
            exit 1
          fi
          
          echo "🔧 Step 2: Waiting for APISIX configuration job..."
          if ! wait_for_job "$CONFIG_JOB_NAME" "$CONFIG_NAMESPACE"; then
            echo "❌ APISIX configuration job failed"
            exit 1
          fi
          
          echo "APISIX Vault setup job completed successfully, proceeding with APISIX startup"
      containers:
      - name: apisix
        image: apache/apisix:3.6.0-debian
        command: ["/bin/sh"]
        args: 
        - -c
        - |
          echo "🔧 Starting APISIX with custom configuration..."
          
          # Generate random encryption keys directly in container
          echo "🔐 Generating random encryption keys for APISIX data encryption..."
          APISIX_ENCRYPTION_KEY_1="$(openssl rand -hex 16)"
          APISIX_ENCRYPTION_KEY_2="$(openssl rand -hex 16)"
          echo "✅ Generated encryption keys successfully"
          
          echo "📋 Default config contents:"
          cat /usr/local/apisix/conf/config-default.yaml | head -20
          echo "📋 Our custom config contents:"
          cat /usr/local/apisix/conf/config.yaml
          
          echo "🔄 Backing up default config and injecting encryption keys..."
          cd /usr/local/apisix/conf
          mv config-default.yaml config-default.yaml.bak
          
          # Replace placeholder encryption keys with real ones from Vault
          sed -e "s/PLACEHOLDER_KEY_1_WILL_BE_REPLACED/$APISIX_ENCRYPTION_KEY_1/g" \
              -e "s/PLACEHOLDER_KEY_2_WILL_BE_REPLACED/$APISIX_ENCRYPTION_KEY_2/g" \
              config.yaml > config-default.yaml
          
          echo "🔐 Updated encryption keys in configuration"
          
          echo "🚀 Initializing APISIX..."
          cd /usr/local/apisix
          /usr/local/openresty/luajit/bin/luajit ./apisix/cli/apisix.lua init
          echo "🔗 Initializing etcd..."
          /usr/local/openresty/luajit/bin/luajit ./apisix/cli/apisix.lua init_etcd
          echo "▶️ Starting APISIX..."
          exec /usr/local/openresty/luajit/bin/luajit ./apisix/cli/apisix.lua start
        ports:
        - containerPort: 9080
        - containerPort: 9180
        - containerPort: 9443
        - containerPort: 9091
        volumeMounts:
        - name: apisix-config
          mountPath: /usr/local/apisix/conf/config.yaml
          subPath: config.yaml
        env:
        - name: APISIX_STAND_ALONE
          value: "false"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          tcpSocket:
            port: 9080
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 10
        readinessProbe:
          tcpSocket:
            port: 9080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
          successThreshold: 1
      volumes:
      - name: apisix-config
        configMap:
          name: apisix-config
