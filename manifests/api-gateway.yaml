# APISIX Ingress Controller for Internal API Gateway
# This controller manages the internal APISIX cluster separately from your edge gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-ingress-controller-internal
  namespace: k8s-api-gateway
  labels:
    app: apisix-ingress-controller-internal
    tier: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix-ingress-controller-internal
  template:
    metadata:
      labels:
        app: apisix-ingress-controller-internal
        tier: internal
    spec:
      serviceAccountName: apisix
      containers:
      - name: apisix-ingress-controller
        image: apache/apisix-ingress-controller:1.8.0
        args:
        - ingress
        - --config-path=/usr/local/apisix-ingress-controller/conf/config.yaml
        volumeMounts:
        - name: config-volume
          mountPath: /usr/local/apisix-ingress-controller/conf/config.yaml
          subPath: config.yaml
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: APISIX_CLUSTER_NAME
          value: "internal"
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8443
          name: https
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config-volume
        configMap:
          name: apisix-ingress-controller-config
