---
# Gravitee Teleport Proxy Config
apiVersion: v1
kind: ConfigMap
metadata:
  name: gravitee-teleport-proxy
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "5"
data:
  nginx.conf: |-
    worker_processes  1;

    events {
        worker_connections  1024;
    }

    http {
        server_names_hash_bucket_size 128;
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        sendfile        on;
        keepalive_timeout  65;

        upstream gravitee_portal {
            server gravitee-portal.k8s-api-gateway.svc.cluster.local:8080;
        }

        upstream gravitee_management {
            server gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083;
        }

        upstream gravitee_management_ui {
            server gravitee-management-ui.k8s-api-gateway.svc.cluster.local:8080;
        }

        server {
            listen 8080;
            listen [::]:8080;

            server_name gravitee-management.teleport.app.suncoast.systems;

            location / {
                proxy_pass http://gravitee_management_ui;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Port 443;
            }

            # Management REST API (and UI if deployed behind /management)
            location /management/ {
                proxy_pass http://gravitee_management$request_uri;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Port 443;
            }

            # Portal API endpoint (used by the Angular UI when portal URL is same-origin)
            location /portal/ {
                if ($request_method = OPTIONS) {
                    add_header 'Access-Control-Allow-Origin' 'https://gravitee-management.teleport.app.suncoast.systems' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Cache-Control, Pragma, Origin, Authorization, Content-Type, X-Requested-With, If-Match, If-None-Match, X-Gravitee-*' always;
                    add_header 'Access-Control-Allow-Credentials' 'true' always;
                    add_header 'Access-Control-Max-Age' '1728000' always;
                    return 204;
                }

                add_header 'Access-Control-Allow-Origin' 'https://gravitee-management.teleport.app.suncoast.systems' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                proxy_pass http://gravitee_management$request_uri;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Port 443;
            }
        }

        server {
            listen 8080 default_server;
            listen [::]:8080 default_server;

            server_name gravitee.teleport.app.suncoast.systems;

            # Portal static assets (default path)
            location / {
                proxy_pass http://gravitee_portal;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Port 443;
            }

            # Portal API endpoint (used by the Angular UI)
            location /portal/ {
                if ($request_method = OPTIONS) {
                    add_header 'Access-Control-Allow-Origin' 'https://gravitee-management.teleport.app.suncoast.systems' always;
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                    add_header 'Access-Control-Allow-Headers' 'Cache-Control, Pragma, Origin, Authorization, Content-Type, X-Requested-With, If-Match, If-None-Match, X-Gravitee-*' always;
                    add_header 'Access-Control-Allow-Credentials' 'true' always;
                    add_header 'Access-Control-Max-Age' '1728000' always;
                    return 204;
                }

                add_header 'Access-Control-Allow-Origin' 'https://gravitee-management.teleport.app.suncoast.systems' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                proxy_pass http://gravitee_management$request_uri;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Port 443;
            }

            # Management REST API
            location /management/ {
                proxy_pass http://gravitee_management$request_uri;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Port 443;
            }
        }
    }
