---
# Gravitee Teleport Proxy Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitee-teleport-proxy
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gravitee-teleport-proxy
  template:
    metadata:
      labels:
        app: gravitee-teleport-proxy
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: gravitee
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: proxy-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
      volumes:
      - name: proxy-config
        configMap:
          name: gravitee-teleport-proxy
---
