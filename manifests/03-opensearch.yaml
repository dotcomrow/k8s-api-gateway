apiVersion: v1
kind: ConfigMap
metadata:
  name: gravitee-opensearch-config
  namespace: k8s-api-gateway
data:
  opensearch.yml: |-
    cluster.name: gravitee-opensearch
    node.name: ${HOSTNAME}
    network.host: 0.0.0.0
    http.port: 9200
    discovery.type: single-node
    plugins.security.disabled: true
    compatibility.override_main_response_version: true
---
apiVersion: v1
kind: Service
metadata:
  name: gravitee-opensearch
  namespace: k8s-api-gateway
  labels:
    app.kubernetes.io/name: gravitee-opensearch
spec:
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: metrics
      port: 9600
      targetPort: 9600
  selector:
    app.kubernetes.io/name: gravitee-opensearch
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gravitee-opensearch
  namespace: k8s-api-gateway
  labels:
    app.kubernetes.io/name: gravitee-opensearch
spec:
  serviceName: gravitee-opensearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gravitee-opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gravitee-opensearch
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.11.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9600
              name: metrics
          env:
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /usr/share/opensearch/config/opensearch.yml
              subPath: opensearch.yml
            - name: data
              mountPath: /usr/share/opensearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: config
          configMap:
            name: gravitee-opensearch-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gravitee-opensearch-init
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    linkerd.io/inject: "disabled"
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-index
          image: curlimages/curl:8.5.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              OS_URL="http://gravitee-opensearch.k8s-api-gateway.svc.cluster.local:9200"
              echo "Waiting for OpenSearch..."
              for _ in $(seq 1 60); do
                if curl -fsS "$OS_URL/_cluster/health" >/dev/null; then
                  echo "OpenSearch is ready."
                  break
                fi
                sleep 2
              done

              STATUS="$(curl -s -o /dev/null -w "%{http_code}" "$OS_URL/gravitee")"
              if [ "$STATUS" = "404" ]; then
                echo "Creating gravitee index..."
                curl -fsS -X PUT "$OS_URL/gravitee" >/dev/null
              else
                echo "gravitee index already exists (status $STATUS)."
              fi
