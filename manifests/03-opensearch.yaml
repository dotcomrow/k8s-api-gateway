apiVersion: v1
kind: ConfigMap
metadata:
  name: gravitee-opensearch-config
  namespace: k8s-api-gateway
data:
  opensearch.yml: |-
    cluster.name: gravitee-opensearch
    node.name: ${HOSTNAME}
    network.host: 0.0.0.0
    http.port: 9200
    discovery.type: single-node
    plugins.security.disabled: true
    compatibility.override_main_response_version: false
---
apiVersion: v1
kind: Service
metadata:
  name: gravitee-opensearch
  namespace: k8s-api-gateway
  labels:
    app.kubernetes.io/name: gravitee-opensearch
spec:
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: metrics
      port: 9600
      targetPort: 9600
  selector:
    app.kubernetes.io/name: gravitee-opensearch
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gravitee-opensearch
  namespace: k8s-api-gateway
  labels:
    app.kubernetes.io/name: gravitee-opensearch
spec:
  serviceName: gravitee-opensearch
  replicas: 1
  updateStrategy:
    type: OnDelete
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: gravitee-opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gravitee-opensearch
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.11.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9600
              name: metrics
          env:
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /usr/share/opensearch/config/opensearch.yml
              subPath: opensearch.yml
            - name: data
              mountPath: /usr/share/opensearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: gravitee-opensearch-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gravitee-opensearch-init
  namespace: k8s-api-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    linkerd.io/inject: "disabled"
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-index
          image: curlimages/curl:8.5.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              OS_URL="http://gravitee-opensearch.k8s-api-gateway.svc.cluster.local:9200"
              echo "Waiting for OpenSearch..."
              for _ in $(seq 1 60); do
                if curl -fsS "$OS_URL/_cluster/health" >/dev/null; then
                  echo "OpenSearch is ready."
                  break
                fi
                sleep 2
              done

              echo "Waiting for Gravitee index templates..."
              for _ in $(seq 1 60); do
                if curl -fsS "$OS_URL/_template/gravitee-v4-metrics" >/dev/null; then
                  echo "Templates are ready."
                  break
                fi
                sleep 2
              done

              echo "Ensuring gravitee-health template includes @timestamp..."
              cat <<'EOF' >/tmp/gravitee-health-template.json
              {
                "index_patterns": ["gravitee-health*"],
                "settings": {
                  "index": {
                    "number_of_shards": "1",
                    "number_of_replicas": "1",
                    "refresh_interval": "5s"
                  }
                },
                "mappings": {
                  "properties": {
                    "@timestamp": { "type": "date" },
                    "api": { "type": "keyword" },
                    "api-name": { "type": "keyword" },
                    "available": { "type": "boolean", "index": false },
                    "endpoint": { "type": "keyword" },
                    "gateway": { "type": "keyword" },
                    "response-time": { "type": "integer" },
                    "state": { "type": "integer", "index": false },
                    "steps": { "type": "object", "enabled": false },
                    "success": { "type": "boolean", "index": true },
                    "transition": { "type": "boolean" }
                  }
                },
                "aliases": {}
              }
              EOF
              
              curl -fsS -X PUT "$OS_URL/_template/gravitee-health" \
                -H "Content-Type: application/json" \
                --data-binary @/tmp/gravitee-health-template.json >/dev/null
              echo "Updated gravitee-health template."

              echo "Ensuring 14-day ISM retention policy..."
              POLICY_NAME="gravitee-14d"
              if ! curl -fsS "$OS_URL/_plugins/_ism/policies/$POLICY_NAME" >/dev/null; then
                cat <<'EOF' >/tmp/gravitee-ism-policy.json
              {
                "policy": {
                  "description": "Delete gravitee indices after 14 days",
                  "default_state": "hot",
                  "states": [
                    {
                      "name": "hot",
                      "actions": [],
                      "transitions": [
                        {
                          "state_name": "delete",
                          "conditions": {
                            "min_index_age": "14d"
                          }
                        }
                      ]
                    },
                    {
                      "name": "delete",
                      "actions": [
                        {
                          "delete": {}
                        }
                      ],
                      "transitions": []
                    }
                  ],
                  "ism_template": [
                    {
                      "index_patterns": ["gravitee-*"],
                      "priority": 100
                    }
                  ]
                }
              }
              EOF
              
                curl -fsS -X PUT "$OS_URL/_plugins/_ism/policies/$POLICY_NAME" \
                  -H "Content-Type: application/json" \
                  --data-binary @/tmp/gravitee-ism-policy.json >/dev/null
                echo "Created ISM policy $POLICY_NAME."
              fi

              INDEX_DAYS="${GRAVITEE_INDEX_DAYS:-14}"
              NOW_EPOCH="$(date -u +%s)"
              for OFFSET in $(seq 0 $((INDEX_DAYS - 1))); do
                TARGET_EPOCH="$((NOW_EPOCH - (OFFSET * 86400)))"
                DATE="$(date -u -d "@${TARGET_EPOCH}" +%Y.%m.%d)"
                INDICES="gravitee gravitee-log-$DATE gravitee-request-$DATE \
                  gravitee-v4-log-$DATE gravitee-v4-metrics-$DATE \
                  gravitee-v4-message-log-$DATE gravitee-v4-message-metrics-$DATE \
                  gravitee-health-$DATE gravitee-monitor-$DATE"

                for IDX in $INDICES; do
                  STATUS="$(curl -s -o /dev/null -w "%{http_code}" "$OS_URL/$IDX")"
                  if [ "$STATUS" = "200" ]; then
                    if ! curl -s "$OS_URL/$IDX/_mapping" | grep -q '"@timestamp"'; then
                      echo "Index $IDX missing @timestamp mapping; recreating..."
                      curl -fsS -X DELETE "$OS_URL/$IDX" >/dev/null
                      STATUS="404"
                    else
                      echo "Index $IDX already exists with mappings."
                    fi
                  fi

                  if [ "$STATUS" = "404" ]; then
                    echo "Creating index $IDX..."
                    curl -fsS -X PUT "$OS_URL/$IDX" >/dev/null
                  fi
                done
              done

              echo "Attaching ISM policy to existing gravitee indices..."
              for IDX in $(curl -s "$OS_URL/_cat/indices/gravitee-*?h=index" | tr -d '\r'); do
                [ -n "$IDX" ] || continue
                curl -fsS -X POST "$OS_URL/_plugins/_ism/add/$IDX" \
                  -H "Content-Type: application/json" \
                  --data-binary "{\"policy_id\":\"$POLICY_NAME\"}" >/dev/null || true
              done
