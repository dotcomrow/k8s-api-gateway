############################################################################################################
# Gravitee.io API Gateway Configuration for YugabyteDB and APISIX Integration
############################################################################################################
gravitee:
  # Management API connection
  management:
    url: http://gravitee-management-api.k8s-api-gateway.svc.cluster.local:8083

# HTTP server configuration  
http:
  port: 8082
  host: 0.0.0.0
  
# Cache configuration (use the bundled standalone cache manager / Ehcache)
cache:
  type: standalone
  standalone:
    config: ${gravitee.home}/config/ehcache.xml

# Sharding tags for multi-gateway deployments
sharding_tags: ${SHARDING_TAGS:}

# Multi-tenant configuration  
tenant: ${TENANT:}

# Plugin repository
plugins:
  path: ${gravitee.home}/plugins

# Management repository (JDBC)
management:
  type: jdbc
  jdbc:
    url: ${MANAGEMENT_JDBC_URL:jdbc:postgresql://${YUGABYTE_HOST:yugabytedb-service.k8s-api-gateway.svc.cluster.local}:${YUGABYTE_PORT:5433}/${YUGABYTE_DATABASE:gravitee}?currentSchema=${YUGABYTE_SCHEMA:gravitee}}
    username: ${YUGABYTE_USER:gravitee_app}
    password: ${YUGABYTE_PASSWORD}
    schema: ${YUGABYTE_SCHEMA:gravitee}
    pool:
      maxPoolSize: ${MANAGEMENT_JDBC_POOL_MAX_POOL_SIZE:4}
      minIdle: ${MANAGEMENT_JDBC_POOL_MIN_IDLE:0}
      connectionTimeout: ${MANAGEMENT_JDBC_POOL_CONNECTION_TIMEOUT:10000}
      idleTimeout: ${MANAGEMENT_JDBC_POOL_IDLE_TIMEOUT:30000}
      maxLifetime: ${MANAGEMENT_JDBC_POOL_MAX_LIFETIME:600000}
      autoCommit: true
      registerMbeans: false

# Gateway services
services:
  # Kubernetes service discovery
  discovery:
    kubernetes:
      enabled: true
      service:
        # Empty means watch all namespaces.
        namespace: ${K8S_NAMESPACE:}

  # Sync service for management repository
  sync:
    # Synchronization delay
    delay: 5000
    unit: MILLISECONDS
    distributed: false

  # Monitoring and metrics  
  monitoring:
    delay: 5000
    unit: MILLISECONDS
    distributed: false

  cache:
    enabled: false

  heartbeat:
    enabled: true

  alert:
    enabled: false

  # APISIX route sync service
  apisix-sync:
    enabled: ${APISIX_SYNC_ENABLED:true}
    admin-url: ${APISIX_ADMIN_URL:http://apisix-admin.k8s-api-gateway.svc.cluster.local:9180}
    admin-key: ${APISIX_ADMIN_KEY}
    sync-interval: ${APISIX_SYNC_INTERVAL:30000}

# Security configuration
security:
  keystore:
    type: ${KEYSTORE_TYPE:JKS}  
    path: ${KEYSTORE_PATH:${gravitee.home}/security/keystore.jks}
    password: ${KEYSTORE_PASSWORD}
  truststore:
    type: ${TRUSTSTORE_TYPE:JKS}
    path: ${TRUSTSTORE_PATH:${gravitee.home}/security/truststore.jks}
    password: ${TRUSTSTORE_PASSWORD}

# Rate limiting - using YugabyteDB for distributed rate limiting
ratelimit:
  type: jdbc
  jdbc:
    url: ${RATELIMIT_JDBC_URL:jdbc:postgresql://${YUGABYTE_HOST:yugabytedb-service.k8s-api-gateway.svc.cluster.local}:${YUGABYTE_PORT:5433}/${YUGABYTE_DATABASE:gravitee}?currentSchema=${YUGABYTE_SCHEMA:gravitee}}
    username: ${YUGABYTE_USER:gravitee_app} 
    password: ${YUGABYTE_PASSWORD}
    schema: ${YUGABYTE_SCHEMA:gravitee}
    pool:
      maxPoolSize: ${RATELIMIT_JDBC_POOL_MAX_POOL_SIZE:4}
      minIdle: ${RATELIMIT_JDBC_POOL_MIN_IDLE:0}
      connectionTimeout: ${RATELIMIT_JDBC_POOL_CONNECTION_TIMEOUT:10000}
      idleTimeout: ${RATELIMIT_JDBC_POOL_IDLE_TIMEOUT:30000}
      maxLifetime: ${RATELIMIT_JDBC_POOL_MAX_LIFETIME:600000}
      autoCommit: true
      registerMbeans: false

# Analytics configuration (OSS analytics via OpenSearch)
analytics:
  type: elasticsearch
  elasticsearch:
    endpoints:
      - http://gravitee-opensearch.k8s-api-gateway.svc.cluster.local:9200
    index: ${ANALYTICS_ES_INDEX:gravitee}

# Distributed cache for API keys and subscriptions (already configured above)

# Health check configuration
node:
  cache:
    enabled: false
  heartbeat:
    enabled: true
  alert:
    enabled: false
  services:
    cache:
      enabled: false
    heartbeat:
      enabled: true
    alert:
      enabled: false
  name: ${NODE_NAME:gravitee-gateway}
  metadata:
    node.id: ${NODE_ID:${random.uuid}}

# Logging configuration
logging:
  level:
    io.gravitee: ${GRAVITEE_LOG_LEVEL:INFO}
    org.springframework: ${SPRING_LOG_LEVEL:WARN}
    org.eclipse.jetty: ${JETTY_LOG_LEVEL:WARN}

# Reporters - send metrics to multiple systems
reporters:
  # File reporter for debugging
  file:
    enabled: true
    fileName: ${gravitee.home}/logs/gravitee_metrics_%s.json

# API endpoints exposure  
api:
  # Health check endpoint
  health:
    enabled: true
  # Node information endpoint  
  node:
    enabled: true
